}

// ── Shared time-input blur normaliser ────────────────────────────────────────
// B2: shares parseTimeParts with makeTS so Home and Manage normalise identically.
// O1: previously `clock` was App-level state ticking every 1000ms, which
// re-rendered the ENTIRE tree once a second — every dropdown's usage ranking,
// every icon lookup, Today's Log, Reports tables, all recomputed 60x/minute
// for a display that only ever appears in this one header span. The interval
// now lives inside this leaf component, so a tick re-renders only the clock.
function Clock({T}){
  const[clock,setClock]=useState(nowTime());
  useEffect(()=>{const t=setInterval(()=>setClock(nowTime()),1000);return()=>clearInterval(t);},[]);
  return <div style={{fontFamily:"'DM Mono',monospace",fontSize:"0.88rem",color:T.waterBtnText}}>{clock}</div>;
}

// E3: warns when something has been sitting in the offline queue for over an
// hour — a silent long-lived queue was the one remaining genuine data-loss
// path (an entry can live on-device-only for hours with nothing visible
// saying so). Ticks its own state every 60s to recompute the age text, kept
// as an isolated leaf component so that tick doesn't re-render the app (same
// reasoning as Clock, O1).
function QueueAgeBadge({queueOldestAt,onSyncNow,T}){
  const[,forceTick]=useState(0);
  useEffect(()=>{
    if(!queueOldestAt)return;
    const t=setInterval(()=>forceTick(x=>x+1),60000);
    return()=>clearInterval(t);
  },[queueOldestAt]);
  if(!queueOldestAt)return null;
  const ageMin=Math.floor((Date.now()-queueOldestAt)/60000);
  if(ageMin<60)return null; // only surface once something is genuinely stuck
  const ageH=(ageMin/60).toFixed(1);
  return(
    <div style={{display:"flex",alignItems:"center",gap:8,padding:"7px 13px",background:T.dangerBg||T.accentBg,borderBottom:`1px solid ${T.danger}`,fontSize:"0.72rem",color:T.danger,flexShrink:0}}>
      <span style={{flex:1,lineHeight:1.5}}>⚠️ Some entries have been waiting to sync for <b>{ageH}h</b>. They're safe on this device, but check your connection.</span>
      <button onClick={onSyncNow} style={{flexShrink:0,padding:"4px 9px",fontSize:"0.72rem",borderRadius:6,border:`1px solid ${T.danger}`,background:"none",color:T.danger,cursor:"pointer",fontFamily:"inherit",fontWeight:600}}>Retry sync</button>
    </div>
  );
}
const normTime=setter=>e=>{
  const v=e.target.value;
  if(!String(v).replace(/[^0-9]/g,""))return;
  const[h,mi]=parseTimeParts(v);
  setter(String(h).padStart(2,"0")+":"+String(mi).padStart(2,"0"));
};

function ExerciseEntry({settings,entries,onAdd,entryTime,setEntryTime,refreshTime,T}){
  const[et,setEt]=useState("");const[sub,setSub]=useState("");const[notes,setNotes]=useState("");const[fl,setFl]=useState(false);
  // One state slot per possible metric field, keyed the same as EXERCISE_METRIC_DEFS.
  const[vals,setVals]=useState({dist:"",time:"",count:"",hr:"",steps:"",speed:""});
  const setVal=(field,v)=>setVals(p=>({...p,[field]:v}));
  const exTypes=settings.exerciseTypes||FD.exerciseTypes;
  const exCounts=useMemo(()=>usageCounts(entries,e=>e.type==="exercise",e=>e.exType),[entries]);
  const rankedExTypes=byUsage(exTypes||[],exCounts,e=>e.name);
  const etObj=exTypes?.find(e=>e.name===et);

  const fdEx=FD.exerciseTypes?.find(e=>e.name===et);

  // an intentionally-empty list (LogJam) apart from data Firebase had

  const decodedMetrics=normalizeMetrics(storedMetrics);
  const etMetrics=decodedMetrics!==null?decodedMetrics:(fdEx?.metrics||["time"]);
  const hasSub=etObj?.subTypes?.length>0;
  const exSubCounts=useMemo(()=>usageCounts(entries,e=>e.type==="exercise"&&e.exType===et,e=>e.subType),[entries,et]);
  const rankedExSubs=hasSub?byUsage(subNames(etObj.subTypes),exSubCounts,s=>s):[];
  const noteFor=(t,sv)=>{
    const obj=exTypes?.find(e=>e.name===t);
    return combineNotes(obj?.note||"",subNote(findSub(obj?.subTypes,sv)));
  };
  const onTypeChange=t=>{refreshTime&&refreshTime();setEt(t);setSub("");setNotes(noteFor(t,""));};

// ── Auto-derive medication timing from current time ─────────────────────────
function autoMedTiming(timeStr){
  const[h,m]=timeStr.split(":").map(Number);
  const mins=h*60+(m||0);
  if(mins<10*60)return"Before breakfast";
  if(mins<11*60)return"After breakfast";
  if(mins<13*60)return"Before lunch";
  if(mins<14*60)return"After lunch";
  if(mins<20*60)return"Before dinner";
  if(mins<22*60+30)return"After dinner";
  return"Bedtime";
}
function MedEntry({settings,entries,onAdd,entryTime,setEntryTime,refreshTime,T}){
  const[med,setMed]=useState("");const[timing,setTiming]=useState(()=>autoMedTiming(entryTime));const[notes,setNotes]=useState("");const[fl,setFl]=useState(false);

  return(<div className="card"><div className="slabel">💊 Medication</div>

    <div style={{display:"flex",gap:5,alignItems:"center",marginBottom:6}}>

      <select value={timing} onChange={e=>setTiming(e.target.value)} style={{flex:"1 1 120px",minWidth:0}}>{MED_TIMES.map(t=><option key={t}>{t}</option>)}</select>

function TLE({e,settings,onEdit,T}){
  const ic={meal:"🍽️",liquid:"💧",drinks:"☕",exercise:"🏃",water:"💧",medical:"🩺",medication:"💊"};
  // Enrich medical unit from presets if not saved on entry (handles old Firebase entries)
  const resolvedUnit=e.unit||(e.type==="medical"&&settings?((settings.medicalPresets||FD.medicalPresets||[]).find(p=>(p.name||p)===e.readingType)||{}).unit||"":"");
  let m="";
  if(e.type==="meal")       {const _f=(settings?.foodCategories||FD.foodCategories||[]).find(f=>(f.name||f)===e.food)||{};m=`${e.mealType} · ${pickIcon(e.food,"food",_f.icon||"")} ${e.food}${e.foodSubType?" · "+e.foodSubType:""} · ${e.unit==="count"?e.qty:e.qty+e.unit}`;}
  if(e.type==="liquid")     {const _li=(settings?.liquidIcons||{})[e.liquidType]||"";m=`${pickIcon(e.liquidType,"drink",_li)} ${e.liquidType}${e.liquidSubType?" · "+e.liquidSubType:""}${e.ml?" · "+e.ml+"ml":""}`;};
  if(e.type==="exercise")   {const _e=(settings?.exerciseTypes||FD.exerciseTypes||[]).find(x=>x.name===e.exType)||{};m=`${pickIcon(e.exType,"exercise",_e.icon||"")} ${e.exType}`;if(e.subType)m+=` · ${e.subType}`;exerciseMetricParts(e,settings?.exerciseTypes||FD.exerciseTypes).forEach(p=>{m+=` · ${p}`;});}
  if(e.type==="water")     {const _wt=e.waterTemp||e.liquidType||"Water";const _wi=(settings?.liquidIcons||{})[_wt]||"";m=`${pickIcon(_wt,"drink",_wi)} ${_wt}${e.ml?" · "+e.ml+"ml":""}`;};
  // water is handled by the liquid branch above (shows "Warm Water · 600ml")
  if(e.type==="medical")    {const _mp=(settings?.medicalPresets||FD.medicalPresets||[]).find(p=>(p.name||p)===e.readingType)||{};m=`${pickIcon(e.readingType,"medical",_mp.icon||"")} ${e.readingType} · ${e.value}${resolvedUnit?" "+resolvedUnit:""}`;};
  if(e.type==="medication") {const _mi=(settings?.medicationIcons||{})[e.med]||"";m=`${pickIcon(e.med,"medication",_mi)} ${e.med} · ${e.timing}`;};
  // N4 (revised): double-tap (touch) or double-click (mouse) opens inline edit.
  // Originally this used a long-press timer, but long press IS the same
  // gesture as the phone's own "hold to select text and copy" — there is no
  // way to win that race reliably, and suppressing it via CSS just trades one
  // problem for another (edit works, but copy/select stops working entirely).
  // Double-tap is a different gesture altogether, so native text selection is
  // untouched — you can still long-press to select and copy an entry's text
  // exactly as before. The explicit ✏️/🗑️ icons are gone too; double-tap /
  // double-click is now the one way in, and Manage remains the fallback for
  // anyone who prefers a tap-based flow.
  const lastTapAt=useRef(0);
  const lastTapPos=useRef(null);
  const touchStart=useRef(null);
  const onTouchStart=t=>{
    if(t.touches.length!==1)return;
    touchStart.current={x:t.touches[0].clientX,y:t.touches[0].clientY};
  };
  const onTouchEnd=t=>{
    const start=touchStart.current;touchStart.current=null;
    const p=t.changedTouches[0];
    if(!start||!p)return;
    // A scroll/drag ends with real movement — never counts as a tap.
    if(Math.hypot(p.clientX-start.x,p.clientY-start.y)>10){lastTapAt.current=0;return;}
    const now=Date.now();
    const isDoubleTap=now-lastTapAt.current<350&&lastTapPos.current&&
      Math.hypot(p.clientX-lastTapPos.current.x,p.clientY-lastTapPos.current.y)<30;
    if(isDoubleTap){
      lastTapAt.current=0;
      try{navigator.vibrate&&navigator.vibrate(12);}catch(err){}
      onEdit&&onEdit();
    }else{
      lastTapAt.current=now;
      lastTapPos.current={x:p.clientX,y:p.clientY};
    }
  };
  return(<div className="tle" onTouchStart={onTouchStart} onTouchEnd={onTouchEnd} onDoubleClick={()=>onEdit&&onEdit()}><span style={{fontSize:"0.72rem",color:T.textMuted,fontFamily:"'DM Mono',monospace",minWidth:40,flexShrink:0}}>{fmt24(e.timestamp)}</span><span style={{flexShrink:0}}>{ic[e.type]||"•"}</span><div style={{flex:1,fontSize:"0.83rem",lineHeight:1.45}}>{m}{e.notes&&<span style={{fontSize:"0.74rem",color:T.textSub,fontStyle:"italic"}}> ({e.notes})</span>}</div></div>);
}

// ═══════════════════════════════════════════════════════════════════════════════
// MANAGE
// ═══════════════════════════════════════════════════════════════════════════════
function ManagePage({entries,settings,onAddDirect,onUpdate,onDelete,isOnline,T}){
  const allDates=(()=>{const s=new Set(entries.map(e=>e.date).filter(Boolean));s.add(today());return Array.from(s).sort().reverse();})();
  const[sel,setSel]=useState(today);
  const[eid,setEid]=useState(null);
  // B7: duplicating used to write the copy to Firebase IMMEDIATELY, before
  // any editing happened — only clicking Cancel deleted it. Navigating away,
  // switching tabs, or backgrounding the app left an unedited, silent
  // duplicate behind permanently. pendingDup holds the draft as pure local
  // state instead; nothing is written until Save. If it's abandoned, there's
  // nothing to clean up — it was never persisted in the first place, and
  // React discards the state automatically when ManagePage unmounts.
  const[pendingDup,setPendingDup]=useState(null);
  // Which entry the pending duplicate came from, so it can render right next
  // to it rather than always at the top of the list.
  const[dupSourceId,setDupSourceId]=useState(null);
  // C6/E1: previously navigation was locked to today whenever isOnline was
  // false. That was never actually necessary — `entries` here is already
  // hydrated from the local mirror (all history, incl. tombstones) regardless
  // of connection, so browsing past dates has always worked offline. The old
  // restriction just prevented using a feature the data already supported.
  const effectiveSel=sel;
  const handleDuplicate=e=>{
    const newId=genId();
    const ts=new Date(new Date(e.timestamp).getTime()+1000).toISOString();
    setPendingDup({...deepClone(e),id:newId,timestamp:ts,date:e.date});
    setDupSourceId(e.id);
    setEid(newId);
  };
  const dayE=entries.filter(e=>e.date===effectiveSel).sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));
  const idx=allDates.indexOf(effectiveSel);
  // Navigating away from the date a pending duplicate belongs to abandons it
  // — otherwise it would silently reappear if the user navigated back,
  // which is more confusing than just discarding it (nothing was ever
  // saved, so there's nothing to lose).
  const goPrev=()=>{if(idx<allDates.length-1){setSel(allDates[idx+1]);setEid(null);setPendingDup(null);setDupSourceId(null);}};
  const goNext=()=>{if(idx>0){setSel(allDates[idx-1]);setEid(null);setPendingDup(null);setDupSourceId(null);}};
  // N3: swipe to change date. Passive by design — only touchstart/touchend are
  // read, touchmove is never intercepted or preventDefault'd, so normal
  // vertical scrolling of the entry list is completely untouched. The
  // direction only fires once the gesture is already over and clearly
  // horizontal, matching the roadmap's own spec: ~50px threshold, ignored
  // when vertical movement dominates, and disabled while an edit form is open
  // (eid!==null) so a swipe mid-edit can't unexpectedly discard the date
  // context underneath an open form. Swipe left = forward/newer (▶), swipe
  // right = back/older (◀) — the same left-is-past/right-is-future reading
  // direction the ◀▶ buttons already use.
  const touchRef=useRef(null);
  const onTouchStart=e=>{if(eid!==null||e.touches.length!==1)return;const t=e.touches[0];touchRef.current={x:t.clientX,y:t.clientY};};
  const onTouchEnd=e=>{
    const start=touchRef.current;touchRef.current=null;
    if(!start||eid!==null)return;
    const t=e.changedTouches[0];
    const dx=t.clientX-start.x,dy=t.clientY-start.y;
    if(Math.abs(dx)<50||Math.abs(dx)<=Math.abs(dy))return; // too short, or vertical scroll
    if(dx<0)goNext();else goPrev();
  };
  return(<div onTouchStart={onTouchStart} onTouchEnd={onTouchEnd} style={{touchAction:"pan-y"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
      <div style={{fontWeight:600,fontSize:"0.92rem"}}>📋 Manage Records</div>
      <div style={{fontSize:"0.72rem",color:T.textMuted}}>{entries.length} entries · {allDates.length} dates</div>
    </div>
    {!isOnline&&<div style={{fontSize:"0.73rem",color:T.waterBtnText,background:T.waterBtn,borderRadius:8,padding:"6px 10px",marginBottom:8,textAlign:"center"}}>📵 Showing entries saved on this device. Edits will sync once you're back online.</div>}
    <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:10}}>
      <button onClick={goPrev} disabled={idx>=allDates.length-1} aria-label="Previous date"
        style={{flexShrink:0,width:36,height:36,borderRadius:8,border:`1px solid ${T.border}`,
          background:T.cardBg,color:idx>=allDates.length-1?T.textMuted:T.text,
          fontSize:"1.1rem",cursor:idx>=allDates.length-1?"not-allowed":"pointer",display:"flex",alignItems:"center",justifyContent:"center",opacity:idx>=allDates.length-1?0.4:1}}>◀</button>
      <input type="date" aria-label="Select date" value={effectiveSel}
        onChange={e=>{if(e.target.value){setSel(e.target.value);setEid(null);setPendingDup(null);setDupSourceId(null);}}}
        style={{flex:1,padding:"8px 10px",borderRadius:8,border:`2px solid ${T.accent}`,
          background:T.cardBg,color:T.text,fontWeight:600,fontSize:"0.92rem",
          fontFamily:"inherit",textAlign:"center",colorScheme:T.isDark?"dark":"light"}}/>
      <button onClick={goNext} disabled={idx<=0} aria-label="Next date"
        style={{flexShrink:0,width:36,height:36,borderRadius:8,border:`1px solid ${T.border}`,
          background:T.cardBg,color:idx<=0?T.textMuted:T.text,
          fontSize:"1.1rem",cursor:idx<=0?"not-allowed":"pointer",display:"flex",alignItems:"center",justifyContent:"center",opacity:idx<=0?0.4:1}}>▶</button>
    </div>
    {(() => {
      // Renders the pending-duplicate EditEntry block. Save is the FIRST and
      // only time onAddDirect is called — Cancel just clears local state,
      // nothing to delete since nothing was ever saved (see B7).
      const renderPendingDup=()=>(
        <EditEntry key={pendingDup.id} entry={pendingDup} settings={settings} T={T} label="📋 Duplicating"
          onSave={d=>{onAddDirect({...pendingDup,...d});setPendingDup(null);setDupSourceId(null);setEid(null);}}
          onCancel={()=>{setPendingDup(null);setDupSourceId(null);setEid(null);}}/>
      );
      const showPending=pendingDup&&pendingDup.date===effectiveSel;
      const sourceStillVisible=showPending&&dayE.some(x=>x.id===dupSourceId);
      if(dayE.length===0&&!showPending)
        return<div style={{color:T.textMuted,fontSize:"0.82rem",textAlign:"center",padding:22}}>No entries for this date</div>;
      return(<>
        {dayE.map(e=>(
          <React.Fragment key={e.id}>
            {eid===e.id
              ?<EditEntry entry={e} settings={settings} T={T} label="✏️ Editing" onSave={d=>{onUpdate(e.id,d);setEid(null);}} onCancel={()=>setEid(null)}/>
              :<ManageRow e={e} settings={settings} T={T} onEdit={()=>setEid(e.id)} onDuplicate={()=>handleDuplicate(e)} onDelete={()=>{if(confirm("Delete this entry?"))onDelete(e.id);}}/>}
            {/* Sits right after the entry it was duplicated from, not always
                at the top of the list — was the reported cosmetic issue. */}
            {showPending&&dupSourceId===e.id&&renderPendingDup()}
          </React.Fragment>
        ))}
        {/* Fallback: if the source entry is no longer in dayE for some reason
            (e.g. deleted while its duplicate was still being drafted), still
            show the draft rather than silently losing it from view. */}
        {showPending&&!sourceStillVisible&&renderPendingDup()}
      </>);
    })()}
  </div>);
}

function parseMedVal(v){
  if(!v)return null;
  // BP: "120/80" → take systolic only for primary line; expose both
  if(typeof v==="string"&&v.includes("/")){
    const [s,d]=v.split("/").map(Number);
    return isNaN(s)?null:{sys:s,dia:isNaN(d)?null:d};
  }
  const n=parseFloat(v);
  return isNaN(n)?null:n;
}

function isoWeek(dateStr){
  const d=new Date(dateStr+"T00:00:00");
  const day=d.getDay()||7;
  d.setDate(d.getDate()+4-day);
  const y=d.getFullYear();
  const start=new Date(y,0,1);
  const w=Math.ceil((((d-start)/86400000)+1)/7);
  return `${y}-W${String(w).padStart(2,"0")}`;
}
function isoMonth(dateStr){return dateStr.slice(0,7);}
function isoYear(dateStr){return dateStr.slice(0,4);}

// Build {label, values:[]} series for a given metric, range and aggregation
function buildTrendSeries(entries, metricName, rangeKey, aggMode){
  // Filter medical entries for this metric
  const stripEmoji=s=>(s||"").replace(/^[^\w\d]+/,"").trim();
  const med=entries.filter(e=>e.type==="medical"&&(stripEmoji(e.readingType)||stripEmoji(e.detail1))===metricName);
  if(!med.length)return null;

  const now=new Date();
  // Date boundaries
  const cutoffs={
    "7d":  7,  "30d": 30, "90d": 90,
    "12w": 84, "25w":175, "12m":365, "all":9999
  };
  const days=cutoffs[rangeKey]||90;
  const cutoff=new Date(now); cutoff.setDate(cutoff.getDate()-days);
  const inRange=rangeKey==="all"?med:med.filter(e=>new Date(e.date+"T00:00:00")>=cutoff);

  // Group key function
  const isWeekly=rangeKey==="12w"||rangeKey==="25w";
  const isMonthly=rangeKey==="12m";
  const groupFn=isMonthly?isoMonth:isWeekly?isoWeek:d=>d;

  // Bucket entries
  const buckets={};
  inRange.forEach(e=>{
    const key=groupFn(e.date);
    if(!buckets[key])buckets[key]=[];
    const raw=e.value??e.detail2??e.detail1;
    const v=parseMedVal(raw);
    if(v!==null)buckets[key].push({v,ts:e.timestamp||e.date,date:e.date});
  });

  const sortedKeys=Object.keys(buckets).sort();

  // Aggregate per bucket
  function aggBucket(items){
    if(!items.length)return null;
    // Sort helpers — sort items[] by date+time ascending/descending
    const asc=(a,b)=>a.ts.localeCompare(b.ts);
    const desc=(a,b)=>b.ts.localeCompare(a.ts);
    const isBP=typeof items[0].v==="object";
    if(isBP){
      // Sort items chronologically, then pick first or last by position
      const sortedAsc=[...items].filter(i=>i.v&&i.v.sys!==null).sort(asc);
      const sortedDesc=[...items].filter(i=>i.v&&i.v.sys!==null).sort(desc);
      if(!sortedAsc.length)return null;
      if(aggMode==="first")return{sys:sortedAsc[0].v.sys,dia:sortedAsc[0].v.dia,isBP:true};
      if(aggMode==="last") return{sys:sortedDesc[0].v.sys,dia:sortedDesc[0].v.dia,isBP:true};
      // avg
      const sysMean=Math.round(sortedAsc.reduce((s,i)=>s+i.v.sys,0)/sortedAsc.length);
      const validDia=sortedAsc.filter(i=>i.v.dia!==null);
      const diaMean=validDia.length?Math.round(validDia.reduce((s,i)=>s+i.v.dia,0)/validDia.length):null;
      return{sys:sysMean,dia:diaMean,isBP:true};
    }
    const valid=items.filter(i=>typeof i.v==="number");
    if(!valid.length)return null;
    if(aggMode==="first")return valid.slice().sort(asc)[0].v;
    if(aggMode==="last") return valid.slice().sort(desc)[0].v;
    return Math.round((valid.reduce((s,i)=>s+i.v,0)/valid.length)*10)/10;
  }

  const labels=[];const primary=[];const secondary=[];
  sortedKeys.forEach(k=>{
    const agg=aggBucket(buckets[k]);
    if(agg===null)return;
    // Format label
    if(isMonthly)labels.push(k.slice(0,7)); // YYYY-MM
    else if(isWeekly)labels.push(k);         // YYYY-Www
    else labels.push(k.slice(5));             // MM-DD
    if(agg&&agg.isBP){
      primary.push(agg.sys);secondary.push(agg.dia);
    } else {
      primary.push(agg);
    }
  });
  return{labels,primary,secondary,isBP:primary.length&&buckets[sortedKeys[0]]&&typeof aggBucket(buckets[sortedKeys[0]])==="object"&&aggBucket(buckets[sortedKeys[0]])&&aggBucket(buckets[sortedKeys[0]]).isBP};
}

// ── TrendsPanel ───────────────────────────────────────────────────────────────
const TREND_RANGES=[
  {key:"7d",  label:"7 Days"},
  {key:"30d", label:"30 Days"},
  {key:"90d", label:"90 Days"},
  {key:"12w", label:"12 Weeks"},
  {key:"25w", label:"25 Weeks"},
  {key:"12m", label:"12 Months"},
  {key:"all", label:"All Time"},
];
const AGG_MODES=[
  {key:"avg",   label:"Avg"},
  {key:"first", label:"First"},
  {key:"last",  label:"Last"},
];
const TREND_METRICS=["Sugar","BP","Weight"];

function TrendsPanel({entries,settings,T}){
  const[metric,setMetric]=React.useState("Sugar");
  const[range,setRange]=React.useState("all");
  const[agg,setAgg]=React.useState("avg");
  const canvasRef=React.useRef(null);
  const chartRef=React.useRef(null);

  // Resolve available metrics from settings
  const medPresets=settings.medicalPresets||FD.medicalPresets;
  const _stripE=s=>(s||"").replace(/^[^\w\d]+/,"").trim();
  const availMetrics=medPresets.map(p=>typeof p==="string"?p:p.name).filter(n=>
    entries.some(e=>e.type==="medical"&&(_stripE(e.readingType)||_stripE(e.detail1))===n)
  );

  React.useEffect(()=>{
    const series=buildTrendSeries(entries,metric,range,agg);
    const canvas=canvasRef.current;
    if(!canvas)return;

    // Destroy previous chart
    if(chartRef.current){chartRef.current.destroy();chartRef.current=null;}

    if(!series||!series.labels.length){
      const ctx=canvas.getContext("2d");
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle=T.textMuted;ctx.font="14px Arial";ctx.textAlign="center";
      ctx.fillText("No data for this metric and range.",canvas.width/2,canvas.height/2);
      return;
    }

    // B6: this read a `data-theme` DOM attribute that is set nowhere in the app
    // (0 occurrences outside this line) — always null, so isDark was always
    // false and the chart used light-mode grid/text colours regardless of the
    // app's actual theme. T (the resolved theme object) is already in scope
    // and already correctly accounts for Dark/Light/System — use it directly.
    const isDark=T.isDark;

    const gridColor=isDark?"rgba(255,255,255,0.1)":"rgba(0,0,0,0.08)";
    const textColor=isDark?"#aaa":"#555";

    const datasets=[];
    const rangeLabel=TREND_RANGES.find(r=>r.key===range)?.label||range;
    const aggLabel=AGG_MODES.find(a=>a.key===agg)?.label||agg;

    if(series.isBP){
      datasets.push({
        label:`${metric} Systolic (${aggLabel})`,
        data:series.primary,
        borderColor:"#e53935",backgroundColor:"rgba(229,57,53,0.12)",
        tension:0.35,pointRadius:3,pointHoverRadius:6,fill:false,
      });
      if(series.secondary&&series.secondary.length){
        datasets.push({
          label:`${metric} Diastolic (${aggLabel})`,
          data:series.secondary,
          borderColor:"#fb8c00",backgroundColor:"rgba(251,140,0,0.12)",
          tension:0.35,pointRadius:3,pointHoverRadius:6,fill:false,
        });
      }
    } else {
      const colors={Sugar:["#1a73e8","rgba(26,115,232,0.1)"],Weight:["#0b8457","rgba(11,132,87,0.1)"],BP:["#e53935","rgba(229,57,53,0.1)"]};
      const [bc,bgc]=colors[metric]||["#1a73e8","rgba(26,115,232,0.1)"];
      datasets.push({
        label:`${metric} (${aggLabel}, ${rangeLabel})`,
        data:series.primary,
        borderColor:bc,backgroundColor:bgc,
        tension:0.35,pointRadius:3,pointHoverRadius:6,fill:true,
      });
    }

    // Unit for Y axis
    const unit=(()=>{
      const p=medPresets.find(p=>(typeof p==="string"?p:p.name)===metric);
      return p&&typeof p==="object"?p.unit||"":"";
    })();

    const ctx=canvas.getContext("2d");
    chartRef.current=new Chart(ctx,{
      type:"line",
      data:{labels:series.labels,datasets},
      options:{
        responsive:true,
        maintainAspectRatio:false,
        interaction:{mode:"index",intersect:false},
        plugins:{
          legend:{display:true,labels:{color:textColor,font:{size:11}}},
          tooltip:{
            callbacks:{
              label:ctx=>{
                const v=ctx.parsed.y;
                if(v===null||v===undefined)return null;
                return` ${ctx.dataset.label.split("(")[0].trim()}: ${v}${unit?" "+unit:""}`;
              }
            }
          }
        },
        scales:{
          x:{ticks:{color:textColor,maxRotation:45,font:{size:10}},grid:{color:gridColor}},
          y:{ticks:{color:textColor,font:{size:10},callback:(v)=>unit?`${v} ${unit}`:v},grid:{color:gridColor}},
        }
      }
    });

    return()=>{if(chartRef.current){chartRef.current.destroy();chartRef.current=null;}};
  },[metric,range,agg,entries,T]);

  // Count data points for selected metric
  const dataCount=entries.filter(e=>e.type==="medical"&&(e.readingType||e.detail1)===metric).length;

  return(<div>
    <div className="card" style={{marginBottom:8}}>
      <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:8}}>
        {(availMetrics.length?availMetrics:TREND_METRICS).map(m=>(
          <button key={m} onClick={()=>setMetric(m)}
            className={`tbtn${metric===m?" on":""}`}
            style={{fontSize:"0.78rem"}}>{m}</button>
        ))}
      </div>
      <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:8}}>
        {TREND_RANGES.map(r=>(
          <button key={r.key} onClick={()=>setRange(r.key)}
            className={`tbtn${range===r.key?" on":""}`}
            style={{fontSize:"0.75rem",padding:"4px 8px"}}>{r.label}</button>
        ))}
      </div>
      <div style={{display:"flex",gap:5,marginBottom:4,alignItems:"center"}}>
        <span style={{fontSize:"0.72rem",color:T.textMuted}}>Reading:</span>
        {AGG_MODES.map(a=>(
          <button key={a.key} onClick={()=>setAgg(a.key)}
            className={`tbtn${agg===a.key?" on":""}`}
            style={{fontSize:"0.75rem",padding:"4px 10px"}}>{a.label}</button>
        ))}
        <span style={{fontSize:"0.72rem",color:T.textMuted,marginLeft:"auto"}}>{dataCount} readings</span>
      </div>
    </div>
    <div className="card" style={{padding:"8px 4px"}}>
      <div style={{position:"relative",height:280}}>
        <canvas ref={canvasRef} style={{width:"100%",height:"100%"}}/>
      </div>
      <div style={{fontSize:"0.72rem",color:T.textMuted,textAlign:"center",marginTop:6}}>
        {agg==="avg"?"Average of all readings in period"
          :agg==="first"?"First (earliest) reading in period"
          :"Last (most recent) reading in period"}
        {(range==="12w"||range==="25w")?" · Weekly buckets"
          :range==="12m"?" · Monthly buckets"
          :" · Daily values"}
      </div>
    </div>
  </div>);
}

function ReportsPage({entries,deletedEntries,settings,isOnline,showToast,T}){
  // B1: every hook must run on every render. The offline early-return used to sit
  // ABOVE these useState calls, so flipping isOnline changed the hook count between
  // renders and React unmounted the whole tree ("Rendered fewer hooks than expected").
  // The offline notice now lives at the bottom, after all hooks have been called.
  const[tab,setTab]=useState("view");const mostRecentDate=(()=>{const ds=entries.map(e=>e.date).filter(Boolean).sort();return ds.length?ds[ds.length-1]:today();})();
  const[vd,setVd]=useState(mostRecentDate);
  const[cd,setCd]=useState([today()]);const[ad,setAd]=useState(today());const[qr,setQr]=useState("");
  // N5: date-range scoped export, separate from the quick "Export view" button.
  const[showRangeExport,setShowRangeExport]=useState(false);
  const[rFrom,setRFrom]=useState(today());
  const[rTo,setRTo]=useState(today());
  const[rMode,setRMode]=useState("summary"); // summary | full
  // Build date list from all entries + today, so imported historical data appears
  const allDates=(()=>{
    const s=new Set(entries.map(e=>e.date).filter(Boolean));
    s.add(today());
    return Array.from(s).sort().reverse();
  })();
  const medPresets=settings.medicalPresets||FD.medicalPresets;
  const medNames=medPresets.map(p=>typeof p==="string"?p:p.name);
  // E7: out-of-range highlighting for Sugar/BP. Deliberately a rough VISUAL cue,
  // not a clinical judgement — generic adult reference bands, matched by name
  // substring (like pickIcon) so a rename via N6 doesn't silently break it.
  // Purely additive to rendering: dayReport()/rpt()/CSV export are untouched,
  // so this cannot affect O2's memoization or any exported file.
  const isOutOfRange=(presetName,value)=>{
    const nm=(presetName||"").toLowerCase();
    if(nm.includes("sugar")){
      const n=parseFloat(value);
      return !isNaN(n)&&(n<70||n>140);
    }
    if(nm==="bp"||nm.includes("blood pressure")||nm.includes("pressure")){
      const m=String(value).match(/^(\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)/);
      if(!m)return false;
      const sys=parseFloat(m[1]),dia=parseFloat(m[2]);
      return sys<90||sys>130||dia<60||dia>85;
    }
    return false;
  };
  // Splits a joined medical-row string ("115/75 Sys/Dia, 95 mg/dL") back into
  // its individual readings for per-reading highlighting, without touching the
  // joined string dayReport()/CSV rely on.
  const medicalParts=(date,presetName)=>(entriesByDate.get(date)||[])
    .filter(e=>e.type==="medical"&&e.readingType===presetName)
    .map(e=>({text:`${e.value}${e.unit?" "+e.unit:""}`,flagged:isOutOfRange(presetName,e.value)}));
  // O2: `rpt(date)` used to re-filter the ENTIRE entries array and rebuild the
  // whole dayReport object once per row, per date — measured at 130 calls per
  // render on real data (13 rows x 10 dates in Compare), repeating every
  // second because of O1. Grouping by date once, then caching each date's
  // report for the lifetime of this render, cuts that to one dayReport() call
  // per distinct date regardless of how many rows read from it.
  const entriesByDate=useMemo(()=>{
    const m=new Map();
    for(const e of entries){if(!e.date)continue;const b=m.get(e.date);if(b)b.push(e);else m.set(e.date,[e]);}
    return m;
  },[entries]);
  const reportCache=useMemo(()=>new Map(),[entriesByDate,medPresets]);
  const rpt=date=>{
    if(reportCache.has(date))return reportCache.get(date);
    const r=dayReport(entriesByDate.get(date)||[],medPresets,settings?.exerciseTypes||FD.exerciseTypes);
    reportCache.set(date,r);
    return r;
  };
  const allRows=[{key:"water",label:"Water"},{key:"drinks",label:"Drinks"},{key:"medication",label:"Medications"},{key:"exercise",label:"Exercise"},{key:"Breakfast",label:"Breakfast"},{key:"Lunch",label:"Lunch"},{key:"Snack",label:"Snack"},{key:"Dinner",label:"Dinner"},...medNames.map(n=>({key:n,label:n}))];
  const doExport=(csv,fn)=>downloadCSV(csv,fn);
  // B5: previously built dates with toISOString().slice(0,10) — the exact UTC
  // bug fixed for today() in v4.61, still present here. At 04:30 IST that
  // silently dropped today from the range. localDateOffset() reuses today()'s
  // local-date + rollover logic so quick-range agrees with the rest of the app.
  const localDateOffset=n=>{const d=new Date();d.setMinutes(d.getMinutes()-DAY_ROLLOVER_MIN);d.setDate(d.getDate()-n);return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;};

// N8: actions now sit with the object they act on. Config editing AND config
// export/import/clear live together under Config; everything to do with logged
// entries lives under Data. Previously config was split across two tabs
// (editing under Config, its export/import/clear under Backup), which is what
// made the menus feel jumbled.
const STABS=[["general","⚙️ General"],["config","🗂️ Config"],["data","💾 Data"]];
const CTABS=[["food","🍽️ Food"],["drinks","☕ Drinks"],["exercise","🏃 Exercise"],["medical","🩺 Medical"],["meds","💊 Meds"]];


// ── Config CSV export/import helpers ─────────────────────────────────────────
// Each section exports as its own CSV with a sentinel header row
// Sentinel: #JivanLog-Config-<section>-<version>

function csvCell(v){
  let s=String(v==null?"":v);
  // S8: a cell beginning with = + - @ is interpreted as a formula by Excel/
  // Sheets on open. Food names, notes, or medication names are free text a
  // person can type — "=1+1" as a food name would execute as a formula for
  // anyone who opens the export. Prefixing with a straight quote is the
  // standard mitigation; spreadsheet apps display it but don't store it.
  if(/^[=+\-@]/.test(s))s="'"+s;
  return s.includes(",")||s.includes('"')||s.includes("\n")||s.startsWith("'")?`"${s.replace(/"/g,'""')}"`:s;
}
function csvRow(arr){return arr.map(csvCell).join(",");}

// N1a: sub-type notes in config CSV.
// Names go in the existing SubTypes column; notes go in a new, positionally
// matched SubTypeNotes column. A note can legitimately contain the ";"
// separator ("400g curd; no salt"), so both are escaped rather than naively
// joined. Files exported before v4.78 simply lack the notes column, which
// parses as "no notes" — old exports keep importing unchanged.
const joinEsc=arr=>(arr||[]).map(v=>String(v==null?"":v).replace(/\\/g,"\\\\").replace(/;/g,"\\;")).join(";");
const splitEsc=str=>{
  if(!str)return[];
  const out=[];let cur="";let i=0;
  while(i<str.length){
    const c=str[i];
    if(c==="\\"&&i+1<str.length){cur+=str[i+1];i+=2;continue;}
    if(c===";"){out.push(cur);cur="";i++;continue;}
    cur+=c;i++;
  }
  out.push(cur);
  return out;
};
// Serialise a sub-type list to the two CSV cells.
const subsToCSV=arr=>[joinEsc(subNames(arr)),joinEsc(subItems(arr).map(x=>x.note||""))];
// Rebuild a sub-type list from those two cells, pairing by position. Emits a
// bare string when a sub-type has no note, keeping stored config tidy.
const subsFromCSV=(namesStr,notesStr)=>{
  const names=splitEsc(namesStr).map(x=>x.trim());
  const notes=splitEsc(notesStr);
  const out=[];
  names.forEach((n,i)=>{
    if(!n)return;
    const note=(notes[i]||"").trim();
    out.push(note?{name:n,note}:n);
  });
  return out;
};

function exportConfigCSV(settings,section){
  const lines=[];
  if(section==="all"||section==="food"){
    lines.push(`#JivanLog-Config-food-${APP_VERSION}`);
    lines.push(csvRow(["Name","Note","SubTypes","SubTypeNotes"]));
    foodItems(settings.foodCategories||FD.foodCategories).forEach(f=>{
      lines.push(csvRow([f.name,f.note||"",...subsToCSV(f.subTypes)]));
    });
    if(section==="all")lines.push("");
  }
  if(section==="all"||section==="drinks"){
    lines.push(`#JivanLog-Config-drinks-${APP_VERSION}`);
    lines.push(csvRow(["Name","Note","SubTypes","SubTypeNotes"]));
    const types=(settings.liquidTypes||FD.liquidTypes).filter(t=>t!=="--------");
    const notes=settings.liquidNotes||FD.liquidNotes||{};
    const subs=settings.liquidSubTypes||FD.liquidSubTypes||{};
    types.forEach(t=>{
      lines.push(csvRow([t,notes[t]||"",...subsToCSV(subs[t])]));
    });
    if(section==="all")lines.push("");
  }
  if(section==="all"||section==="exercise"){
    lines.push(`#JivanLog-Config-exercise-${APP_VERSION}`);
    lines.push(csvRow(["Name","Metrics","Note","SubTypes","SubTypeNotes"]));
    (settings.exerciseTypes||FD.exerciseTypes).forEach(e=>{
      lines.push(csvRow([e.name,(e.metrics||[]).join(";"),e.note||"",...subsToCSV(e.subTypes)]));
    });
    if(section==="all")lines.push("");
  }
  if(section==="all"||section==="medical"){
    lines.push(`#JivanLog-Config-medical-${APP_VERSION}`);
    lines.push(csvRow(["Name","Unit"]));
    (settings.medicalPresets||FD.medicalPresets).forEach(p=>{
      lines.push(csvRow([typeof p==="string"?p:p.name,typeof p==="string"?"":p.unit||""]));
    });
    if(section==="all")lines.push("");
  }
  if(section==="all"||section==="meds"){
    lines.push(`#JivanLog-Config-meds-${APP_VERSION}`);
    lines.push(csvRow(["Name"]));
    (settings.medications||FD.medications).forEach(m=>lines.push(csvCell(m)));
  }
  return lines.join("\n");
}

function importConfigCSV(csvText){
  // Splits multi-section "all" exports or handles single-section files
  const lines=csvText.split("\n").map(l=>l.trim());
  const result={};
  let section=null,headers=[];
  const parseCells=line=>{
    const row=[];let cur="",inQ=false;
    for(const ch of line+","){
      if(ch==='"'){inQ=!inQ;}
      else if(ch===","&&!inQ){row.push(cur.replace(/""/g,'"'));cur="";}
      else cur+=ch;
    }
    return row;
  };
  for(let i=0;i<lines.length;i++){
    const line=lines[i];
    if(!line)continue;
    // Sentinel row
    const sm=line.match(/^#JivanLog-Config-(\w+)-/);
    if(sm){section=sm[1];headers=[];continue;}
    if(!section)continue;
    // Header row (first non-sentinel, non-empty row after sentinel)
    if(!headers.length){headers=parseCells(line).map(h=>h.toLowerCase());continue;}
    const cells=parseCells(line);
    const get=h=>{
      const v=cells[headers.indexOf(h)]||"";
      // Symmetric with csvCell()'s export-time guard — see buildAllCSV's cell().
      return /^'[=+\-@]/.test(v)?v.slice(1):v;
    };
    const spl=v=>v?v.split(";").map(s=>s.trim()).filter(Boolean):[];

    if(section==="food"){
      if(!result.foodCategories)result.foodCategories=[];
      result.foodCategories.push({name:get("name"),note:get("note"),subTypes:subsFromCSV(get("subtypes"),get("subtypenotes"))});
    }
    if(section==="drinks"){
      if(!result.liquidTypes)result.liquidTypes=[];
      if(!result.liquidNotes)result.liquidNotes={};
      if(!result.liquidSubTypes)result.liquidSubTypes={};
      const name=get("name");if(!name)continue;
      result.liquidTypes.push(name);
      if(get("note"))result.liquidNotes[name]=get("note");
      const subs=subsFromCSV(get("subtypes"),get("subtypenotes"));if(subs.length)result.liquidSubTypes[name]=subs;
    }
    if(section==="exercise"){
      if(!result.exerciseTypes)result.exerciseTypes=[];
      result.exerciseTypes.push({name:get("name"),metrics:spl(get("metrics")),note:get("note"),subTypes:subsFromCSV(get("subtypes"),get("subtypenotes"))});
    }
    if(section==="medical"){
      if(!result.medicalPresets)result.medicalPresets=[];
      result.medicalPresets.push({name:get("name"),unit:get("unit")});
    }
    if(section==="meds"){
      if(!result.medications)result.medications=[];
      const name=cells[0]||"";if(name&&!name.startsWith("#"))result.medications.push(name);
    }
  }
  if(!Object.keys(result).length)throw new Error("No config data found — check file format");
  return result;
}

function DataSafetyCard({entries,deletedEntries,onRestoreEntry,onExportJSON,onImportJSON,onRestore,offlineAuth,T}){
  const[showTrash,setShowTrash]=React.useState(false);

  const dead=(deletedEntries||[]).slice().sort((a,b)=>new Date(b.deletedAt||0)-new Date(a.deletedAt||0));
  const label=e=>{
    if(e.type==="meal")return`${e.mealType||"Meal"} · ${e.food||""}`;
    if(e.type==="liquid")return`${e.liquidType||"Drink"}${e.ml?" · "+e.ml+"ml":""}`;
    if(e.type==="exercise")return`${e.exType||"Exercise"}`;
    if(e.type==="medical")return`${e.readingType||"Reading"} · ${e.value||""}${e.unit?" "+e.unit:""}`;

  const onPickJSON=ev=>{const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=x=>onImportJSON(x.target.result);r.readAsText(f);ev.target.value="";};

      <div style={{fontSize:"0.72rem",color:T.textMuted,marginBottom:4,lineHeight:1.5}}>Nothing is ever permanently deleted. Removed entries go to Trash and can be restored. Daily backups are kept on this device and in the cloud.</div>
      <button onClick={onExportJSON} style={{...btn,border:`1px solid ${T.border}`,background:T.inputBg,color:T.text}}>⬇️ Download full backup (JSON)</button>
      <button onClick={()=>jsonInputRef.current&&jsonInputRef.current.click()} disabled={offlineAuth} style={{...btn,border:`1px solid ${T.border}`,background:offlineAuth?T.cardBg:T.inputBg,color:offlineAuth?T.textMuted:T.text,cursor:offlineAuth?"not-allowed":"pointer"}}>⬆️ Import backup (JSON)</button>

            <div key={e.id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,padding:"7px 9px",borderBottom:`1px solid ${T.border}`}}>
              <div style={{minWidth:0}}>
                <div style={{fontSize:"0.78rem",color:T.text,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{label(e)}</div>
                <div style={{fontSize:"0.72rem",color:T.textMuted}}>{normDate(e.date)} · deleted {e.deletedAt?new Date(e.deletedAt).toLocaleString():""}</div>
              </div>
              <button onClick={()=>onRestoreEntry(e.id)} disabled={offlineAuth} style={{flexShrink:0,padding:"4px 10px",borderRadius:6,border:"none",background:offlineAuth?T.cardBg:T.accentBtn,color:offlineAuth?T.textMuted:"#fff",fontFamily:"inherit",fontWeight:600,fontSize:"0.72rem",cursor:offlineAuth?"not-allowed":"pointer"}}>Restore</button>
            </div>
          ))}
        </div>
        :<div style={{fontSize:"0.72rem",color:T.textMuted,marginTop:8,padding:"6px 2px"}}>Trash is empty.</div>
      )}

// S6: lets a PIN be set up ahead of time, rather than only at the moment of
// first locking — and gives a way to change or remove it. Reuses PinPad so
// this flow is visually and behaviorally identical to the lock screen's own.
function LockPinCard({user,T}){
  const[hasPin,setHasPin]=useState(()=>{try{return !!localStorage.getItem(pinHashKey(user.uid));}catch(e){return false;}});
  const[mode,setMode]=useState(null); // null | "setup" | "confirm"
  const[pin,setPin]=useState("");
  const[firstPin,setFirstPin]=useState("");
  const[error,setError]=useState(false);
  const[busy,setBusy]=useState(false);

  const startSetup=()=>{setMode("setup");setPin("");setFirstPin("");setError(false);};
  const cancel=()=>{setMode(null);setPin("");setFirstPin("");setError(false);};
  const onDigit=d=>{
    if(busy||pin.length>=4)return;
    const next=pin+d;
    setPin(next);
    if(next.length===4)submit(next);
  };
  const onBackspace=()=>{if(!busy)setPin(p=>p.slice(0,-1));};

  const submit=async four=>{
    setBusy(true);
    if(mode==="setup"){setFirstPin(four);setPin("");setMode("confirm");setBusy(false);return;}
    if(four!==firstPin){
      setError(true);setPin("");setTimeout(()=>setError(false),500);
      setMode("setup");setFirstPin("");setBusy(false);return;
    }
    const hash=await hashPin(four,user.uid);
    try{localStorage.setItem(pinHashKey(user.uid),hash);}catch(e){}
    setHasPin(true);setMode(null);setPin("");setFirstPin("");setBusy(false);
  };
  const removePin=()=>{
    if(!confirm("Remove your lock PIN?\n\nLocking the session will ask you to set a new one next time."))return;
    try{localStorage.removeItem(pinHashKey(user.uid));}catch(e){}
    setHasPin(false);
  };

  return(<div className="card">
    <div className="slabel">🔒 Lock Screen PIN</div>
    <div style={{fontSize:"0.72rem",color:T.textMuted,marginBottom:8,lineHeight:1.5}}>
      {hasPin?"A PIN is set — required to unlock a locked session.":"No PIN set yet — Lock session will ask you to set one the first time you use it."}
    </div>
    {!mode&&<div style={{display:"flex",gap:6}}>
      <button onClick={startSetup} style={{flex:1,padding:"7px 4px",borderRadius:8,border:`1px solid ${T.border}`,background:T.cardBg,color:T.text,fontSize:"0.78rem",fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>{hasPin?"Change PIN":"Set PIN now"}</button>

function SettingsPage({settings,theme,setSettings,setTheme,dayRolloverMin,setDayRolloverMin,user,entries,deletedEntries,onRestoreEntry,onExportJSON,onImportJSON,onImport,onImportConfig,onClearEntries,onClearConfig,onClearAll,onRestore,onRename,onRepairEmoji,offlineAuth,showToast,isAdminUser,pendingRequests,adminsMap,allowlistMap,approvedUsersMap,onApproveRequest,onDenyRequest,onPromoteAdmin,onDemoteAdmin,onAddAllowlist,onRemoveAllowlist,T}){
  const[stab,setStab]=useState("general");const[ctab,setCtab]=useState("food");const[newItem,setNewItem]=useState("");

  // forms via Apply ▶. There is no draft any more — edits are the live config,
  // saved immediately, exactly like Theme and Day Rollover already behaved.
  const active=settings;

  const addItem=key=>{if(!newItem.trim())return;const val=key==="foodCategories"?{name:newItem.trim(),note:"",subTypes:[]}:newItem.trim();updateActive(p=>({...p,[key]:[...(p[key]||[]),val]}));setNewItem("");};
  const removeItem=(key,item)=>updateActive(p=>({...p,[key]:(p[key]||[]).filter(x=>key==="foodCategories"?foodName(x)!==foodName(item):x!==item)}));

  const updateDrink=(field,val)=>{const fmap={notes:"liquidNotes",subTypes:"liquidSubTypes",types:"liquidTypes",icons:"liquidIcons"};updateActive(p=>({...p,[fmap[field]||field]:val}));};
  const addMedPreset=(name,unit)=>{if(!name.trim())return;const ex=active?.medicalPresets||[];if(ex.some(p=>(typeof p==="string"?p:p.name)===name.trim()))return;updateActive(p=>({...p,medicalPresets:[...(p.medicalPresets||[]),{name:name.trim(),unit:unit.trim()}]}));};
  const removeMedPreset=name=>updateActive(p=>({...p,medicalPresets:(p.medicalPresets||[]).filter(x=>(typeof x==="string"?x:x.name)!==name)}));
  return(<div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>

    </div>

      {STABS.map(([k,l])=><button key={k} onClick={()=>{setStab(k);setNewItem("");}} className={`tbtn${stab===k?" on":""}`} style={{flexShrink:0,fontSize:"0.75rem"}}>{l}</button>)}
    </div>

    {stab==="general"&&<>
      <div className="card" style={{display:"flex",alignItems:"center",gap:12,padding:"10px 13px"}}>
        {user.photoURL&&<img src={user.photoURL} style={{width:38,height:38,borderRadius:"50%",border:`2px solid ${T.accentBtn}`}} alt="avatar"/>}
        <div style={{flex:1}}><div style={{fontWeight:600,fontSize:"0.88rem"}}>{user.displayName||"User"}</div><div style={{fontSize:"0.72rem",color:T.textMuted}}>{user.email}</div></div>
        <div style={{fontSize:"0.72rem",color:T.border,fontFamily:"'DM Mono',monospace",marginLeft:4,alignSelf:"flex-end"}}>{APP_VERSION}</div>
      </div>
      <div className="card"><div className="slabel">🎨 Theme</div><div style={{display:"flex",gap:6}}>{[["dark","🌙 Dark"],["light","☀️ Light"],["system","💻 System"]].map(([m,l])=><button key={m} onClick={()=>setTheme(m)} style={{flex:1,padding:"7px 4px",borderRadius:8,border:"1px solid",fontSize:"0.78rem",fontWeight:600,cursor:"pointer",fontFamily:"inherit",borderColor:theme===m?T.accentBtn:T.border,background:theme===m?T.accentBg:T.cardBg,color:theme===m?T.accent:T.textMuted}}>{l}</button>)}</div></div>
      <div className="card"><div className="slabel">🌙 Day Rollover</div><div style={{fontSize:"0.72rem",color:T.textMuted,marginBottom:8,lineHeight:1.5}}>Entries logged before this time still count toward the previous day — useful on nights you're up late.</div><select value={dayRolloverMin} onChange={e=>setDayRolloverMin(parseInt(e.target.value,10))} style={{width:"100%",padding:"9px 10px",borderRadius:8,border:`1px solid ${T.border}`,background:T.inputBg,color:T.text,fontFamily:"inherit",fontSize:"0.85rem"}}>{[[0,"Midnight (12:00 AM)"],[30,"12:30 AM"],[60,"1:00 AM"],[90,"1:30 AM"],[120,"2:00 AM"],[150,"2:30 AM"],[180,"3:00 AM"],[240,"4:00 AM"]].map(([m,l])=><option key={m} value={m}>{l}</option>)}</select></div>
      <LockPinCard user={user} T={T}/>
      {isAdminUser&&<AdminPanel pendingRequests={pendingRequests} adminsMap={adminsMap} allowlistMap={allowlistMap} approvedUsersMap={approvedUsersMap} onApproveRequest={onApproveRequest} onDenyRequest={onDenyRequest} onPromoteAdmin={onPromoteAdmin} onDemoteAdmin={onDemoteAdmin} onAddAllowlist={onAddAllowlist} onRemoveAllowlist={onRemoveAllowlist} showToast={showToast} T={T}/>}

      {ctab==="meds"&&<EList entries={entries} onRename={onRename} items={active.medications||FD.medications} onRemove={item=>removeItem("medications",item)} onReorder={arr=>updateActive(p=>({...p,medications:arr}))} icons={active.medicationIcons||{}} onIconUpdate={(name,ic)=>updateActive(p=>({...p,medicationIcons:{...(p.medicationIcons||{}),[name]:ic}}))} newItem={newItem} setNew={setNewItem} onAdd={()=>addItem("medications")} T={T}/>}
      <ConfigTools ctab={ctab} settings={settings} onImportConfig={onImportConfig} onClearConfig={onClearConfig} showToast={showToast} onFactorySection={sec=>{
        const map={food:["foodCategories"],drinks:["liquidTypes","liquidNotes","liquidSubTypes","liquidIcons"],exercise:["exerciseTypes"],medical:["medicalPresets"],meds:["medications","medicationIcons"]};

      }} onFactoryAll={()=>updateActive(()=>deepClone(FD))} T={T}/>
    </>}

    {stab==="data"&&<DataPanel entries={entries} deletedEntries={deletedEntries} settings={settings} onRepairEmoji={onRepairEmoji} onImport={onImport} onClearEntries={onClearEntries} onClearAll={onClearAll} onRestoreEntry={onRestoreEntry} onExportJSON={onExportJSON} onImportJSON={onImportJSON} onRestore={onRestore} offlineAuth={offlineAuth} user={user} T={T}/>}
  </div>);
}

// N8: config export / import / clear / factory-reset used to live under the
// Backup tab, separated from the config editing they act on. They now sit
// directly beneath the list being edited, scoped to the section in view.
function ConfigTools({ctab,settings,onImportConfig,onClearConfig,showToast,onFactorySection,onFactoryAll,T}){
  const cfgRef=useRef();
  const[open,setOpen]=useState(false);
  const LABEL={food:"Food",drinks:"Drinks",exercise:"Exercise",medical:"Medical",meds:"Meds"};
  const label=LABEL[ctab]||ctab;
  const handleCfgFile=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=ev=>{try{const cfg=importConfigCSV(ev.target.result);onImportConfig(cfg);}catch(err){showToast("Config import failed: "+err.message,"error");}};
    r.readAsText(f);e.target.value="";
  };
  const btn={width:"100%",padding:"8px",borderRadius:8,border:`1px solid ${T.border}`,background:T.inputBg,color:T.text,fontFamily:"inherit",fontWeight:600,fontSize:"0.78rem",cursor:"pointer",marginBottom:6};
  return(<div className="card" style={{marginTop:10}}>
    {!open
      ?<button onClick={()=>setOpen(true)} style={{width:"100%",padding:"8px",borderRadius:8,border:`1px solid ${T.border}`,background:"transparent",color:T.textMuted,fontFamily:"inherit",fontWeight:600,fontSize:"0.78rem",cursor:"pointer"}}>🛠️ {label} tools — export, import, reset…</button>
      :<>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <div className="slabel" style={{marginBottom:0}}>🛠️ {label} tools</div>
          <button onClick={()=>setOpen(false)} style={{background:"none",border:"none",color:T.textMuted,cursor:"pointer",fontSize:"0.9rem",padding:0}}>×</button>
        </div>
        <button onClick={()=>downloadCSV(exportConfigCSV(settings,ctab),`jivanlog-config-${ctab}-${today()}.csv`)} style={{...btn,background:T.accentBtn,color:"#fff",border:"none"}}>⬇️ Export {label} CSV</button>
        <button onClick={()=>downloadCSV(exportConfigCSV(settings,"all"),`jivanlog-config-all-${today()}.csv`)} style={btn}>⬇️ Export ALL config CSV</button>
        {/* Reference copy of the built-in tables. exportConfigCSV takes any
            config-shaped object, so passing FD emits the hard-coded factory
            lists in the same format as a normal export — useful for diffing
            your config against the defaults without overwriting anything. */}
        <button onClick={()=>downloadCSV(exportConfigCSV(FD,"all"),`jivanlog-factory-defaults-${APP_VERSION}-${today()}.csv`)} style={btn}>⬇️ Export FACTORY defaults CSV (reference)</button>
        <div style={{fontSize:"0.72rem",color:T.textMuted,margin:"2px 0 8px",lineHeight:1.5}}>Factory export is read-only reference — downloading it changes nothing.</div>
        <button onClick={()=>cfgRef.current&&cfgRef.current.click()} style={btn}>⬆️ Import config CSV…</button>
        <div style={{fontSize:"0.72rem",color:T.textMuted,margin:"2px 0 8px",lineHeight:1.5}}>Import replaces whichever sections the file contains. Other sections are untouched.</div>
        <button onClick={()=>{if(!confirm(`Reset ${label} to factory defaults?\n\nThis restores the built-in ${label} list. Your logged entries are unaffected.`))return;onFactorySection(ctab);}} style={btn}>↺ Reset {label} to factory</button>
        <button onClick={()=>{if(!confirm(`Empty the ${label} list?\n\nThe list becomes blank until you re-add or re-import. Your logged entries are unaffected.`))return;onClearConfig(ctab);}} style={{...btn,color:T.danger,borderColor:T.danger}}>⚠️ Clear {label} list</button>
        <div style={{borderTop:`1px solid ${T.border}`,marginTop:6,paddingTop:8}}>
          <button onClick={()=>{if(!confirm("Reset ALL config sections to factory defaults?\n\nEvery list is restored to its built-in version. Your logged entries are unaffected."))return;onFactoryAll();}} style={{...btn,marginBottom:0,color:T.textMuted}}>↺ Reset ALL config to factory</button>

        </div>
        <input ref={cfgRef} type="file" accept=".csv" onChange={handleCfgFile} style={{display:"none"}}/>
      </>}
  </div>);
}

function DataPanel({entries,deletedEntries,settings,onRepairEmoji,onImport,onClearEntries,onClearAll,onRestoreEntry,onExportJSON,onImportJSON,onRestore,offlineAuth,user,T}){
  const dataRef=useRef();
  const jsonRef=useRef();
  // N8: the "config" section moved out to ConfigTools, beside the config it
  // acts on. What's left here is purely about logged entries.
  const[section,setSection]=useState("data");  // data | restore
  const[entrySub,setEntrySub]=useState("all");
  const[showClear,setShowClear]=useState(false);

  // ── Local daily backup status ────────────────────────────────────────────
  // O9: this used to read window._jivanUid, a global that was never set
  // anywhere in the app — the uid always evaluated to "", so the lookup
  // below just grabbed whichever jivanlog-dailyBackup-* key localStorage
  // happened to iterate to first. Harmless with one account on a device;
  // silently wrong (someone else's backup status shown as "yours") on a
  // shared one. user is already available here as a real prop — using it
  // directly means looking up the exact key for THIS user, not guessing.
  const[localBk,setLocalBk]=useState(null);
  useEffect(()=>{
    if(!user?.uid)return;
    try{
      const v=JSON.parse(localStorage.getItem(`jivanlog-dailyBackup-${user.uid}`)||"null");
      if(v)setLocalBk(v);
    }catch(e){}
  },[user?.uid]);

  const ENTRY_SUBS=[["all","All"],["meal","🍽️ Meals"],["liquid","💧 Drinks"],["exercise","🏃 Exercise"],["medical","🩺 Medical"],["medication","💊 Meds"]];
  const CLEAR_OPTS=[
    {key:"all",   label:"⚠️ Clear EVERYTHING",  desc:"All entries moved to Trash + all config reset to factory.",danger:true},
    {key:"entries",label:"🗑️ Clear all entries", desc:"All entries moved to Trash. Config is kept."},
  ];


  const doExportCSV=()=>{
    const all=[...entries,...(deletedEntries||[])];
    const filtered=entrySub==="all"?all:all.filter(e=>e.type===entrySub);
    downloadCSV(buildAllCSV(filtered),`jivanlog-data-${entrySub}-${today()}.csv`);
  };

  const handleDataFile=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=ev=>onImport(ev.target.result);
    r.readAsText(f);e.target.value="";
  };
  const handleJSONFile=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=ev=>onImportJSON(ev.target.result);
    r.readAsText(f);e.target.value="";
  };
  const doClear=key=>{
    const opt=CLEAR_OPTS.find(o=>o.key===key);
    if(!confirm(opt.label+"\n\n"+opt.desc+"\n\nPress OK to confirm."))return;
    if(key==="all"){if(!confirm("FINAL CONFIRMATION — press OK to clear everything."))return;onClearAll();}
    else if(key==="entries"){if(!confirm("FINAL CONFIRMATION — move all entries to Trash?"))return;onClearEntries();}
    setShowClear(false);
  };

  const Pill=({val,label,cur,set})=>(
    <button onClick={()=>set(val)} className={`tbtn${cur===val?" on":""}`} style={{fontSize:"0.72rem",padding:"4px 9px",flexShrink:0}}>{label}</button>
  );
  const SecBtn=({val,label})=>(
    <button onClick={()=>setSection(val)} className={`tbtn${section===val?" on":""}`} style={{flex:1,fontWeight:600,fontSize:"0.8rem"}}>{label}</button>
  );
  const Row=({label,children})=>(
    <div style={{marginBottom:8}}>
      <div className="slabel">{label}</div>
      {children}
    </div>

// ── Shared reorder helpers ────────────────────────────────────────────────────
const moveItem=(arr,i,dir)=>{const a=[...arr];const j=i+dir;if(j<0||j>=a.length)return a;[a[i],a[j]]=[a[j],a[i]];return a;};
// Splice-out/splice-in, not a chain of adjacent swaps — a single drag gesture
// can drop an item several positions away in one move.
const moveToIndex=(arr,from,to)=>{
  if(from===to||from<0||to<0||from>=arr.length||to>=arr.length)return arr;
  const a=[...arr];const[item]=a.splice(from,1);a.splice(to,0,item);return a;
};

// N: drag-to-reorder, built on Pointer Events (one API unifies mouse/touch/pen,
// so no separate touch-event branch is needed). A dedicated grab handle keeps
// the drag gesture from fighting the row's other interactive elements — only
// the handle sets touchAction:"none", so page scroll is untouched everywhere
// else. Pointer capture means move/up events keep reaching the handle even
// once the finger/cursor leaves it, which is what makes a single continuous
// drag work. The existing ▲▼ buttons stay alongside it — drag is an addition,
// not a replacement, so nothing that already worked (and was tested) changes.
// N: replaces the earlier two-part UI (a toggle-chip row, plus a separate
// vertical list below just for reordering) with ONE row: tap a chip to
// toggle it on/off, drag an ENABLED chip left/right to reorder it — both
// actions live on the same chips now. Disabled chips sit after the enabled
// ones (catalog order) and are tap-only, since there's nothing to reorder
// among metrics that aren't active. Same tap-vs-drag disambiguation as
// before (a small movement threshold decides which gesture it is), just
// comparing X position instead of Y since this row is horizontal.
function MetricChip({metricKey,label,enabled,index,onToggle,onCommitMove,dragState,setDragState,chipRefs,chipRef,T}){
  const startPos=useRef(null);
  const draggingRef=useRef(false);
  const DRAG_THRESHOLD=6;
  const isDragging=enabled&&dragState.dragIndex===index;
  const isOver=enabled&&dragState.overIndex===index&&dragState.dragIndex!==null&&dragState.dragIndex!==index;
  const onPointerDown=e=>{
    if(!enabled)return;
    startPos.current={x:e.clientX};
    draggingRef.current=false;
    try{e.currentTarget.setPointerCapture(e.pointerId);}catch(err){}
  };
  const onPointerMoveChip=e=>{
    if(!enabled||!startPos.current)return;
    if(!draggingRef.current&&Math.abs(e.clientX-startPos.current.x)>DRAG_THRESHOLD){
      draggingRef.current=true;
      setDragState({dragIndex:index,overIndex:index});
    }
    if(draggingRef.current){
      const refs=chipRefs.current;
      let next=index;
      for(let idx=0;idx<refs.length;idx++){
        const el=refs[idx];if(!el)continue;
        const r=el.getBoundingClientRect();
        if(e.clientX>=r.left&&e.clientX<=r.right){next=idx;break;}
      }
      setDragState(cur=>cur.dragIndex===null?cur:{...cur,overIndex:next});
    }
  };
  const onPointerUpChip=()=>{
    if(!enabled){onToggle(metricKey);return;}
    if(draggingRef.current){
      // Read dragState directly rather than via setDragState's functional
      // updater — calling a side-effecting callback (onCommitMove, which
      // updates a DIFFERENT component's state) from inside an updater
      // triggers React's "update during render" warning. See the identical
      // fix on the vertical list this replaces.
      if(dragState.dragIndex!==null&&dragState.overIndex!==null&&dragState.dragIndex!==dragState.overIndex){
        onCommitMove(dragState.dragIndex,dragState.overIndex);
      }
    }else{
      onToggle(metricKey); // no real movement -> treat as a plain tap
    }
    startPos.current=null;draggingRef.current=false;
    setDragState({dragIndex:null,overIndex:null});
  };
  return(
    <button ref={chipRef}
      onPointerDown={onPointerDown} onPointerMove={onPointerMoveChip} onPointerUp={onPointerUpChip} onPointerCancel={onPointerUpChip}
      style={{padding:"2px 9px",borderRadius:20,fontSize:"0.72rem",border:"1px solid",cursor:enabled?"grab":"pointer",
        touchAction:enabled?"none":"auto",userSelect:"none",
        borderColor:enabled?T.accentBtn:T.border,background:isOver?T.accentBtn:enabled?T.accentBg:"transparent",
        color:enabled?T.accent:T.textMuted,opacity:isDragging?0.5:1,transition:"background 0.1s"}}>{label}</button>
  );
}
function MetricToggleRow({metrics,onToggle,onReorder,T}){
  const[dragState,setDragState]=useState({dragIndex:null,overIndex:null});
  const chipRefs=useRef([]);
  const disabledKeys=EXERCISE_METRIC_DEFS.map(d=>d.key).filter(k=>!metrics.includes(k));
  const displayOrder=[...metrics.map(k=>({key:k,enabled:true})),...disabledKeys.map(k=>({key:k,enabled:false}))];
  return(<div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:3}}>
    {displayOrder.map(item=>{
      const idx=item.enabled?metrics.indexOf(item.key):null;
      return<MetricChip key={item.key} metricKey={item.key} label={metricDef(item.key).label} enabled={item.enabled}
        index={idx} onToggle={onToggle} onCommitMove={onReorder} dragState={dragState} setDragState={setDragState}
        chipRefs={chipRefs} chipRef={item.enabled?(el=>{chipRefs.current[idx]=el;}):undefined} T={T}/>;
    })}
  </div>);
}
const ReorderBtns=({i,total,onMove,T})=>(<div style={{display:"flex",flexDirection:"column",gap:2,marginRight:4,flexShrink:0}}><button className="ibtn" onClick={()=>onMove(i,-1)} disabled={i===0} style={{padding:"2px 6px",minWidth:32,minHeight:22,fontSize:"0.72rem",opacity:i===0?0.2:1,lineHeight:1.3}}>▲</button><button className="ibtn" onClick={()=>onMove(i,1)} disabled={i===total-1} style={{padding:"2px 6px",minWidth:32,minHeight:22,fontSize:"0.72rem",opacity:i===total-1?0.2:1,lineHeight:1.3}}>▼</button></div>);

// B3: ICON_MAP is a single ordered list scanned first-match-wins, so a keyword that
// appears in an earlier category block shadows the same keyword in a later one.
// "weight" hit the Exercise entry (🏋️) before the Medical entry (⚖️), and "Herbal Tea"
// hit "tea" (🍵) before "herbal" (🌿). These per-category lists are consulted first,
// so a category can claim a keyword without disturbing the global fallback order.
const ICON_SCOPED={
  medical:[["heart rate","💓"],["pulse","💓"],["weight","⚖️"],["height","📏"],
           ["sugar","🩸"],["glucose","🩸"],["hba1c","🩸"],
           ["bp","❤️"],["blood pressure","❤️"],["pressure","❤️"]],
  drink:  [["herbal","🌿"],["tulsi","🌿"],["green tea","🌿"]],
  exercise:[["stairs","🪜"],["floors","🪜"],["weight","🏋️"]],
};

// O4: pickIcon does a linear substring scan over the keyword tables, run once
// per option in every dropdown, every render. ICON_SCOPED/ICON_MAP/ICON_DEFAULTS
// never change during a session, so (name, category, stored) always maps to the
// same icon — a plain cache eliminates the repeat scans without needing a hook.
const _iconCache=new Map();
function pickIcon(name, category="food", stored=""){
  const cacheKey=category+"|"+stored+"|"+name;
  const cached=_iconCache.get(cacheKey);
  if(cached!==undefined)return cached;
  let icon;
  if(stored)icon=stored;
  else if(!name)icon=ICON_DEFAULTS[category]||"•";
  else{
    const lc=name.toLowerCase();
    const scoped=ICON_SCOPED[category];
    icon=undefined;
    if(scoped){for(const[kw,ic] of scoped){if(lc.includes(kw)){icon=ic;break;}}}
    if(icon===undefined){for(const[kw,ic] of ICON_MAP){if(lc.includes(kw)){icon=ic;break;}}}
    if(icon===undefined)icon=ICON_DEFAULTS[category]||"•";
  }
  _iconCache.set(cacheKey,icon);
  return icon;
}

  const updSubNote=(i,sName,note)=>onChange(types.map((t,x)=>x===i?{...t,subTypes:(t.subTypes||[]).map(v=>subName(v)===sName?{name:sName,note}:v)}:t));
  const togM=(i,m)=>onChange(types.map((t,x)=>{if(x!==i)return t;const cur=normalizeMetrics(t.metrics)||[];const h=cur.includes(m);const next=h?cur.filter(v=>v!==m):[...cur,m];return{...t,metrics:encodeMetrics(next)};}));
  return(<div><div className="card" style={{marginBottom:7}}><div style={{display:"flex",gap:7}}><input placeholder="New exercise type…" value={nn} onChange={e=>setNn(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add()}/><button onClick={add} style={{flexShrink:0,padding:"7px 14px",borderRadius:8,border:"none",background:T.accentBtn,color:"#fff",cursor:"pointer",fontFamily:"inherit",fontWeight:600}}>Add</button></div><div style={{fontSize:"0.72rem",color:T.textMuted,marginTop:5}}>New types default to time metric. Toggle below to change.</div></div>
  <div style={{display:"flex",gap:5,marginBottom:6,alignItems:"center"}}>
    <span style={{fontSize:"0.72rem",color:T.textMuted}}>Sort:</span>
    <button onClick={()=>onChange([...types].sort((a,b)=>a.name.localeCompare(b.name)))} style={{padding:"2px 9px",borderRadius:6,border:`1px solid ${T.border}`,background:"transparent",color:T.textMuted,cursor:"pointer",fontSize:"0.72rem",fontFamily:"inherit"}}>A→Z</button>
    <button onClick={()=>onChange([...types].sort((a,b)=>b.name.localeCompare(a.name)))} style={{padding:"2px 9px",borderRadius:6,border:`1px solid ${T.border}`,background:"transparent",color:T.textMuted,cursor:"pointer",fontSize:"0.72rem",fontFamily:"inherit"}}>Z→A</button>
  </div>
  {types.map((t,i)=>(<div key={t.name} className="card" style={{marginBottom:7}}>
    <div style={{display:"flex",alignItems:"center",marginBottom:5}}>
      <ReorderBtns i={i} total={types.length} onMove={move} T={T}/>
      <IconBtn name={t.name} category="exercise" stored={t.icon||""} onSet={ic=>onChange(types.map((x,j)=>j===i?{...x,icon:ic}:x))} T={T}/>
      <span style={{fontWeight:600,fontSize:"0.85rem",flex:1,marginLeft:5}}>{t.name}</span>
      <div style={{display:"flex",gap:5}}><button className="ibtn" onClick={()=>setEi(ei===i?null:i)}>{ei===i?"✖️":"✏️"}</button><button className="ibtn" style={{color:T.danger}} onClick={()=>rem(i)}>🗑️</button></div>
    </div>
    {/* N: one row now, not two — tap a chip (Distance/Time/Floors/etc.) to
        toggle it on/off, drag an ENABLED chip left/right to reorder it. This
        replaced a separate vertical list that used to sit below purely for
        reordering; "count" still shows as "Floors" (a label change only —
        the stored key is unchanged, so nothing about past data changes). */}
    <MetricToggleRow key={t.name} metrics={normalizeMetrics(t.metrics)||[]}
      onToggle={m=>togM(i,m)}
      onReorder={(from,to)=>onChange(types.map((x,j)=>j!==i?x:{...x,metrics:encodeMetrics(moveToIndex(normalizeMetrics(x.metrics)||[],from,to))}))}
      T={T}/>
    <input placeholder="Default note (optional, e.g. 30 min brisk)" value={t.note||""} onChange={e=>onChange(types.map((x,j)=>j===i?{...x,note:e.target.value}:x))} style={{width:"100%",fontSize:"0.76rem",padding:"4px 7px",marginBottom:3,color:T.textSub}}/>
    {ei===i&&<div style={{marginTop:7}}>
      <RenameBox current={t.name} hits={countRenameHits(entries,"exercise",null,t.name)} onRename={nn=>onRename&&onRename("exercise",null,t.name,nn)} T={T}/>
      <div className="slabel" style={{marginTop:8}}>Sub-types</div>
      {subItems(t.subTypes).map((s,si)=>(<div key={s.name} style={{padding:"3px 0",borderBottom:`1px solid ${T.border}`}}>
        <div style={{display:"flex",alignItems:"center",fontSize:"0.8rem"}}>
          <ReorderBtns i={si} total={(t.subTypes||[]).length} onMove={(idx,dir)=>moveSub(i,idx,dir)} T={T}/>
          <span style={{flex:1}}>{s.name}</span>
          <RenameBox current={s.name} hits={countRenameHits(entries,"exerciseSub",t.name,s.name)} onRename={nn=>onRename&&onRename("exerciseSub",t.name,s.name,nn)} T={T}/>
          <button className="ibtn" style={{color:T.danger}} onClick={()=>remSub(i,s.name)}>🗑️</button>
        </div>
        <input placeholder="Sub-type note (optional)" value={s.note||""} onChange={e=>updSubNote(i,s.name,e.target.value)} style={{width:"100%",fontSize:"0.72rem",padding:"3px 6px",margin:"2px 0 3px",color:T.textSub}}/>
      </div>))}
      <AddInline placeholder="Add sub-type…" onAdd={s=>addSub(i,s)} T={T}/>
    </div>}
  </div>))}
  </div>);
}

// N6: inline rename. Deliberately shows the affected-entry count BEFORE the
// user commits, because a rename here rewrites history — it should never feel
// like an innocent text edit.
function RenameBox({label,current,hits,onRename,T}){
  const[open,setOpen]=useState(false);
  const[val,setVal]=useState(current);
  useEffect(()=>{setVal(current);},[current]);
  if(!open)return(
    <button onClick={()=>setOpen(true)} style={{padding:"3px 8px",borderRadius:6,border:`1px solid ${T.border}`,background:"transparent",color:T.textMuted,cursor:"pointer",fontSize:"0.72rem",fontFamily:"inherit"}}>✏️ Rename</button>
  );
  const changed=val.trim()&&val.trim()!==current;
  return(
    <div style={{display:"flex",flexDirection:"column",gap:4,width:"100%",marginTop:4}}>
      <div style={{display:"flex",gap:5,alignItems:"center"}}>
        <input value={val} onChange={e=>setVal(e.target.value)} placeholder={label||"New name"} style={{flex:1,fontSize:"0.78rem",padding:"4px 7px"}}
          onKeyDown={e=>{if(e.key==="Enter"&&changed){onRename(val.trim());setOpen(false);}if(e.key==="Escape")setOpen(false);}}/>
        <button disabled={!changed} onClick={()=>{onRename(val.trim());setOpen(false);}} style={{flexShrink:0,padding:"4px 10px",borderRadius:7,border:"none",background:changed?T.accentBtn:T.border,color:"#fff",cursor:changed?"pointer":"not-allowed",fontFamily:"inherit",fontWeight:600,fontSize:"0.75rem"}}>Rename</button>
        <button onClick={()=>{setVal(current);setOpen(false);}} style={{flexShrink:0,padding:"4px 8px",borderRadius:7,border:`1px solid ${T.border}`,background:"transparent",color:T.textMuted,cursor:"pointer",fontSize:"0.75rem",fontFamily:"inherit"}}>✖</button>
      </div>
      <div style={{fontSize:"0.72rem",color:hits>0?T.waterBtnText:T.textMuted,lineHeight:1.4}}>
        {hits>0?`Also updates ${hits} past ${hits===1?"entry":"entries"} so history stays consistent.`:"No past entries use this name."}
      </div>
    </div>
  );
}

function AddInline({placeholder,onAdd,T}){
  const[v,setV]=useState("");
  return(<div style={{display:"flex",gap:6,marginTop:6}}><input placeholder={placeholder} value={v} onChange={e=>setV(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"){onAdd(v);setV("");}}} style={{fontSize:"0.78rem"}}/><button onClick={()=>{onAdd(v);setV("");}} style={{flexShrink:0,padding:"5px 9px",fontSize:"0.78rem",borderRadius:8,border:"none",background:T.accentBtn,color:"#fff",cursor:"pointer",fontFamily:"inherit",fontWeight:600}}>Add</button></div>);
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
