function parseMedVal(v){
  if(!v)return null;
  // BP: "120/80" → take systolic only for primary line; expose both
  if(typeof v==="string"&&v.includes("/")){
    const [s,d]=v.split("/").map(Number);
    return isNaN(s)?null:{sys:s,dia:isNaN(d)?null:d};
  }
  const n=parseFloat(v);
  return isNaN(n)?null:n;
}

function isoWeek(dateStr){
  const d=new Date(dateStr+"T00:00:00");
  const day=d.getDay()||7;
  d.setDate(d.getDate()+4-day);
  const y=d.getFullYear();
  const start=new Date(y,0,1);
  const w=Math.ceil((((d-start)/86400000)+1)/7);
  return `${y}-W${String(w).padStart(2,"0")}`;
}
function isoMonth(dateStr){return dateStr.slice(0,7);}
function isoYear(dateStr){return dateStr.slice(0,4);}

// Build {label, values:[]} series for a given metric, range and aggregation
function buildTrendSeries(entries, metricName, rangeKey, aggMode){
  // Filter medical entries for this metric
  const stripEmoji=s=>(s||"").replace(/^[^\w\d]+/,"").trim();
  const med=entries.filter(e=>e.type==="medical"&&(stripEmoji(e.readingType)||stripEmoji(e.detail1))===metricName);
  if(!med.length)return null;

  const now=new Date();
  // Date boundaries
  const cutoffs={
    "7d":  7,  "30d": 30, "90d": 90,
    "12w": 84, "25w":175, "12m":365, "all":9999
  };
  const days=cutoffs[rangeKey]||90;
  const cutoff=new Date(now); cutoff.setDate(cutoff.getDate()-days);
  const inRange=rangeKey==="all"?med:med.filter(e=>new Date(e.date+"T00:00:00")>=cutoff);

  // Group key function
  const isWeekly=rangeKey==="12w"||rangeKey==="25w";
  const isMonthly=rangeKey==="12m";
  const groupFn=isMonthly?isoMonth:isWeekly?isoWeek:d=>d;

  // Bucket entries
  const buckets={};
  inRange.forEach(e=>{
    const key=groupFn(e.date);
    if(!buckets[key])buckets[key]=[];
    const raw=e.value??e.detail2??e.detail1;
    const v=parseMedVal(raw);
    if(v!==null)buckets[key].push({v,ts:e.timestamp||e.date,date:e.date});
  });

  const sortedKeys=Object.keys(buckets).sort();

  // Aggregate per bucket
  function aggBucket(items){
    if(!items.length)return null;
    // Sort helpers — sort items[] by date+time ascending/descending
    const asc=(a,b)=>a.ts.localeCompare(b.ts);
    const desc=(a,b)=>b.ts.localeCompare(a.ts);
    const isBP=typeof items[0].v==="object";
    if(isBP){
      // Sort items chronologically, then pick first or last by position
      const sortedAsc=[...items].filter(i=>i.v&&i.v.sys!==null).sort(asc);
      const sortedDesc=[...items].filter(i=>i.v&&i.v.sys!==null).sort(desc);
      if(!sortedAsc.length)return null;
      if(aggMode==="first")return{sys:sortedAsc[0].v.sys,dia:sortedAsc[0].v.dia,isBP:true};
      if(aggMode==="last") return{sys:sortedDesc[0].v.sys,dia:sortedDesc[0].v.dia,isBP:true};
      // avg
      const sysMean=Math.round(sortedAsc.reduce((s,i)=>s+i.v.sys,0)/sortedAsc.length);
      const validDia=sortedAsc.filter(i=>i.v.dia!==null);
      const diaMean=validDia.length?Math.round(validDia.reduce((s,i)=>s+i.v.dia,0)/validDia.length):null;
      return{sys:sysMean,dia:diaMean,isBP:true};
    }
    const valid=items.filter(i=>typeof i.v==="number");
    if(!valid.length)return null;
    if(aggMode==="first")return valid.slice().sort(asc)[0].v;
    if(aggMode==="last") return valid.slice().sort(desc)[0].v;
    return Math.round((valid.reduce((s,i)=>s+i.v,0)/valid.length)*10)/10;
  }

  const labels=[];const primary=[];const secondary=[];
  sortedKeys.forEach(k=>{
    const agg=aggBucket(buckets[k]);
    if(agg===null)return;
    // Format label
    if(isMonthly)labels.push(k.slice(0,7)); // YYYY-MM
    else if(isWeekly)labels.push(k);         // YYYY-Www
    else labels.push(k.slice(5));             // MM-DD
    if(agg&&agg.isBP){
      primary.push(agg.sys);secondary.push(agg.dia);
    } else {
      primary.push(agg);
    }
  });
  return{labels,primary,secondary,isBP:primary.length&&buckets[sortedKeys[0]]&&typeof aggBucket(buckets[sortedKeys[0]])==="object"&&aggBucket(buckets[sortedKeys[0]])&&aggBucket(buckets[sortedKeys[0]]).isBP};
}

// ── TrendsPanel ───────────────────────────────────────────────────────────────
const TREND_RANGES=[
  {key:"7d",  label:"7 Days"},
  {key:"30d", label:"30 Days"},
  {key:"90d", label:"90 Days"},
  {key:"12w", label:"12 Weeks"},
  {key:"25w", label:"25 Weeks"},
  {key:"12m", label:"12 Months"},
  {key:"all", label:"All Time"},
];
const AGG_MODES=[
  {key:"avg",   label:"Avg"},
  {key:"first", label:"First"},
  {key:"last",  label:"Last"},
];
const TREND_METRICS=["Sugar","BP","Weight"];

function TrendsPanel({entries,settings,T}){
  const[metric,setMetric]=React.useState("Sugar");
  const[range,setRange]=React.useState("all");
  const[agg,setAgg]=React.useState("avg");
  const canvasRef=React.useRef(null);
  const chartRef=React.useRef(null);

  // Resolve available metrics from settings
  const medPresets=settings.medicalPresets||FD.medicalPresets;
  const _stripE=s=>(s||"").replace(/^[^\w\d]+/,"").trim();
  const availMetrics=medPresets.map(p=>typeof p==="string"?p:p.name).filter(n=>
    entries.some(e=>e.type==="medical"&&(_stripE(e.readingType)||_stripE(e.detail1))===n)
  );

  React.useEffect(()=>{
    const series=buildTrendSeries(entries,metric,range,agg);
    const canvas=canvasRef.current;
    if(!canvas)return;

    // Destroy previous chart
    if(chartRef.current){chartRef.current.destroy();chartRef.current=null;}

    if(!series||!series.labels.length){
      const ctx=canvas.getContext("2d");
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle=T.textMuted;ctx.font="14px Arial";ctx.textAlign="center";
      ctx.fillText("No data for this metric and range.",canvas.width/2,canvas.height/2);
      return;
    }

    const isDark=document.documentElement.getAttribute("data-theme")==="dark"||
      (document.documentElement.getAttribute("data-theme")==="system"&&window.matchMedia("(prefers-color-scheme:dark)").matches);

    const gridColor=isDark?"rgba(255,255,255,0.1)":"rgba(0,0,0,0.08)";
    const textColor=isDark?"#aaa":"#555";

    const datasets=[];
    const rangeLabel=TREND_RANGES.find(r=>r.key===range)?.label||range;
    const aggLabel=AGG_MODES.find(a=>a.key===agg)?.label||agg;

    if(series.isBP){
      datasets.push({
        label:`${metric} Systolic (${aggLabel})`,
        data:series.primary,
        borderColor:"#e53935",backgroundColor:"rgba(229,57,53,0.12)",
        tension:0.35,pointRadius:3,pointHoverRadius:6,fill:false,
      });
      if(series.secondary&&series.secondary.length){
        datasets.push({
          label:`${metric} Diastolic (${aggLabel})`,
          data:series.secondary,
          borderColor:"#fb8c00",backgroundColor:"rgba(251,140,0,0.12)",
          tension:0.35,pointRadius:3,pointHoverRadius:6,fill:false,
        });
      }
    } else {
      const colors={Sugar:["#1a73e8","rgba(26,115,232,0.1)"],Weight:["#0b8457","rgba(11,132,87,0.1)"],BP:["#e53935","rgba(229,57,53,0.1)"]};
      const [bc,bgc]=colors[metric]||["#1a73e8","rgba(26,115,232,0.1)"];
      datasets.push({
        label:`${metric} (${aggLabel}, ${rangeLabel})`,
        data:series.primary,
        borderColor:bc,backgroundColor:bgc,
        tension:0.35,pointRadius:3,pointHoverRadius:6,fill:true,
      });
    }

    // Unit for Y axis
    const unit=(()=>{
      const p=medPresets.find(p=>(typeof p==="string"?p:p.name)===metric);
      return p&&typeof p==="object"?p.unit||"":"";
    })();

    const ctx=canvas.getContext("2d");
    chartRef.current=new Chart(ctx,{
      type:"line",
      data:{labels:series.labels,datasets},
      options:{
        responsive:true,
        maintainAspectRatio:false,
        interaction:{mode:"index",intersect:false},
        plugins:{
          legend:{display:true,labels:{color:textColor,font:{size:11}}},
          tooltip:{
            callbacks:{
              label:ctx=>{
                const v=ctx.parsed.y;
                if(v===null||v===undefined)return null;
                return` ${ctx.dataset.label.split("(")[0].trim()}: ${v}${unit?" "+unit:""}`;
              }
            }
          }
        },
        scales:{
          x:{ticks:{color:textColor,maxRotation:45,font:{size:10}},grid:{color:gridColor}},
          y:{ticks:{color:textColor,font:{size:10},callback:(v)=>unit?`${v} ${unit}`:v},grid:{color:gridColor}},
        }
      }
    });

    return()=>{if(chartRef.current){chartRef.current.destroy();chartRef.current=null;}};
  },[metric,range,agg,entries,T]);

  // Count data points for selected metric
  const dataCount=entries.filter(e=>e.type==="medical"&&(e.readingType||e.detail1)===metric).length;

  return(<div>
    <div className="card" style={{marginBottom:8}}>
      <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:8}}>
        {(availMetrics.length?availMetrics:TREND_METRICS).map(m=>(
          <button key={m} onClick={()=>setMetric(m)}
            className={`tbtn${metric===m?" on":""}`}
            style={{fontSize:"0.78rem"}}>{m}</button>
        ))}
      </div>
      <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:8}}>
        {TREND_RANGES.map(r=>(
          <button key={r.key} onClick={()=>setRange(r.key)}
            className={`tbtn${range===r.key?" on":""}`}
            style={{fontSize:"0.75rem",padding:"4px 8px"}}>{r.label}</button>
        ))}
      </div>
      <div style={{display:"flex",gap:5,marginBottom:4,alignItems:"center"}}>
        <span style={{fontSize:"0.72rem",color:T.textMuted}}>Reading:</span>
        {AGG_MODES.map(a=>(
          <button key={a.key} onClick={()=>setAgg(a.key)}
            className={`tbtn${agg===a.key?" on":""}`}
            style={{fontSize:"0.75rem",padding:"4px 10px"}}>{a.label}</button>
        ))}
        <span style={{fontSize:"0.7rem",color:T.textMuted,marginLeft:"auto"}}>{dataCount} readings</span>
      </div>
    </div>

  const[tab,setTab]=useState("view");const mostRecentDate=(()=>{const ds=entries.map(e=>e.date).filter(Boolean).sort();return ds.length?ds[ds.length-1]:today();})();

  const entriesByDate=useMemo(()=>{

        style={{flex:1,padding:"5px 6px",borderRadius:8,border:`2px solid ${T.accent}`,

ey={i} style={{color:v==="-"?T.border:T.text}}>{v}</td>)}</tr>);})}</tbody></table></div>}

// ── Config CSV export/import helpers ─────────────────────────────────────────
// Each section exports as its own CSV with a sentinel header row
// Sentinel: #JivanLog-Config-<section>-<version>

function csvCell(v){
  const s=String(v==null?"":v);
  return s.includes(",")||s.includes('"')||s.includes("\n")?`"${s.replace(/"/g,'""')}"`  :s;
}
function csvRow(arr){return arr.map(csvCell).join(",");}

function exportConfigCSV(settings,section){
  const lines=[];
  if(section==="all"||section==="food"){
    lines.push(`#JivanLog-Config-food-${APP_VERSION}`);
    lines.push(csvRow(["Name","Note","SubTypes"]));
    foodItems(settings.foodCategories||FD.foodCategories).forEach(f=>{
      lines.push(csvRow([f.name,f.note||"",(f.subTypes||[]).join(";")]));
    });
    if(section==="all")lines.push("");
  }
  if(section==="all"||section==="drinks"){
    lines.push(`#JivanLog-Config-drinks-${APP_VERSION}`);
    lines.push(csvRow(["Name","Note","SubTypes"]));
    const types=(settings.liquidTypes||FD.liquidTypes).filter(t=>t!=="--------");
    const notes=settings.liquidNotes||FD.liquidNotes||{};
    const subs=settings.liquidSubTypes||FD.liquidSubTypes||{};
    types.forEach(t=>{
      lines.push(csvRow([t,notes[t]||"",(subs[t]||[]).join(";")]));
    });
    if(section==="all")lines.push("");
  }
  if(section==="all"||section==="exercise"){
    lines.push(`#JivanLog-Config-exercise-${APP_VERSION}`);
    lines.push(csvRow(["Name","Metrics","Note","SubTypes"]));
    (settings.exerciseTypes||FD.exerciseTypes).forEach(e=>{
      lines.push(csvRow([e.name,(e.metrics||[]).join(";"),e.note||"",(e.subTypes||[]).join(";")]));
    });
    if(section==="all")lines.push("");
  }
  if(section==="all"||section==="medical"){
    lines.push(`#JivanLog-Config-medical-${APP_VERSION}`);
    lines.push(csvRow(["Name","Unit"]));
    (settings.medicalPresets||FD.medicalPresets).forEach(p=>{
      lines.push(csvRow([typeof p==="string"?p:p.name,typeof p==="string"?"":p.unit||""]));
    });
    if(section==="all")lines.push("");
  }
  if(section==="all"||section==="meds"){
    lines.push(`#JivanLog-Config-meds-${APP_VERSION}`);
    lines.push(csvRow(["Name"]));
    (settings.medications||FD.medications).forEach(m=>lines.push(csvCell(m)));
  }
  return lines.join("\n");
}

function importConfigCSV(csvText){
  // Splits multi-section "all" exports or handles single-section files
  const lines=csvText.split("\n").map(l=>l.trim());
  const result={};
  let section=null,headers=[];
  const parseCells=line=>{
    const row=[];let cur="",inQ=false;
    for(const ch of line+","){
      if(ch==='"'){inQ=!inQ;}
      else if(ch===","&&!inQ){row.push(cur.replace(/""/g,'"'));cur="";}
      else cur+=ch;
    }
    return row;
  };
  for(let i=0;i<lines.length;i++){
    const line=lines[i];
    if(!line)continue;
    // Sentinel row
    const sm=line.match(/^#JivanLog-Config-(\w+)-/);
    if(sm){section=sm[1];headers=[];continue;}
    if(!section)continue;
    // Header row (first non-sentinel, non-empty row after sentinel)
    if(!headers.length){headers=parseCells(line).map(h=>h.toLowerCase());continue;}
    const cells=parseCells(line);
    const get=h=>cells[headers.indexOf(h)]||"";
    const spl=v=>v?v.split(";").map(s=>s.trim()).filter(Boolean):[];

    if(section==="food"){
      if(!result.foodCategories)result.foodCategories=[];
      result.foodCategories.push({name:get("name"),note:get("note"),subTypes:spl(get("subtypes"))});
    }
    if(section==="drinks"){
      if(!result.liquidTypes)result.liquidTypes=[];
      if(!result.liquidNotes)result.liquidNotes={};
      if(!result.liquidSubTypes)result.liquidSubTypes={};
      const name=get("name");if(!name)continue;
      result.liquidTypes.push(name);
      if(get("note"))result.liquidNotes[name]=get("note");
      const subs=spl(get("subtypes"));if(subs.length)result.liquidSubTypes[name]=subs;
    }
    if(section==="exercise"){
      if(!result.exerciseTypes)result.exerciseTypes=[];
      result.exerciseTypes.push({name:get("name"),metrics:spl(get("metrics")),note:get("note"),subTypes:spl(get("subtypes"))});
    }
    if(section==="medical"){
      if(!result.medicalPresets)result.medicalPresets=[];
      result.medicalPresets.push({name:get("name"),unit:get("unit")});
    }
    if(section==="meds"){
      if(!result.medications)result.medications=[];
      const name=cells[0]||"";if(name&&!name.startsWith("#"))result.medications.push(name);
    }
  }
  if(!Object.keys(result).length)throw new Error("No config data found — check file format");
  return result;
}

      {ctab==="medical"&&<MedicalPresetSetting presets={active.medicalPresets||FD.medicalPresets} onAdd={addMedPreset} onRemove={removeMedPreset} onReorder={arr=>updateActive(p=>({...p,medicalPresets:arr}))} onUpdate={arr=>updateActive(p=>({...p,medicalPresets:arr}))} T={T}/>}
      {ctab==="meds"&&<EList items={active.medications||FD.medications} onRemove={item=>removeItem("medications",item)} onReorder={arr=>updateActive(p=>({...p,medications:arr}))} icons={active.medicationIcons||{}} onIconUpdate={(name,ic)=>updateActive(p=>({...p,medicationIcons:{...(p.medicationIcons||{}),[name]:ic}}))} newItem={newItem} setNew={setNewItem} onAdd={()=>addItem("medications")} T={T}/>}
      <ConfigTools ctab={ctab} settings={settings} onImportConfig={onImportConfig} onClearConfig={onClearConfig} onFactorySection={sec=>{
        const map={food:["foodCategories"],drinks:["liquidTypes","liquidNotes","liquidSubTypes","liquidIcons"],exercise:["exerciseTypes"],medical:["medicalPresets"],meds:["medications","medicationIcons"]};
        const keys=map[sec]||[];
        const patch={};keys.forEach(k=>{if(FD[k]!==undefined)patch[k]=deepClone(FD[k]);});
        updateActive(p=>({...p,...patch}));
      }} onFactoryAll={()=>updateActive(()=>deepClone(FD))} T={T}/>
    </>}

    {stab==="data"&&<DataPanel entries={entries} deletedEntries={deletedEntries} onImport={onImport} onClearEntries={onClearEntries} onClearAll={onClearAll} onRestoreEntry={onRestoreEntry} onExportJSON={onExportJSON} onImportJSON={onImportJSON} onRestore={onRestore} offlineAuth={offlineAuth} T={T}/>}
  </div>);
}

function AdminPanel({pendingRequests,adminsMap,allowlistMap,approvedUsersMap,onApproveRequest,onDenyRequest,onPromoteAdmin,onDemoteAdmin,onAddAllowlist,onRemoveAllowlist,T}){
  const[newEmail,setNewEmail]=useState("");
  const pendingList=Object.entries(pendingRequests||{});
  const adminList=Object.entries(adminsMap||{});
  const allowlistList=Object.entries(allowlistMap||{});
  // R2: the rules block writing the superadmin's own /admins record, so the
  // self-heal can never create it. Filtering on adminsMap alone would therefore
  // let the superadmin appear in their own promote list if a stray
  // approvedUsers/{superadmin} node exists. isSuperAdmin() is a code constant and
  // does not depend on database state, so it holds regardless.
  const approvedNotAdmin=Object.entries(approvedUsersMap||{}).filter(([uid])=>!(adminsMap&&adminsMap[uid])&&!isSuperAdmin(uid));
  const relTime=ts=>{if(!ts)return"";const d=Date.now()-ts;const m=Math.floor(d/60000);if(m<1)return"just now";if(m<60)return`${m}m ago`;const h=Math.floor(m/60);if(h<24)return`${h}h ago`;return`${Math.floor(h/24)}d ago`;};
  return(<>
    <div className="card">
      <div className="slabel">👤 Access Requests{pendingList.length>0?` (${pendingList.length})`:""}</div>
      {pendingList.length===0&&<div style={{fontSize:"0.78rem",color:T.textMuted,padding:"4px 0"}}>No pending requests.</div>}
      {pendingList.map(([uid,r])=>(
        <div key={uid} style={{display:"flex",alignItems:"center",gap:8,padding:"7px 0",borderBottom:`1px solid ${T.border}22`}}>
          {r.photoURL?<img src={r.photoURL} style={{width:32,height:32,borderRadius:"50%",flexShrink:0}} alt=""/>:<div style={{width:32,height:32,borderRadius:"50%",background:T.accentBtn,color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"0.8rem",fontWeight:700,flexShrink:0}}>{(r.name||r.email||"?")[0].toUpperCase()}</div>}
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:"0.82rem",fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.name||"(no name)"}</div>
            <div style={{fontSize:"0.68rem",color:T.textMuted,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.email} · {relTime(r.requestedAt)}</div>
            {r.message&&<div style={{fontSize:"0.74rem",color:T.textSub,fontStyle:"italic",marginTop:2}}>"{r.message}"</div>}
          </div>
          <button onClick={()=>onApproveRequest(uid,r)} style={{padding:"5px 9px",borderRadius:7,border:"none",background:"#2e7d32",color:"#fff",fontSize:"0.75rem",fontWeight:600,cursor:"pointer",flexShrink:0}}>✅</button>
          <button onClick={()=>onDenyRequest(uid)} style={{padding:"5px 9px",borderRadius:7,border:"none",background:T.danger,color:"#fff",fontSize:"0.75rem",fontWeight:600,cursor:"pointer",flexShrink:0}}>✖</button>
        </div>
      ))}
    </div>

    <div className="card">
      <div className="slabel">📧 Auto-approve emails</div>
      <div style={{fontSize:"0.72rem",color:T.textMuted,marginBottom:8,lineHeight:1.5}}>Anyone signing in with one of these emails skips the waiting room and is approved instantly.</div>
      <div style={{display:"flex",gap:7,marginBottom:8}}>
        <input placeholder="name@gmail.com" value={newEmail} onChange={e=>setNewEmail(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"){onAddAllowlist(newEmail);setNewEmail("");}}}/>
        <button onClick={()=>{onAddAllowlist(newEmail);setNewEmail("");}} style={{flexShrink:0,padding:"7px 14px",borderRadius:8,border:"none",background:T.accentBtn,color:"#fff",cursor:"pointer",fontFamily:"inherit",fontWeight:600}}>Add</button>
      </div>
      {allowlistList.length===0&&<div style={{fontSize:"0.76rem",color:T.textMuted}}>No pre-approved emails yet.</div>}
      {allowlistList.map(([key,e])=>(
        <div key={key} style={{display:"flex",alignItems:"center",padding:"5px 0",borderBottom:`1px solid ${T.border}22`,fontSize:"0.8rem"}}>
          <span style={{flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{e.email}</span>
          <button className="ibtn" onClick={()=>onRemoveAllowlist(key)} title="Remove">🗑️</button>
        </div>
      ))}
    </div>

    <div className="card">
      <div className="slabel">👑 Manage Admins</div>
      {adminList.map(([uid,a])=>(
        <div key={uid} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 0",borderBottom:`1px solid ${T.border}22`}}>
          {a.photoURL?<img src={a.photoURL} style={{width:28,height:28,borderRadius:"50%",flexShrink:0}} alt=""/>:<div style={{width:28,height:28,borderRadius:"50%",background:T.accentBtn,color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"0.75rem",fontWeight:700,flexShrink:0}}>{(a.name||a.email||"?")[0].toUpperCase()}</div>}
          <div style={{flex:1,minWidth:0,fontSize:"0.8rem",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{a.name||a.email||uid}{isSuperAdmin(uid)&&<span style={{color:T.accent,fontWeight:700}}> · Superadmin</span>}</div>
          {!isSuperAdmin(uid)&&<button className="ibtn" onClick={()=>onDemoteAdmin(uid)} title="Remove admin">🗑️</button>}
        </div>
      ))}
      {approvedNotAdmin.length>0&&<>
        <div style={{fontSize:"0.7rem",color:T.textMuted,margin:"9px 0 5px"}}>Promote an approved user:</div>
        {approvedNotAdmin.map(([uid,p])=>(
          <div key={uid} style={{display:"flex",alignItems:"center",gap:8,padding:"5px 0"}}>
            <div style={{flex:1,minWidth:0,fontSize:"0.8rem",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.name||p.email||uid}</div>
            <button onClick={()=>onPromoteAdmin(uid,p)} style={{padding:"4px 9px",borderRadius:7,border:`1px solid ${T.border}`,background:"transparent",color:T.accent,fontSize:"0.72rem",fontWeight:600,cursor:"pointer"}}>Promote</button>
          </div>
        ))}
      </>}
    </div>

    <div className="card">
      <div className="slabel">📊 Firebase Usage</div>
      <div style={{fontSize:"0.72rem",color:T.textMuted,marginBottom:8,lineHeight:1.5}}>Free tier: 1 GB stored, 10 GB downloaded/month. Worth a periodic glance as more people join.</div>
      <a href="https://console.firebase.google.com/project/jivanlog/usage" target="_blank" rel="noopener noreferrer" style={{display:"block",textAlign:"center",padding:"8px 12px",borderRadius:8,border:`1px solid ${T.border}`,background:T.cardBg,color:T.accent,fontSize:"0.8rem",fontWeight:600,textDecoration:"none"}}>Open Firebase Usage Console →</a>
    </div>
  </>);
}

// N8: config export / import / clear / factory-reset used to live under the
// Backup tab, separated from the config editing they act on. They now sit
// directly beneath the list being edited, scoped to the section in view.
function ConfigTools({ctab,settings,onImportConfig,onClearConfig,onFactorySection,onFactoryAll,T}){
  const cfgRef=useRef();
  const[open,setOpen]=useState(false);
  const LABEL={food:"Food",drinks:"Drinks",exercise:"Exercise",medical:"Medical",meds:"Meds"};
  const label=LABEL[ctab]||ctab;
  const handleCfgFile=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=ev=>{try{const cfg=importConfigCSV(ev.target.result);onImportConfig(cfg);}catch(err){alert("Config import failed: "+err.message);}};
    r.readAsText(f);e.target.value="";
  };
  const btn={width:"100%",padding:"8px",borderRadius:8,border:`1px solid ${T.border}`,background:T.inputBg,color:T.text,fontFamily:"inherit",fontWeight:600,fontSize:"0.78rem",cursor:"pointer",marginBottom:6};
  return(<div className="card" style={{marginTop:10}}>
    {!open
      ?<button onClick={()=>setOpen(true)} style={{width:"100%",padding:"8px",borderRadius:8,border:`1px solid ${T.border}`,background:"transparent",color:T.textMuted,fontFamily:"inherit",fontWeight:600,fontSize:"0.78rem",cursor:"pointer"}}>🛠️ {label} tools — export, import, reset…</button>
      :<>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <div className="slabel" style={{marginBottom:0}}>🛠️ {label} tools</div>
          <button onClick={()=>setOpen(false)} style={{background:"none",border:"none",color:T.textMuted,cursor:"pointer",fontSize:"0.9rem",padding:0}}>×</button>
        </div>
        <button onClick={()=>downloadCSV(exportConfigCSV(settings,ctab),`jivanlog-config-${ctab}-${today()}.csv`)} style={{...btn,background:T.accentBtn,color:"#fff",border:"none"}}>⬇️ Export {label} CSV</button>
        <button onClick={()=>downloadCSV(exportConfigCSV(settings,"all"),`jivanlog-config-all-${today()}.csv`)} style={btn}>⬇️ Export ALL config CSV</button>
        <button onClick={()=>cfgRef.current&&cfgRef.current.click()} style={btn}>⬆️ Import config CSV…</button>
        <div style={{fontSize:"0.68rem",color:T.textMuted,margin:"2px 0 8px",lineHeight:1.5}}>Import replaces whichever sections the file contains. Other sections are untouched.</div>
        <button onClick={()=>{if(!confirm(`Reset ${label} to factory defaults?\n\nThis restores the built-in ${label} list. Your logged entries are unaffected.`))return;onFactorySection(ctab);}} style={btn}>↺ Reset {label} to factory</button>
        <button onClick={()=>{if(!confirm(`Empty the ${label} list?\n\nThe list becomes blank until you re-add or re-import. Your logged entries are unaffected.`))return;onClearConfig(ctab);}} style={{...btn,color:T.danger,borderColor:T.danger}}>⚠️ Clear {label} list</button>
        <div style={{borderTop:`1px solid ${T.border}`,marginTop:6,paddingTop:8}}>
          <button onClick={()=>{if(!confirm("Reset ALL config sections to factory defaults?\n\nEvery list is restored to its built-in version. Your logged entries are unaffected."))return;onFactoryAll();}} style={{...btn,marginBottom:0,color:T.textMuted}}>↺ Reset ALL config to factory</button>
        </div>
        <input ref={cfgRef} type="file" accept=".csv" onChange={handleCfgFile} style={{display:"none"}}/>
      </>}
  </div>);
}

function DataPanel({entries,deletedEntries,onImport,onClearEntries,onClearAll,onRestoreEntry,onExportJSON,onImportJSON,onRestore,offlineAuth,T}){
  const dataRef=useRef();
  const jsonRef=useRef();
  // N8: the "config" section moved out to ConfigTools, beside the config it
  // acts on. What's left here is purely about logged entries.
  const[section,setSection]=useState("data");  // data | restore
  const[entrySub,setEntrySub]=useState("all");
  const[showClear,setShowClear]=useState(false);

  // ── Local daily backup status ────────────────────────────────────────────
  const[localBk,setLocalBk]=useState(null);
  useEffect(()=>{
    try{
      const uid=entries.length>0?(entries[0]&&window._jivanUid)||"":"";
      // Read from all possible localStorage keys for this user
      for(let i=0;i<localStorage.length;i++){
        const k=localStorage.key(i);
        if(k&&k.startsWith("jivanlog-dailyBackup-")){
          const v=JSON.parse(localStorage.getItem(k)||"null");
          if(v)setLocalBk(v);
          break;
        }
      }
    }catch(e){}
  },[]);

  const ENTRY_SUBS=[["all","All"],["meal","🍽️ Meals"],["liquid","💧 Drinks"],["exercise","🏃 Exercise"],["medical","🩺 Medical"],["medication","💊 Meds"]];
  const CLEAR_OPTS=[
    {key:"all",   label:"⚠️ Clear EVERYTHING",  desc:"All entries moved to Trash + all config reset to factory.",danger:true},
    {key:"entries",label:"🗑️ Clear all entries", desc:"All entries moved to Trash. Config is kept."},
  ];


  const doExportCSV=()=>{
    const all=[...entries,...(deletedEntries||[])];
    const filtered=entrySub==="all"?all:all.filter(e=>e.type===entrySub);
    downloadCSV(buildAllCSV(filtered),`jivanlog-data-${entrySub}-${today()}.csv`);
  };

  const handleDataFile=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=ev=>onImport(ev.target.result);
    r.readAsText(f);e.target.value="";
  };
  const handleJSONFile=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=ev=>onImportJSON(ev.target.result);
    r.readAsText(f);e.target.value="";
  };
  const doClear=key=>{
    const opt=CLEAR_OPTS.find(o=>o.key===key);
    if(!confirm(opt.label+"\n\n"+opt.desc+"\n\nPress OK to confirm."))return;
    if(key==="all"){if(!confirm("FINAL CONFIRMATION — press OK to clear everything."))return;onClearAll();}
    else if(key==="entries"){if(!confirm("FINAL CONFIRMATION — move all entries to Trash?"))return;onClearEntries();}
    setShowClear(false);
  };

  const Pill=({val,label,cur,set})=>(
    <button onClick={()=>set(val)} className={`tbtn${cur===val?" on":""}`} style={{fontSize:"0.72rem",padding:"4px 9px",flexShrink:0}}>{label}</button>
  );
  const SecBtn=({val,label})=>(
    <button onClick={()=>setSection(val)} className={`tbtn${section===val?" on":""}`} style={{flex:1,fontWeight:600,fontSize:"0.8rem"}}>{label}</button>
  );
  const Row=({label,children})=>(
    <div style={{marginBottom:8}}>
      <div className="slabel">{label}</div>
      {children}
    </div>
  );

  const liveCount=entries.length;
  const deadCount=(deletedEntries||[]).length;

  return(<div>
    {/* ── Section tabs ── */}
    <div style={{display:"flex",gap:4,marginBottom:12}}>
      <SecBtn val="data"    label="📊 Entries"/>
      <SecBtn val="restore" label="🛟 Restore"/>
    </div>

    {/* ══════════════ DATA BACKUP ══════════════ */}
    {section==="data"&&<>
      {/* Status card */}
      <div className="card" style={{marginBottom:8}}>
        <div className="slabel">📊 Data status</div>
        <div style={{display:"flex",justifyContent:"space-between",fontSize:"0.78rem",color:T.text,lineHeight:2}}>
          <span>✅ Live entries</span><span style={{fontWeight:600}}>{liveCount}</span>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",fontSize:"0.78rem",color:T.textMuted,lineHeight:2}}>
          <span>🗑️ In Trash</span><span>{deadCount}</span>
        </div>
        {localBk&&<>
          <div style={{borderTop:`1px solid ${T.border}`,marginTop:6,paddingTop:6}}>
            <div style={{fontSize:"0.7rem",color:T.textMuted}}>📱 Last device backup</div>
            <div style={{fontSize:"0.72rem",color:T.text,marginTop:2}}>
              {localBk.date} · {(localBk.entries||[]).length} today's entries · saved {localBk.savedAt?new Date(localBk.savedAt).toLocaleTimeString():""}
            </div>
          </div>
        </>}
      </div>

      {/* Filter pills */}
      <div style={{display:"flex",gap:4,flexWrap:"wrap",marginBottom:8}}>
        {ENTRY_SUBS.map(([k,l])=><Pill key={k} val={k} label={l} cur={entrySub} set={setEntrySub}/>)}
      </div>

      <Row label="⬇️ Export data">
        <div className="card">
          <div style={{fontSize:"0.73rem",color:T.textMuted,marginBottom:8,lineHeight:1.5}}>
            CSV export — {entrySub==="all"?"all entries including Trash":entrySub+" entries"}. Includes Deleted and DeletedAt columns so Trash entries are preserved in the file.
          </div>
          <button onClick={doExportCSV} style={{width:"100%",padding:"9px",borderRadius:8,border:"none",background:T.accentBtn,color:"#fff",fontFamily:"inherit",fontWeight:600,fontSize:"0.82rem",cursor:"pointer",marginBottom:6}}>
            ⬇️ Download CSV ({liveCount+deadCount} entries)
          </button>
          <button onClick={onExportJSON} style={{width:"100%",padding:"9px",borderRadius:8,border:`1px solid ${T.accentBtn}`,background:"transparent",color:T.accent,fontFamily:"inherit",fontWeight:600,fontSize:"0.82rem",cursor:"pointer"}}>
            ⬇️ Download full backup JSON
          </button>
        </div>
      </Row>

      <Row label="⬆️ Import data">
        <div className="card">
          <div style={{fontSize:"0.73rem",color:T.textMuted,marginBottom:8,lineHeight:1.5}}>Import a CSV or JSON backup. Existing entries are never overwritten — only new IDs are added.</div>
          <button onClick={()=>dataRef.current&&dataRef.current.click()} style={{width:"100%",padding:"9px",borderRadius:8,border:`1px solid ${T.border}`,background:T.inputBg,color:T.text,fontFamily:"inherit",fontWeight:600,fontSize:"0.82rem",cursor:"pointer",marginBottom:6}}>
            ⬆️ Import CSV
          </button>
          <button onClick={()=>jsonRef.current&&jsonRef.current.click()} disabled={offlineAuth} style={{width:"100%",padding:"9px",borderRadius:8,border:`1px solid ${T.border}`,background:offlineAuth?T.cardBg:T.inputBg,color:offlineAuth?T.textMuted:T.text,fontFamily:"inherit",fontWeight:600,fontSize:"0.82rem",cursor:offlineAuth?"not-allowed":"pointer"}}>
            ⬆️ Import JSON backup
          </button>
          <input ref={dataRef} type="file" accept=".csv" onChange={handleDataFile} style={{display:"none"}}/>
          <input ref={jsonRef} type="file" accept="application/json,.json" onChange={handleJSONFile} style={{display:"none"}}/>
        </div>
      </Row>

      <Row label="⚠️ Clear entries">
        <div className="card">
          {!showClear
            ?<button onClick={()=>setShowClear(true)} style={{width:"100%",padding:"9px",borderRadius:8,border:`1px solid ${T.border}`,background:"transparent",color:T.textMuted,fontFamily:"inherit",fontWeight:600,fontSize:"0.82rem",cursor:"pointer"}}>Show clear options…</button>
            :<div style={{display:"flex",flexDirection:"column",gap:6}}>
              {CLEAR_OPTS.filter(o=>o.key==="entries"||o.key==="all").map(o=>(
                <button key={o.key} onClick={()=>doClear(o.key)} style={{width:"100%",padding:"8px",borderRadius:8,border:`1px solid ${o.danger?"#ef4444":T.border}`,background:"transparent",color:o.danger?"#ef4444":T.text,fontFamily:"inherit",fontWeight:600,fontSize:"0.78rem",cursor:"pointer",textAlign:"left"}}>
                  {o.label}<div style={{fontSize:"0.66rem",fontWeight:400,color:T.textMuted,marginTop:2}}>{o.desc}</div>
                </button>
              ))}
              <button onClick={()=>setShowClear(false)} style={{padding:"6px",borderRadius:8,border:`1px solid ${T.border}`,background:"transparent",color:T.textMuted,fontFamily:"inherit",fontSize:"0.78rem",cursor:"pointer"}}>Cancel</button>
            </div>
          }
        </div>
      </Row>
    </>}

    {/* ══════════════ RESTORE & SAFETY ══════════════ */}
    {section==="restore"&&<DataSafetyCard entries={entries} deletedEntries={deletedEntries} onRestoreEntry={onRestoreEntry} onExportJSON={onExportJSON} onImportJSON={onImportJSON} onRestore={onRestore} offlineAuth={offlineAuth} T={T}/>}

  </div>);
}


function MedicalPresetSetting({presets,onAdd,onRemove,onReorder,onUpdate,T}){
  const[nm,setNm]=useState("");const[ut,setUt]=useState("");
  const add=()=>{if(!nm.trim())return;onAdd(nm.trim(),ut.trim());setNm("");setUt("");};
  return(<div><div className="card" style={{marginBottom:7}}>
    <div style={{display:"flex",gap:7,marginBottom:7}}><input placeholder="Reading name…" value={nm} onChange={e=>setNm(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add()}/><input placeholder="Unit…" value={ut} onChange={e=>setUt(e.target.value)} style={{width:80}} onKeyDown={e=>e.key==="Enter"&&add()}/><button onClick={add} style={{flexShrink:0,padding:"7px 14px",borderRadius:8,border:"none",background:T.accentBtn,color:"#fff",cursor:"pointer",fontFamily:"inherit",fontWeight:600}}>Add</button></div>
  </div>
  <div style={{display:"flex",gap:5,marginBottom:6,alignItems:"center"}}>
    <span style={{fontSize:"0.72rem",color:T.textMuted}}>Sort:</span>
    <button onClick={()=>onReorder([...(presets||[])].sort((a,b)=>(a.name||a).localeCompare(b.name||b)))} style={{padding:"2px 9px",borderRadius:6,border:`1px solid ${T.border}`,background:"transparent",color:T.textMuted,cursor:"pointer",fontSize:"0.72rem",fontFamily:"inherit"}}>A→Z</button>
    <button onClick={()=>onReorder([...(presets||[])].sort((a,b)=>(b.name||b).localeCompare(a.name||a)))} style={{padding:"2px 9px",borderRadius:6,border:`1px solid ${T.border}`,background:"transparent",color:T.textMuted,cursor:"pointer",fontSize:"0.72rem",fontFamily:"inherit"}}>Z→A</button>
  </div>
  {(presets||[]).map((p,i)=>{const nm2=typeof p==="string"?p:p.name;const ut2=typeof p==="string"?"":p.unit;return(<div key={nm2} style={{display:"flex",alignItems:"center",padding:"5px 0",borderBottom:`1px solid ${T.border}`,fontSize:"0.82rem"}}>
    <ReorderBtns i={i} total={(presets||[]).length} onMove={(idx,dir)=>{const moved=moveItem(presets,idx,dir);onReorder(moved);}} T={T}/>

// Category fallbacks when no keyword matches
const ICON_DEFAULTS={food:"🍽️",drink:"💧",exercise:"🏃",medical:"🩺",medication:"💊"};

// B3: ICON_MAP is a single ordered list scanned first-match-wins, so a keyword that
// appears in an earlier category block shadows the same keyword in a later one.
// "weight" hit the Exercise entry (🏋️) before the Medical entry (⚖️), and "Herbal Tea"
// hit "tea" (🍵) before "herbal" (🌿). These per-category lists are consulted first,
// so a category can claim a keyword without disturbing the global fallback order.
const ICON_SCOPED={
  medical:[["heart rate","💓"],["pulse","💓"],["weight","⚖️"],["height","📏"],
           ["sugar","🩸"],["glucose","🩸"],["hba1c","🩸"],
           ["bp","❤️"],["blood pressure","❤️"],["pressure","❤️"]],
  drink:  [["herbal","🌿"],["tulsi","🌿"],["green tea","🌿"]],
  exercise:[["stairs","🪜"],["floors","🪜"],["weight","🏋️"]],
};

// O4: pickIcon does a linear substring scan over the keyword tables, run once
// per option in every dropdown, every render. ICON_SCOPED/ICON_MAP/ICON_DEFAULTS
// never change during a session, so (name, category, stored) always maps to the
// same icon — a plain cache eliminates the repeat scans without needing a hook.
const _iconCache=new Map();
function pickIcon(name, category="food", stored=""){
  const cacheKey=category+"|"+stored+"|"+name;
  const cached=_iconCache.get(cacheKey);
  if(cached!==undefined)return cached;
  let icon;
  if(stored)icon=stored;
  else if(!name)icon=ICON_DEFAULTS[category]||"•";
  else{
    const lc=name.toLowerCase();
    const scoped=ICON_SCOPED[category];
    icon=undefined;
    if(scoped){for(const[kw,ic] of scoped){if(lc.includes(kw)){icon=ic;break;}}}
    if(icon===undefined){for(const[kw,ic] of ICON_MAP){if(lc.includes(kw)){icon=ic;break;}}}
    if(icon===undefined)icon=ICON_DEFAULTS[category]||"•";
  }
  _iconCache.set(cacheKey,icon);
  return icon;
}

    </div>
    <div style={{display:"flex",gap:5,marginBottom:6,alignItems:"center"}}>
      <span style={{fontSize:"0.72rem",color:T.textMuted}}>Sort:</span>
      <button onClick={()=>onUpdate("types",[...drinks].sort((a,b)=>a.localeCompare(b)))} style={{padding:"2px 9px",borderRadius:6,border:`1px solid ${T.border}`,background:"transparent",color:T.textMuted,cursor:"pointer",fontSize:"0.72rem",fontFamily:"inherit"}}>A→Z</button>
      <button onClick={()=>onUpdate("types",[...drinks].sort((a,b)=>b.localeCompare(a)))} style={{padding:"2px 9px",borderRadius:6,border:`1px solid ${T.border}`,background:"transparent",color:T.textMuted,cursor:"pointer",fontSize:"0.72rem",fontFamily:"inherit"}}>Z→A</button>
    </div>
    {drinks.map((name,i)=>(
      <div key={name} className="card" style={{marginBottom:7}}>
        <div style={{display:"flex",alignItems:"center",marginBottom:4}}>
          <ReorderBtns i={i} total={drinks.length} onMove={move} T={T}/>
          <IconBtn name={name} category="drink" stored={(icons||{})[name]||""} onSet={ic=>onIconUpdate&&onIconUpdate(name,ic)} T={T}/>
          <span style={{fontWeight:600,fontSize:"0.85rem",flex:1,marginLeft:5}}>{name}</span>
          <button className="ibtn" onClick={()=>setEi(ei===name?null:name)}>{ei===name?"✖️":"✏️"}</button>
          <button className="ibtn" style={{color:T.danger}} onClick={()=>onRemove(name)}>🗑️</button>
        </div>
        <input placeholder="Default note (optional)" value={(notes||{})[name]||""} onChange={e=>updNote(name,e.target.value)} style={{width:"100%",fontSize:"0.76rem",padding:"4px 7px",marginBottom:ei===name?6:0,color:T.textSub}}/>
        {ei===name&&<div style={{marginTop:5}}>
          <div className="slabel">Sub-types</div>
          {((subTypes||{})[name]||[]).map((s,si)=>(<div key={s} style={{display:"flex",alignItems:"center",fontSize:"0.8rem",padding:"3px 0",borderBottom:`1px solid ${T.border}`}}>
            <ReorderBtns i={si} total={((subTypes||{})[name]||[]).length} onMove={(idx,dir)=>moveSub(name,idx,dir)} T={T}/>
            <span style={{flex:1}}>{s}</span>
            <button className="ibtn" style={{color:T.danger}} onClick={()=>remSub(name,s)}>🗑️</button>
          </div>))}
          <AddInline placeholder="Add sub-type..." onAdd={s=>addSub(name,s)} T={T}/>
        </div>}
      </div>
    ))}
  </div>);
}

function EList({items,onRemove,onReorder,icons,onIconUpdate,newItem,setNew,onAdd,T}){
  return(<div className="card"><div style={{display:"flex",gap:7,marginBottom:9}}><input placeholder="Add new item…" value={newItem} onChange={e=>setNew(e.target.value)} onKeyDown={e=>e.key==="Enter"&&onAdd()}/><button onClick={onAdd} style={{flexShrink:0,padding:"7px 14px",borderRadius:8,border:"none",background:T.accentBtn,color:"#fff",cursor:"pointer",fontFamily:"inherit",fontWeight:600}}>Add</button></div>
  <div style={{display:"flex",gap:5,marginBottom:6,alignItems:"center"}}>
    <span style={{fontSize:"0.72rem",color:T.textMuted}}>Sort:</span>
    <button onClick={()=>onReorder&&onReorder([...(items||[])].sort((a,b)=>a.localeCompare(b)))} style={{padding:"2px 9px",borderRadius:6,border:`1px solid ${T.border}`,background:"transparent",color:T.textMuted,cursor:"pointer",fontSize:"0.72rem",fontFamily:"inherit"}}>A→Z</button>
    <button onClick={()=>onReorder&&onReorder([...(items||[])].sort((a,b)=>b.localeCompare(a)))} style={{padding:"2px 9px",borderRadius:6,border:`1px solid ${T.border}`,background:"transparent",color:T.textMuted,cursor:"pointer",fontSize:"0.72rem",fontFamily:"inherit"}}>Z→A</button>
  </div>
  {(items||[]).map((item,i)=>(<div key={item} style={{display:"flex",alignItems:"center",padding:"4px 0",borderBottom:`1px solid ${T.border}`,fontSize:"0.82rem"}}>
    {onReorder&&<ReorderBtns i={i} total={(items||[]).length} onMove={(idx,dir)=>onReorder(moveItem(items,idx,dir))} T={T}/>}
    <IconBtn name={item} category="medication" stored={(icons||{})[item]||""} onSet={ic=>onIconUpdate&&onIconUpdate(item,ic)} T={T}/>
    <span style={{flex:1,marginLeft:5}}>{item}</span>
    <button className="ibtn" style={{color:T.danger}} onClick={()=>onRemove(item)}>🗑️</button>
  </div>))}
  </div>);
}
function ExerciseSetting({types,onChange,T}){
  const[ei,setEi]=useState(null);const[nn,setNn]=useState("");
  const add=()=>{if(!nn.trim())return;onChange([...types,{name:nn.trim(),subTypes:[],metrics:["time"],note:"",icon:""}]);setNn("");};
  const rem=i=>onChange(types.filter((_,x)=>x!==i));
  const move=(i,dir)=>onChange(moveItem(types,i,dir));
  const addSub=(i,s)=>{if(!s.trim())return;onChange(types.map((t,x)=>x===i?{...t,subTypes:[...(t.subTypes||[]),s.trim()]}:t));};
  const remSub=(i,s)=>onChange(types.map((t,x)=>x===i?{...t,subTypes:t.subTypes.filter(v=>v!==s)}:t));
  const moveSub=(i,si,dir)=>onChange(types.map((t,x)=>x===i?{...t,subTypes:moveItem(t.subTypes||[],si,dir)}:t));
  const togM=(i,m)=>onChange(types.map((t,x)=>{if(x!==i)return t;const h=t.metrics.includes(m);return{...t,metrics:h?t.metrics.filter(v=>v!==m):[...t.metrics,m]};}));
  return(<div><div className="card" style={{marginBottom:7}}><div style={{display:"flex",gap:7}}><input placeholder="New exercise type…" value={nn} onChange={e=>setNn(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add()}/><button onClick={add} style={{flexShrink:0,padding:"7px 14px",borderRadius:8,border:"none",background:T.accentBtn,color:"#fff",cursor:"pointer",fontFamily:"inherit",fontWeight:600}}>Add</button></div><div style={{fontSize:"0.7rem",color:T.textMuted,marginTop:5}}>New types default to time metric. Toggle below to change.</div></div>
  <div style={{display:"flex",gap:5,marginBottom:6,alignItems:"center"}}>
    <span style={{fontSize:"0.72rem",color:T.textMuted}}>Sort:</span>
    <button onClick={()=>onChange([...types].sort((a,b)=>a.name.localeCompare(b.name)))} style={{padding:"2px 9px",borderRadius:6,border:`1px solid ${T.border}`,background:"transparent",color:T.textMuted,cursor:"pointer",fontSize:"0.72rem",fontFamily:"inherit"}}>A→Z</button>
    <button onClick={()=>onChange([...types].sort((a,b)=>b.name.localeCompare(a.name)))} style={{padding:"2px 9px",borderRadius:6,border:`1px solid ${T.border}`,background:"transparent",color:T.textMuted,cursor:"pointer",fontSize:"0.72rem",fontFamily:"inherit"}}>Z→A</button>
  </div>
  {types.map((t,i)=>(<div key={t.name} className="card" style={{marginBottom:7}}>
    <div style={{display:"flex",alignItems:"center",marginBottom:5}}>
      <ReorderBtns i={i} total={types.length} onMove={move} T={T}/>
      <IconBtn name={t.name} category="exercise" stored={t.icon||""} onSet={ic=>onChange(types.map((x,j)=>j===i?{...x,icon:ic}:x))} T={T}/>
      <span style={{fontWeight:600,fontSize:"0.85rem",flex:1,marginLeft:5}}>{t.name}</span>
      <div style={{display:"flex",gap:5}}><button className="ibtn" onClick={()=>setEi(ei===i?null:i)}>{ei===i?"✖️":"✏️"}</button><button className="ibtn" style={{color:T.danger}} onClick={()=>rem(i)}>🗑️</button></div>
    </div>
    <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:3}}>{["distance","time","count"].map(m=>(<button key={m} onClick={()=>togM(i,m)} style={{padding:"2px 9px",borderRadius:20,fontSize:"0.72rem",border:"1px solid",cursor:"pointer",borderColor:t.metrics.includes(m)?T.accentBtn:T.border,background:t.metrics.includes(m)?T.accentBg:"transparent",color:t.metrics.includes(m)?T.accent:T.textMuted}}>{m}</button>))}</div>
    <input placeholder="Default note (optional, e.g. 30 min brisk)" value={t.note||""} onChange={e=>onChange(types.map((x,j)=>j===i?{...x,note:e.target.value}:x))} style={{width:"100%",fontSize:"0.76rem",padding:"4px 7px",marginBottom:3,color:T.textSub}}/>
    {ei===i&&<div style={{marginTop:7}}><div className="slabel">Sub-types</div>
      {(t.subTypes||[]).map((s,si)=>(<div key={s} style={{display:"flex",alignItems:"center",fontSize:"0.8rem",padding:"3px 0",borderBottom:`1px solid ${T.border}`}}>
        <ReorderBtns i={si} total={(t.subTypes||[]).length} onMove={(idx,dir)=>moveSub(i,idx,dir)} T={T}/>
        <span style={{flex:1}}>{s}</span>
        <button className="ibtn" style={{color:T.danger}} onClick={()=>remSub(i,s)}>🗑️</button>
      </div>))}
      <AddInline placeholder="Add sub-type…" onAdd={s=>addSub(i,s)} T={T}/>
    </div>}
  </div>))}
  </div>);
}

function AddInline({placeholder,onAdd,T}){
  const[v,setV]=useState("");
  return(<div style={{display:"flex",gap:6,marginTop:6}}><input placeholder={placeholder} value={v} onChange={e=>setV(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"){onAdd(v);setV("");}}} style={{fontSize:"0.78rem"}}/><button onClick={()=>{onAdd(v);setV("");}} style={{flexShrink:0,padding:"5px 9px",fontSize:"0.78rem",borderRadius:8,border:"none",background:T.accentBtn,color:"#fff",cursor:"pointer",fontFamily:"inherit",fontWeight:600}}>Add</button></div>);
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(e=>console.log('SW:',e));});}</script>
