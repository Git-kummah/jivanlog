};

// A bare number with no colon is a legacy value ("15" = 15 minutes, the only
// format ever stored before this change) — display it plainly rather than
// forcing it through mm:ss, but EDITING it upgrades it to mm:ss on next save.
const formatTimeDisplay=v=>{
  if(v===undefined||v===null||v==="")return"";
  const s=String(v);
  return s.includes(":")?s:`${s}min`;
};
const timeToMinSS=v=>{
  if(v===undefined||v===null||v==="")return"";
  const s=String(v);
  return s.includes(":")?s:(/^\d+$/.test(s)?`${s.padStart(2,"0")}:00`:s);
};

// Shared by Reports (dayReport), CSV export, Today's Log (TLE) and Manage
// (ManageRow) — one place that knows how to turn an exercise entry's metric
// fields into display text, so all four always agree with each other and
// with EXERCISE_METRIC_DEFS's labels/order.
function exerciseMetricParts(e,exerciseTypesConfig){
  // N: this used to always use the fixed catalog order, so per-exercise
  // reordering only ever affected the entry FORM's input order — Today's Log,
  // Manage, and Reports kept showing every Stairs entry (past and future) in
  // catalog order regardless. Now it looks up the exercise's CURRENT
  // configured order and uses that for display too. Anything the entry
  // actually has a value for, but that isn't in the current config (e.g. a
  // metric since disabled for this exercise), is still shown — appended in
  // catalog order — so a later config change can never hide logged data.
  const cfgEx=(exerciseTypesConfig||[]).find(x=>x.name===e.exType);
  const configuredOrder=normalizeMetrics(cfgEx?.metrics)||[];
  const remainingKeys=EXERCISE_METRIC_DEFS.map(d=>d.key).filter(k=>!configuredOrder.includes(k));
  const orderKeys=[...configuredOrder,...remainingKeys];
  return orderKeys
    .map(k=>metricDef(k))
    .filter(d=>e[d.field])
    .map(d=>{
      if(d.kind==="time")return formatTimeDisplay(e[d.field]);
      if(d.key==="distance")return`${e[d.field]}km`;
      if(d.key==="speed")return`${e[d.field]}km/h`;
      if(d.key==="count")return`${e[d.field]} Floors`;
      if(d.key==="hr")return`HR ${e[d.field]}`;
      if(d.key==="steps")return`${e[d.field]} Steps`;
      return`${e[d.field]}`;
    });
}

// N: mm:ss masked duration input. Digits only; the colon is inserted
// programmatically at a fixed position (after 2 digits) so typing AND
// backspacing both just work — no special-casing needed for either
// direction. Validates both mm and ss to 0–59 per spec; legacy plain-minute
// values from before this change (e.g. "15") are accepted and normalised to
// mm:ss ("15:00") the moment they're edited.
function TimeDurationInput({value,onChange,T}){
  // Bug fix: the previous version ran EVERY value through timeToMinSS() on
  // every render, which is correct for a genuinely legacy stored value
  // ("15" -> "15:00") but wrong for a value mid-typing — typing "5" set the
  // stored value to "5", which timeToMinSS then treated as ANOTHER legacy
  // value and force-padded to "05:00" before the next keystroke could land,
  // making it impossible to type past the first digit.
  //
  // `local` is now the single source of truth for what's on screen. It's
  // seeded from `value` once (upgrading a legacy value at that moment only),
  // and only re-seeded later if `value` changes to something OUR OWN last
  // edit didn't produce — i.e. a genuine external reset (the form clearing
  // after Save), never an echo of what was just typed.
  const[local,setLocal]=useState(()=>timeToMinSS(value));
  useEffect(()=>{if(value!==local)setLocal(timeToMinSS(value));},[value]); // eslint-disable-line
  const handleChange=raw=>{
    const digits=raw.replace(/[^0-9]/g,"").slice(0,4);
    const formatted=digits.length>2?digits.slice(0,2)+":"+digits.slice(2):digits;
    setLocal(formatted);
    onChange(formatted);
  };
  const[mm,ss]=local.split(":");
  const mmN=mm!==undefined&&mm!==""?parseInt(mm,10):null;
  const ssN=ss!==undefined&&ss!==""?parseInt(ss,10):null;
  const mmErr=mmN!==null&&!isNaN(mmN)&&mmN>59;
  const ssErr=ssN!==null&&!isNaN(ssN)&&ssN>59;
  const err=mmErr||ssErr;
  return(<div style={{display:"flex",flexDirection:"column"}}>
    <input value={local} onChange={e=>handleChange(e.target.value)} placeholder="mm:ss" inputMode="numeric"
      style={{width:64,textAlign:"center",fontFamily:"'DM Mono',monospace",borderColor:err?T.danger:undefined}}/>
    {err&&<span style={{fontSize:"0.72rem",color:T.danger,marginTop:1}}>{mmErr?"mm":"ss"}&gt;59</span>}
  </div>);
}

// N: BP auto-slash. Digits only; once 3 digits are typed (covers the large
// majority of real systolic readings, 100–199) the "/" is inserted for you.
// A 2-digit systolic (e.g. a low "90") just needs a manual "/" — typing one
// yourself is always respected and never overridden.
function BPValueInput({value,onChange,T}){
  const handleChange=raw=>{
    if(raw.includes("/")){onChange(raw.replace(/[^0-9/]/g,""));return;}
    const digits=raw.replace(/[^0-9]/g,"").slice(0,6);
    const formatted=digits.length>3?digits.slice(0,3)+"/"+digits.slice(3):digits;
    onChange(formatted);
  };
  return<input value={value} onChange={e=>handleChange(e.target.value)} placeholder="Sys/Dia" inputMode="numeric" style={{width:"100%"}}/>;
}

function App(){
  const[authState,setAuthState]=useState("checking");
  const[authError,setAuthError]=useState(null);
  const[user,setUser]=useState(null);
  const[page,setPage]=useState("home");
  const[locked,setLocked]=useState(false);
  // S6: `locked` can't read the persisted flag directly in useState's
  // initializer above — `user` isn't known yet at that point in the
  // component's own initialization. This runs once user resolves (whether
  // from the optimistic cache boot or the real onAuthStateChanged callback)
  // and picks up a lock left active from before a refresh or app restart.
  useEffect(()=>{
    if(!user)return;
    try{if(localStorage.getItem(lockedFlagKey(user.uid))==="1")setLocked(true);}catch(e){}
  },[user]);
  const[entries,setEntries]=useState([]);
  const[deletedEntries,setDeletedEntries]=useState([]);
  const[settings,setSettings]=useState(deepClone(FD));
  const[theme,setTheme]=useState("system");
  const[dayRolloverMin,setDayRolloverMinR]=useState(DAY_ROLLOVER_MIN);
  const[dataLoaded,setDataLoaded]=useState(false);
  // O1: clock moved to its own leaf component (see Clock, below) so a 1s
  // tick no longer re-renders this whole App tree.
  const[entryTime,setEntryTime]=useState(nowHHMM());
  const[syncStatus,setSyncStatus]=useState("idle");
  const[showUserMenu,setShowUserMenu]=useState(false);
  const[isOnline,setIsOnline]=useState(navigator.onLine);
  const isOnlineRef=useRef(navigator.onLine);
  // E2: tracked live (not just read once) so the header can distinguish
  // "device has no network at all" from "device has network but Firebase's
  // socket hasn't confirmed yet" — the exact scenario the v4.70 watchdog
  // exists for. Previously both looked identical: a bare 📵.
  const[browserOnline,setBrowserOnline]=useState(navigator.onLine);
  // E3: oldest still-unsynced write. Was previously declared further down,
  // after App's authState/accessState early-return guards — meaning this hook
  // ran on some renders (signed in) and not others (checking/pending/denied/
  // signed out), a Rules-of-Hooks violation that crashed the app the moment a
  // render crossed that boundary (React error #310, hit live during sign-in).
  // Every hook in a component must run unconditionally on every render, so it
  // now sits here with the rest of App's unconditional state.
  const[queueOldestAt,setQueueOldestAt]=useState(null);
  useEffect(()=>{
    const on=()=>setBrowserOnline(true);
    const off=()=>setBrowserOnline(false);
    window.addEventListener("online",on);
    window.addEventListener("offline",off);
    return()=>{window.removeEventListener("online",on);window.removeEventListener("offline",off);};
  },[]);
  const[queueSize,setQueueSize]=useState(0);
  // Recomputed whenever the queue changes. Feeds QueueAgeBadge's 1h warning.
  useEffect(()=>{
    if(!user){setQueueOldestAt(null);return;}
    const q=getOfflineQ(user.uid);
    setQueueOldestAt(q.length?Math.min(...q.map(e=>e._queuedAt||Date.now())):null);
  },[queueSize,user]);
  const[offlineAuth,setOfflineAuth]=useState(false);
  const[storageWarn,setStorageWarn]=useState(null);
  // E6: Trash already existed as a safety net, but a delete gave no in-the-
  // moment way back — you had to know to go find it in Settings. This surfaces
  // that safety net right where the delete happened, for a few seconds.
  const[undoToast,setUndoToast]=useState(null); // {id,label}
  // E15: replaces alert()'s role for every non-destructive message — errors,
  // success confirmations, validation blocks. confirm() is untouched; that
  // still gates anything genuinely consequential (admin changes, resets,
  // permanent wipes, historical rewrites). Single-slot, same pattern as the
  // undo toast above: a new toast replaces whatever's showing.
  const[toast,setToast]=useState(null); // {msg,kind:'success'|'error'|'info'}
  const toastTimerRef=useRef(null);
  const showToast=useCallback((msg,kind="info")=>{
    if(toastTimerRef.current)clearTimeout(toastTimerRef.current);
    setToast({msg,kind});
    const duration=kind==="error"?7000:4000; // errors get more reading time
    toastTimerRef.current=setTimeout(()=>setToast(null),duration);
  },[]);
  const undoTimerRef=useRef(null);
  const entriesRef=useRef(null);
  // Mirror of (live + tombstoned) entries as last rendered. Lets the Firebase
  // listener answer "do we hold local data?" synchronously, without a storage
  // read — required now that the durable mirror is async IndexedDB.
  const localAllRef=useRef([]);

  // ── Admin-gated signup state ─────────────────────────────────────────────
  const[accessState,setAccessState]=useState("checking"); // checking|approved|pending|denied
  const[isAdminUser,setIsAdminUser]=useState(false);
  const[pendingRequests,setPendingRequests]=useState({});
  const[adminsMap,setAdminsMap]=useState({});
  const[allowlistMap,setAllowlistMap]=useState({});
  const[approvedUsersMap,setApprovedUsersMap]=useState({});

  const T=theme==="system"?THEMES[sysDark()?"dark":"light"]:(THEMES[theme]||THEMES.dark);
  // E13: the theme-color meta tag was a static #0a1628 (dark) in the HTML —
  // a light-theme user's Android status bar never matched. This keeps it in
  // sync with whatever T actually resolves to (including System mode, which
  // itself already tracks the OS preference).
  useEffect(()=>{
    try{
      const meta=document.querySelector('meta[name="theme-color"]');
      if(meta)meta.setAttribute("content",T.bg);
    }catch(e){}
  },[T.bg]);

  // Keep the synchronous snapshot used by the entries listener's anti-wipe guard
  // in step with what's actually rendered.
  useEffect(()=>{localAllRef.current=[...entries,...deletedEntries];},[entries,deletedEntries]);

  // Surface storage failures (quota, IndexedDB errors) instead of swallowing them.
  useEffect(()=>{setStorageProblemHandler(p=>setStorageWarn(p));return()=>setStorageProblemHandler(null);},[]);

  // ── Auto-backup: once per WEEK on first open ──────────────────────────────
  // E9: was once per CALENDAR DAY, downloading both a CSV and a JSON every
  // time — 730 files a year in Downloads, pure noise for something meant as
  // a safety net, not a daily ritual. Now weekly, and JSON only: it's the
  // lossless format (includes tombstones), matching the "full backup"
  // download already offered elsewhere in Settings, so nothing about
  // recovery capability is lost by dropping the CSV half.
  useEffect(()=>{
    if(!dataLoaded||!user||!entries.length)return;
    try{
      const key=`jivanlog-lastBackup-${user.uid}`;
      const last=localStorage.getItem(key);
      if(last){
        const daysSince=(new Date(today()+"T00:00:00")-new Date(last+"T00:00:00"))/86400000;
        if(daysSince<7)return; // already backed up within the last week
      }
      const all=[...entries,...deletedEntries];
      try{const blob=new Blob([buildFullJSON(all)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=`jivanlog-autobackup-${today()}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1200);}catch(e){}
      localStorage.setItem(key,today());
    }catch(e){console.warn("Auto-backup failed:",e);}
  },[dataLoaded,user]);  // intentionally omit entries — run once when data first loads

  // On sign-in: hydrate from localStorage before Firebase data arrives
  useEffect(()=>{
    if(!user)return;
    const uid=user.uid;
    try{
      const cs=localStorage.getItem(`jivanlog-settingsCache-${uid}`);
      if(cs){const s=JSON.parse(cs);setSettings(s);}
    }catch(e){}
    let cancelled=false;
    (async()=>{
      try{
        // Hydrate from the FULL local mirror (all history incl. tombstones), so
        // offline boot shows everything and a write can never clobber unseen data.
        // Async since v4.74 (IndexedDB); the app already shows a loading state
        // until dataLoaded, so this doesn't add a visible delay.
        const mirror=(await mirrorGetAll(uid)).map(e=>({...e,date:normDate(e.date)}));
        if(cancelled)return;
        const live=mirror.filter(e=>!e.deleted);
        const dead=mirror.filter(e=>e.deleted);
        const queued=getOfflineQ(uid);
        const lIds=new Set(live.map(e=>e.id));
        const merged=[...live,...queued.filter(e=>!lIds.has(e.id)&&!e.deleted).map(e=>{const{_queuedAt,...clean}=e;return{...clean,date:normDate(clean.date)};})];
        setEntries(merged);
        setDeletedEntries(dead);
        setDataLoaded(true);
      }catch(e){console.warn("Mirror hydrate:",e);}
    })();
    setQueueSize(getOfflineQ(uid).length);
    return()=>{cancelled=true;};
  },[user]);

  // .info/connected — authoritative connectivity source of truth.
  // CAVEAT: this reflects the health of Firebase's own persistent socket, not
  // general internet access. That socket can go stale — most commonly right
  // after a network *handoff* (mobile data → home WiFi or vice versa) — and
  // the SDK doesn't always notice the old connection died, so this can read
  // "offline" indefinitely even though the device has a perfectly good
  // connection. A watchdog below forces a fresh reconnect if that happens.
  useEffect(()=>{
    if(!user)return;
    const ref=fbDb.ref('.info/connected');
    const handler=snap=>{const v=snap.val()===true;setIsOnline(v);isOnlineRef.current=v;};
    ref.on('value',handler);
    return()=>ref.off('value',handler);
  },[user]);

  // Watchdog: if the browser reports a network (navigator.onLine) but the
  // Firebase socket has not confirmed connected within ~8s, force-bounce the
  // connection. This is the standard fix for the JS SDK not re-establishing
  // its long-lived connection cleanly after a network interface change.
  useEffect(()=>{
    if(!user||isOnline)return;
    const t=setTimeout(()=>{
      if(navigator.onLine&&!isOnlineRef.current){
        try{fbDb.goOffline();fbDb.goOnline();}catch(e){}
      }
    },8000);
    return()=>clearTimeout(t);
  },[user,isOnline]);

  // Auth listener — N2: OPTIMISTIC BOOT.
  // Previously the app waited for fbAuth.onAuthStateChanged (or a 4s timeout)
  // before showing anything, and only fell back to a cached identity when
  // navigator.onLine was false. Two problems: (1) that made every login as
  // slow as the auth round-trip, even on a fine connection, because Firebase
  // Auth's token refresh can itself be slow — v4.70's own watchdog exists
  // because navigator.onLine already turned out not to reliably reflect
  // whether Firebase can actually be reached; the login path had the same
  // blind spot. (2) it meant a slow-but-fine connection could flash to a
  // "signed out" screen while waiting.
  //
  // Single, shared way to accept a confirmed Firebase user — whether that
  // confirmation comes from onAuthStateChanged's own callback or from the
  // catch-up check below. Before this, each path independently decided "this
  // counts as confirmed" with slightly different logic, which is exactly how
  // offlineAuth and isOnline drifted out of sync (the banner bug, the stuck
  // queue). One function, called from both places, closes that gap by
  // construction rather than by patching each divergence as it's found.
  const confirmUser=useCallback(u=>{
    setOfflineAuth(false);
    saveCachedAuthUser(u);
    setUser(u);
  },[]);

  useEffect(()=>{
    let resolved=false;
    const cached=getCachedAuthUser();
    if(cached){
      setUser({uid:cached.uid,displayName:cached.displayName,email:cached.email,photoURL:cached.photoURL,_offline:true});
      setOfflineAuth(true);
      setAuthState("in");
    }
    const unsub=fbAuth.onAuthStateChanged(u=>{
      resolved=true;
      if(u){
        confirmUser(u);
        setAuthState("in");
      }else{
        // A null callback while genuinely offline is exactly the ambiguous case:
        // it can mean "no session" OR "couldn't verify one without a network".
        // Only trust it as authoritative sign-out when we have a way to have
        // actually checked — i.e. we're online, or there was nothing cached to
        // begin with. Otherwise keep the optimistic cached session as-is rather
        // than bouncing a legitimately-signed-in offline user out.
        if(cached&&!navigator.onLine)return;
        clearCachedAuthUser();
        setOfflineAuth(false);setUser(null);setAuthState("out");setDataLoaded(false);setEntries([]);
      }
    },e=>{
      resolved=true;
      setAuthError(e.message);
      // Errored rather than resolved. If we already booted from cache, stay in —
      // there's a working session shown to the user and nothing to undo. If we
      // had nothing cached, there's genuinely nothing to show but sign-in.
      if(!cached)setAuthState("out");
    });
    // Only the no-cache path can hang indefinitely (waiting on a first-ever
    // sign-in check with no fallback to show). The cached path is already
    // showing the app, so it needs no timeout.
    const t=cached?null:setTimeout(()=>{if(!resolved)setAuthState(prev=>prev==="checking"?"out":prev);},4000);
    return()=>{unsub();if(t)clearTimeout(t);};
  },[confirmUser]);

  // isOnline confirms a genuinely live Firebase connection (.info/connected,
  // with its own v4.70 watchdog against staleness) — a stronger, more direct
  // signal than waiting on onAuthStateChanged's listener, which was observed
  // to sometimes lag well behind actual connectivity for reasons not fully
  // understood (possibly IndexedDB read latency in this PWA's persistence
  // layer). A live SOCKET is not the same as a live AUTH TOKEN, and
  // Firebase's security rules need the latter to accept a write. So rather
  // than only waiting passively for the listener, actively check
  // fbAuth.currentUser (synchronously available the moment Firebase Auth has
  // internally resolved, even if the listener callback itself hasn't
  // separately fired yet) once we have independent proof we're online — and
  // hand off to the SAME confirmUser used above, rather than a second,
  // separately-written acceptance path.
  useEffect(()=>{
    if(!isOnline||!offlineAuth)return;
    const cur=fbAuth.currentUser;
    if(cur)confirmUser(cur);
  },[isOnline,offlineAuth,confirmUser]);

  // ── Resolve access state ──────────────────────────────────────────────────
  // Superadmin bypasses entirely (hardcoded, never depends on a DB read).
  // Offline sessions bypass too — they're already using previously-cached
  // data and there's no network to check against anyway.
  // Everyone else: check approvedUsers → try allowlist auto-approve → else
  // register a pending request and wait.
  useEffect(()=>{
    if(!user)return;
    if(user._offline){setAccessState("approved");return;}
    if(isSuperAdmin(user.uid)){
      setAccessState("approved");setIsAdminUser(true);
      // Self-heal: make sure a friendly /admins entry exists for the Manage
      // Admins list. Best-effort, never blocks — safe under old or new rules.
      fbDb.ref(`admins/${user.uid}`).get().then(snap=>{
        if(!snap.exists())fbDb.ref(`admins/${user.uid}`).set({name:user.displayName||"",email:user.email||"",photoURL:user.photoURL||"",addedAt:firebase.database.ServerValue.TIMESTAMP}).catch(()=>{});
      }).catch(()=>{});
      return;
    }
    let cancelled=false;
    const uid=user.uid;
    const cacheKey=`jivanlog-approved-${uid}`;
    (async()=>{
      try{
        // R1b: these two reads must NOT share a failure. `admins/{uid}` is not
        // self-readable for a non-admin, so under Promise.all its permission-denied
        // rejected the whole check — the approval result was never inspected, the
        // allowlist branch below was unreachable, and approved users on a fresh
        // device got bounced to the waiting room with a duplicate pendingRequest.
        // allSettled lets each read fail on its own terms.
        const[approvedRes,adminRes]=await Promise.allSettled([
          fbDb.ref(`approvedUsers/${uid}/allowed`).get(),
          fbDb.ref(`admins/${uid}`).get(),
        ]);
        if(cancelled)return;
        // A denied admins read means "not an admin", not "check failed".
        setIsAdminUser(adminRes.status==="fulfilled"&&adminRes.value.exists());
        if(approvedRes.status==="rejected")throw approvedRes.reason;
        const approvedSnap=approvedRes.value;
        if(approvedSnap.exists()&&approvedSnap.val()===true){
          try{localStorage.setItem(cacheKey,"1");}catch(e){}
          setAccessState("approved");return;
        }
        // Not approved yet — try allowlist auto-approval (a rule-gated write;
        // fails silently with permission-denied if the email isn't listed).
        try{
          await fbDb.ref(`approvedUsers/${uid}`).set({allowed:true,name:user.displayName||"",email:user.email||"",photoURL:user.photoURL||"",approvedAt:firebase.database.ServerValue.TIMESTAMP,via:"allowlist"});
          if(cancelled)return;
          try{localStorage.setItem(cacheKey,"1");}catch(e){}
          setAccessState("approved");return;
        }catch(allowlistErr){/* not on allowlist — fall through to pending */}
        try{
          // A denied read here (rules without the self-read) must not prevent the
          // write — otherwise no access request is ever recorded for the admin.
          let alreadyRequested=false;
          try{alreadyRequested=(await fbDb.ref(`pendingRequests/${uid}`).get()).exists();}catch(readErr){}
          if(!alreadyRequested){
            await fbDb.ref(`pendingRequests/${uid}`).set({name:user.displayName||"",email:user.email||"",photoURL:user.photoURL||"",message:"",requestedAt:firebase.database.ServerValue.TIMESTAMP});
          }
        }catch(e){console.warn("pendingRequests write:",e);}
        if(!cancelled)setAccessState("pending");
      }catch(e){
        console.warn("Access check failed:",e);
        if(cancelled)return;
        // Don't strand a previously-approved user on a transient read error.
        try{if(localStorage.getItem(cacheKey)==="1"){setAccessState("approved");return;}}catch(er){}
        // Best-effort: still try to leave a pending request visible to the
        // admin, in case this failure was just the rules not being live yet.
        try{await fbDb.ref(`pendingRequests/${uid}`).set({name:user.displayName||"",email:user.email||"",photoURL:user.photoURL||"",message:"",requestedAt:firebase.database.ServerValue.TIMESTAMP});}catch(e2){}
        if(!cancelled)setAccessState("pending");
      }
    })();
    return()=>{cancelled=true;};
  },[user]);

  // While waiting, listen live so approval flips the screen instantly with no
  // refresh, and detect an explicit denial (admin removed the request without
  // approving it).
  useEffect(()=>{
    if(!user||user._offline||isSuperAdmin(user.uid))return;
    if(accessState!=="pending"&&accessState!=="denied")return;
    const uid=user.uid;
    const approvedRef=fbDb.ref(`approvedUsers/${uid}/allowed`);
    const pendingRef=fbDb.ref(`pendingRequests/${uid}`);
    let sawPending=accessState==="pending";
    const onApproved=snap=>{if(snap.val()===true){try{localStorage.setItem(`jivanlog-approved-${uid}`,"1");}catch(e){}setAccessState("approved");}};
    const onPending=snap=>{if(snap.exists())sawPending=true;else if(sawPending)setAccessState("denied");};
    approvedRef.on("value",onApproved);
    pendingRef.on("value",onPending);
    return()=>{approvedRef.off("value",onApproved);pendingRef.off("value",onPending);};
  },[user,accessState]);

  // Admin-only: live lists for the Access Requests / Manage Admins panels.
  useEffect(()=>{
    if(!user||user._offline||!isAdminUser)return;
    const pr=fbDb.ref("pendingRequests"),ad=fbDb.ref("admins"),al=fbDb.ref("allowlist"),au=fbDb.ref("approvedUsers");
    const hp=s=>setPendingRequests(s.val()||{}),ha=s=>setAdminsMap(s.val()||{}),hl=s=>setAllowlistMap(s.val()||{}),hu=s=>setApprovedUsersMap(s.val()||{});
    pr.on("value",hp);ad.on("value",ha);al.on("value",hl);au.on("value",hu);
    return()=>{pr.off("value",hp);ad.off("value",ha);al.off("value",hl);au.off("value",hu);};
  },[user,isAdminUser]);

  const sendPendingMessage=useCallback(async msg=>{
    if(!user)return;
    try{await fbDb.ref(`pendingRequests/${user.uid}/message`).set(msg);}catch(e){}
  },[user]);
  const requestAccessAgain=useCallback(async()=>{
    if(!user)return;
    try{
      await fbDb.ref(`pendingRequests/${user.uid}`).set({name:user.displayName||"",email:user.email||"",photoURL:user.photoURL||"",message:"",requestedAt:firebase.database.ServerValue.TIMESTAMP});
      setAccessState("pending");
    }catch(e){showToast("Couldn't send request: "+(e.message||e),"error");}
  },[user]);
  const approveRequest=useCallback(async(uid,profile)=>{
    try{
      await fbDb.ref(`approvedUsers/${uid}`).set({allowed:true,name:profile?.name||"",email:profile?.email||"",photoURL:profile?.photoURL||"",approvedAt:firebase.database.ServerValue.TIMESTAMP,via:"admin"});
      await fbDb.ref(`pendingRequests/${uid}`).remove();
    }catch(e){showToast("Approve failed: "+(e.message||e),"error");}
  },[]);
  const denyRequest=useCallback(async uid=>{
    if(!confirm("Deny this access request?\nThey can ask again later."))return;
    try{await fbDb.ref(`pendingRequests/${uid}`).remove();}catch(e){showToast("Deny failed: "+(e.message||e),"error");}
  },[]);
  const promoteToAdmin=useCallback(async(uid,profile)=>{
    if(!confirm(`Make ${profile?.name||profile?.email||uid} an admin?\nThey'll be able to approve new users and manage admins.`))return;
    try{await fbDb.ref(`admins/${uid}`).set({name:profile?.name||"",email:profile?.email||"",photoURL:profile?.photoURL||"",addedAt:firebase.database.ServerValue.TIMESTAMP,addedBy:user.uid});}catch(e){showToast("Failed: "+(e.message||e),"error");}
  },[user]);
  const demoteAdmin=useCallback(async uid=>{
    if(isSuperAdmin(uid)){showToast("The superadmin can't be removed.","error");return;}
    if(!confirm("Remove admin access for this user?"))return;
    try{await fbDb.ref(`admins/${uid}`).remove();}catch(e){showToast("Failed: "+(e.message||e),"error");}
  },[]);
  const addAllowlistEntry=useCallback(async email=>{
    const clean=(email||"").trim().toLowerCase();
    if(!clean||!clean.includes("@")){showToast("Enter a valid email address.","error");return;}
    try{await fbDb.ref(`allowlist/${emailKey(clean)}`).set({email:clean,addedAt:firebase.database.ServerValue.TIMESTAMP,addedBy:user.uid});}catch(e){showToast("Failed: "+(e.message||e),"error");}
  },[user]);
  const removeAllowlistEntry=useCallback(async key=>{
    if(!confirm("Remove this email from the auto-approve list?"))return;
    try{await fbDb.ref(`allowlist/${key}`).remove();}catch(e){showToast("Failed: "+(e.message||e),"error");}
  },[]);

  // Real-time entries listener — READ-ONLY.
  // It NEVER writes to Firebase and NEVER clears the offline queue. (The old
  // version cleared the queue when Firebase's optimistic echo made a pending
  // write "appear" synced — that was the lift-bug data-loss path.) The queue is
  // now owned solely by addEntry (push) and flushOfflineQueue (remove on a
  // CONFIRMED server write). This listener only reads, merges the queue for
  // display, and refreshes the durable local mirror.
  //
  // Extracted to a callable function rather than inline in the effect below:
  // this listener previously had NO recovery path if it got stuck, distinct
  // from every isOnline-based fix so far. isOnline reflects .info/connected,
  // a single trivial boolean — this listener carries the FULL entries node
  // (thousands of records for a long-running account). A degraded mobile
  // connection can deliver the tiny boolean fine while silently stalling
  // the much larger snapshot, so isOnline reporting "connected" is no
  // guarantee this specific listener is actually current. Making the attach
  // logic re-callable lets it be periodically and event-triggered refreshed
  // below, the same self-healing principle already applied to the queue.
  const attachEntriesListener=useCallback(()=>{
    if(!user||user._offline)return;
    const uid=user.uid;
    const ref=fbDb.ref(`users/${uid}/entries`);
    const handler=snap=>{
      const queued=getOfflineQ(uid);
      const raw=snap.val()?Object.values(snap.val()):[];
      const fromFb=raw.map(e=>({...e,date:normDate(e.date)}));
      // CONTENT decides, never a connection flag. Append-only means the server
      // can never legitimately shrink to empty. If the snapshot is empty (offline
      // cold cache, transient glitch) but we hold local data, keep the local data
      // and do NOT overwrite it. This is what prevents both the blank-screen bug
      // and any empty-overwrite.
      //
      // v4.74: this used to read the whole mirror out of localStorage on every
      // snapshot just to answer "do we have anything locally?". That answer is
      // already in memory — localAllRef holds live + tombstones as last rendered
      // — so the guard no longer needs a storage read at all, which also keeps
      // it synchronous now that the mirror is async IndexedDB.
      const localAll=localAllRef.current||[];
      let all;
      if(fromFb.length===0&&localAll.length>0){
        all=localAll; // preserve; do not touch durable copies
      }else{
        all=fromFb;
        // Upsert-only: never a wholesale rewrite, so tombstones and any
        // not-yet-synced local rows can't be clobbered by a server snapshot.
        mirrorPut(uid,fromFb);
        maybeDailyBackup(uid,fromFb);
      }
      const live=all.filter(e=>!e.deleted);
      const dead=all.filter(e=>e.deleted);
      const liveIds=new Set(live.map(e=>e.id));
      const pendingLive=queued.filter(e=>!liveIds.has(e.id)&&!e.deleted).map(e=>{const{_queuedAt,...clean}=e;return{...clean,date:normDate(clean.date)};});
      setEntries([...live,...pendingLive]);
      setDeletedEntries(dead);
      setDataLoaded(true);
    };
    ref.on("value",handler);
    entriesRef.current=()=>ref.off("value",handler);
  },[user]);

  useEffect(()=>{
    if(!user||user._offline){if(entriesRef.current){entriesRef.current();entriesRef.current=null;}return;}
    attachEntriesListener();
    return()=>{if(entriesRef.current){entriesRef.current();entriesRef.current=null;}};
  },[user,attachEntriesListener]);

  // Periodically detach and re-attach the entries listener — the same
  // recovery this listener never had before. Deliberately a much longer
  // interval than the queue's 20s poll: re-attaching re-downloads the FULL
  // entries node, which is expensive to do often for an account with
  // thousands of records. 3 minutes balances that cost against how long
  // stale, silently-incomplete data should be tolerated in a health app —
  // also re-attaches immediately on the same online/foreground events
  // already used for the stale-socket bounce, since a network handoff is
  // exactly when a large listener is most likely to have gotten stuck.
  useEffect(()=>{
    if(!user||user._offline)return;
    const refresh=()=>{
      if(entriesRef.current){entriesRef.current();entriesRef.current=null;}
      attachEntriesListener();
    };
    const id=setInterval(refresh,180000);
    const onOnline=()=>{if(navigator.onLine)refresh();};
    const onVisible=()=>{if(document.visibilityState==="visible")refresh();};
    window.addEventListener("online",onOnline);
    document.addEventListener("visibilitychange",onVisible);
    return()=>{clearInterval(id);window.removeEventListener("online",onOnline);document.removeEventListener("visibilitychange",onVisible);};
  },[user,attachEntriesListener]);

  // Load settings/templates once on sign-in
  useEffect(()=>{
    if(!user)return;
    (async()=>{
      try{
        const[sett,defs,th,dr,model]=await Promise.all([
          fbDb.ref(`users/${user.uid}/settings`).get(),
          fbDb.ref(`users/${user.uid}/defaults`).get(),
          fbDb.ref(`users/${user.uid}/theme`).get(),
          fbDb.ref(`users/${user.uid}/dayRolloverMin`).get(),
          fbDb.ref(`users/${user.uid}/${CONFIG_MODEL_KEY}`).get(),
        ]);
        // Helper: normalise a settings/defaults object
          const norm=o=>{
            if(!o)return o;
            // Decode empty-list/empty-map sentinels FIRST, before any of the
            // per-item logic below runs — otherwise the sentinel marker
            // string would get processed as if it were a real item name
            // (e.g. a food literally called "__empty__").
            ["foodCategories","liquidTypes","exerciseTypes","medicalPresets","medications"].forEach(k=>{
              if(o[k]!==undefined)o[k]=decodeEmptyList(o[k]);
            });
            ["liquidNotes","liquidSubTypes"].forEach(k=>{
              if(o[k]!==undefined)o[k]=decodeEmptyMap(o[k]);
            });
            // N1a: sub-type lists may be strings or {name,note}, and Firebase
            // can hand an array back as an object ({0:..,1:..}) when keys look
            // numeric — coerce both shapes here so every downstream reader gets
            // a real array. Entries with no note stay bare strings.
            const normSubs=v=>{
              let a=v;
              if(a&&!Array.isArray(a))a=Object.values(a);
              return (a||[]).map(x=>{
                if(typeof x==="string")return x;
                const n=(x&&x.name)||"";const nt=(x&&x.note)||"";
                return nt?{name:n,note:nt}:n;
              }).filter(x=>typeof x==="string"?x:x.name);
            };
            if(o.foodCategories)
              o.foodCategories=o.foodCategories.map(f=>typeof f==="string"?{name:f,note:"",subTypes:[],icon:""}:{note:"",icon:"",...f,subTypes:normSubs(f.subTypes)});
            if(o.liquidSubTypes){
              const ls={};Object.keys(o.liquidSubTypes).forEach(k=>{ls[k]=normSubs(o.liquidSubTypes[k]);});
              o.liquidSubTypes=ls;
            }
            if(o.exerciseTypes)
              o.exerciseTypes=o.exerciseTypes.map(e=>{
                if(typeof e==="string")return{name:e,metrics:["time"],note:"",subTypes:[],icon:""};
                // Firebase may return array as object {0:"time",1:"distance"} — convert back
                let m=e.metrics;
                if(m&&!Array.isArray(m))m=Object.values(m);
                if(!m||!m.length){
                  // Fall back to FD metrics for known exercise types
                  const fd=(FD.exerciseTypes||[]).find(f=>f.name===e.name);
                  m=fd?fd.metrics:["time"];
                }
                return{...e,metrics:m,note:e.note||"",icon:e.icon||"",subTypes:normSubs(e.subTypes)};
              });
            if(o.medicalPresets)
              o.medicalPresets=o.medicalPresets.map(p=>typeof p==="string"?{name:p,unit:"",icon:""}:{icon:"",...p});
            return o;
          };
          const s=sett.exists()?norm(sett.val()):null;
          const d=defs.exists()?norm(defs.val()):null;
          // ── C1 (v4.77): collapse the two-node draft/active config model ──
          // Until now `defaults` was the node the Settings UI edited and
          // `settings` was what entry forms read, with `Apply ▶` copying one to
          // the other. But this loader merged `defaults` OVER `settings` for
          // every list field on every sign-in, so edits went live on the next
          // app open whether or not Apply was pressed — the two-stage model
          // delivered nothing while costing an entire layer of UI.
          //
          // `settings` is now the single source of truth. The migration below
          // matters for correctness: the user's EFFECTIVE config today is the
          // merge, not `settings` alone, so seeding `settings` from `settings`
          // would silently revert live config to a stale copy. We therefore
          // compute the legacy merge exactly as before and persist THAT, which
          // guarantees zero visible change. `defaults` is left untouched in
          // Firebase rather than deleted — it costs nothing and keeps the
          // migration reversible.
          const legacyMerge=(sv,dv)=>({...sv,
            foodCategories:dv.foodCategories||sv.foodCategories,
            liquidTypes:dv.liquidTypes||sv.liquidTypes,
            liquidNotes:{...( sv.liquidNotes||{}), ...(dv.liquidNotes||{})},
            liquidSubTypes:{...(sv.liquidSubTypes||{}),...(dv.liquidSubTypes||{})},
            liquidIcons:{...(sv.liquidIcons||{}),...(dv.liquidIcons||{})},
            exerciseTypes:dv.exerciseTypes||sv.exerciseTypes,
            medicalPresets:dv.medicalPresets||sv.medicalPresets,
            medications:dv.medications||sv.medications,
            medicationIcons:{...(sv.medicationIcons||{}),...(dv.medicationIcons||{})},
          });
          const alreadyMigrated=model.exists()&&model.val()===CONFIG_MODEL_V2;
          let effective=null;
          if(alreadyMigrated){
            effective=s||deepClone(FD);
          }else{
            // Reproduce the pre-v4.77 effective config bit-for-bit.
            if(s)      effective=d?legacyMerge(s,d):s;
            else if(d) effective=deepClone(d);
            else       effective=deepClone(FD);
            // Persist the migration. If this write fails (offline, denied), we
            // simply migrate again next load — the computation is idempotent.
            try{
              await Promise.all([
                fbDb.ref(`users/${user.uid}/settings`).set(effective),
                fbDb.ref(`users/${user.uid}/${CONFIG_MODEL_KEY}`).set(CONFIG_MODEL_V2),
              ]);
            }catch(e){console.warn("Config model migration deferred:",e);}
          }
          setSettings(effective);
          const settingsToCache=effective;
          // Cache for offline boot
          const uid=user.uid;
          if(settingsToCache)try{localStorage.setItem(`jivanlog-settingsCache-${uid}`,JSON.stringify(settingsToCache));}catch(e){}
          if(th.exists())setTheme(th.val());
          if(dr.exists()){setDayRolloverMinR(dr.val());setDayRolloverCache(dr.val());}
      }catch(e){console.error("Settings load:",e);}
    })();
  },[user]);

  // Daily safety snapshot — small copy of TODAY's entries, overwritten each day.
  // Local copy is instant; backend copy lives in a SEPARATE Firebase node
  // (users/{uid}/dailyBackup) so a bad write to /entries can never destroy it.
  // Runs at most once per calendar day (gated by a localStorage date flag).
  const maybeDailyBackup=useCallback((uid,fullEntries)=>{
    try{
      const t=today();
      // Always keep the local snapshot fresh.
      saveDailyBackupLocal(uid,fullEntries);
      // Backend snapshot once per day — store the FULL set (incl. tombstones) in
      // a separate node, so even total loss of /entries is recoverable from here.
      const flagKey=`jivanlog-lastRemoteBackup-${uid}`;
      if(localStorage.getItem(flagKey)===t)return;
      if(!fullEntries.length)return; // never overwrite a good backup with nothing
      fbDb.ref(`users/${uid}/dailyBackup`).set({date:t,savedAt:new Date().toISOString(),count:fullEntries.length,entries:fullEntries})
        .then(()=>{try{localStorage.setItem(flagKey,t);}catch(e){}})
        .catch(e=>console.warn("Backend daily backup deferred:",e));
    }catch(e){console.warn("maybeDailyBackup:",e);}
  },[]);

  // Restore today's entries from the daily backup (backend first, then local).
  // Additive .update() only — never deletes anything currently in /entries.
  const restoreFromBackup=useCallback(async()=>{
    if(!user||user._offline){showToast("Restore needs an internet connection. Please reconnect and try again.","error");return;}
    const uid=user.uid;
    try{
      let snap=await fbDb.ref(`users/${uid}/dailyBackup`).get();
      let bk=snap.exists()?snap.val():null;
      const local=getDailyBackupLocal(uid);
      // Prefer whichever snapshot has more entries.
      if(local&&(!bk||(local.entries||[]).length>(bk.entries||[]).length))bk=local;
      const list=bk&&bk.entries?bk.entries:[];
      if(!list.length){showToast("No backup entries found to restore.","error");return;}
      if(!confirm(`Restore ${list.length} entr${list.length===1?"y":"ies"} from the ${bk.date} backup?\n\nThis re-adds any missing entries. It does not delete anything you already have.`))return;
      const updates={};
      list.forEach(e=>{const k=String(e.id||genId()).replace(/[\s.#$\[\]/]/g,"_");updates[k]={...e,id:k};});
      await fbDb.ref(`users/${uid}/entries`).update(updates);
      showToast("Restore complete. Your entries have been re-added.","success");
    }catch(e){console.warn("Restore failed:",e);showToast("Restore failed: "+(e.message||e),"error");}
  },[user]);

  // Download a lossless full backup (all entries incl. tombstones) as JSON.
  const exportFullBackup=useCallback(()=>{
    const all=[...entries,...deletedEntries];
    const blob=new Blob([buildFullJSON(all)],{type:"application/json"});
    const url=URL.createObjectURL(blob);const a=document.createElement("a");
    a.href=url;a.download=`jivanlog-full-backup-${today()}.json`;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1000);
  },[entries,deletedEntries]);

  // Restore from a full JSON backup — additive .update() preserving ALL fields
  // (including deleted/deletedAt). Never removes anything.
  const importFullBackup=useCallback(async(jsonText)=>{
    if(!user||user._offline){showToast("Importing a backup needs an internet connection.","error");return;}
    try{
      const data=JSON.parse(jsonText);
      const list=Array.isArray(data)?data:(data.entries||[]);
      if(!list.length){showToast("No entries found in that backup file.","error");return;}
      if(!confirm(`Import ${list.length} entries from this backup?\n\nThis re-adds/updates entries by ID. It never deletes anything you already have.`))return;
      const updates={};
      list.forEach(e=>{const k=String(e.id||genId()).replace(/[\s.#$\[\]/]/g,"_");updates[k]={...e,id:k,date:normDate(e.date)};});
      await fbDb.ref(`users/${user.uid}/entries`).update(updates);
      showToast(`✓ Imported ${list.length} entries.`,"success");
    }catch(e){console.warn("JSON import failed:",e);showToast("Import failed: "+(e.message||e),"error");}
  },[user]);

  // Flush pending offline queue to Firebase (called on reconnect or "Sync Now").
  // A queued entry is removed ONLY after its write is CONFIRMED by the server
  // (the .update() promise resolves only on server ack while online). Entries
  // added during the flush are preserved (we remove by exact id, not clear-all).
  const flushOfflineQueue=useCallback(async()=>{
    if(!user||user._offline)return"not-confirmed"; // offline session can't write to Firebase
    if(!isOnlineRef.current)return"not-connected"; // don't attempt while disconnected
    const uid=user.uid;
    const queued=getOfflineQ(uid);
    if(!queued.length)return null;
    setSyncStatus("saving");
    try{
      const updates={};const ids=[];
      queued.forEach(e=>{const k=e.id.replace(/[\s.#$\[\]/]/g,"_");const{_queuedAt,...clean}=e;updates[k]={...clean,id:k};ids.push(e.id);});
      // Race the write against a timeout so a mid-flush disconnect can't hang it.
      await Promise.race([
        fbDb.ref(`users/${uid}/entries`).update(updates),
        new Promise((_,rej)=>setTimeout(()=>rej(new Error("flush-timeout")),12000))
      ]);
      // Confirmed by server — remove exactly these ids; keep anything added since.
      const left=removeFromQueue(uid,ids);setQueueSize(left.length);
      setSyncStatus("synced");setTimeout(()=>setSyncStatus("idle"),1500);
      return null;
    }catch(e){
      console.warn("Flush deferred, queue intact:",e&&e.message||e);setSyncStatus("idle");
      return"error:"+(e&&e.message||String(e));
    }
  },[user]);

  // N: this used to be THREE independent triggers all responsible for the
  // same job (flushing the offline queue) — isOnline transitioning, browser
  // online/visibility events, and this poll. Three overlapping code paths
  // for one question turned out to be exactly where the bugs kept showing
  // up (the queue staying stuck for 7+ hours on a stable connection, since
  // none of the event-driven ones ever re-fired). This poll is now the ONLY
  // flush trigger — simpler, and given what's actually broken so far, more
  // reliable than the event-driven approach it replaced. Trade-off, stated
  // plainly: recovery is slower in the best case (up to 20s instead of
  // near-instant) in exchange for one code path instead of three. It's a
  // no-op whenever the queue is empty, which is nearly always, so this
  // costs nothing the rest of the time.
  //
  // Extended: a flush attempt is gated on isOnlineRef, but nothing was ever
  // PERIODICALLY correcting that signal if it got stuck false — only the
  // browser's online/visibilitychange events could trigger the stale-socket
  // bounce below, and a session that never backgrounds or visibly drops its
  // network interface might never fire either one. A queue that stays
  // non-empty while isOnlineRef reports false is now itself the signal to
  // bounce the connection, on the same timer, rather than waiting on a
  // browser event that may never come.
  // Extended again: everything above assumes the DATABASE socket
  // (isOnlineRef) is the only thing that can get stuck. But flushOfflineQueue
  // ALSO bails out silently, before ever checking connectivity, if
  // user._offline is still true — meaning Firebase Auth's own session never
  // separately confirmed, even if the database socket is perfectly fine.
  // That promotion normally happens in the standalone catch-up effect above,
  // but it's a REACTION to isOnline/offlineAuth changing — if those specific
  // transitions don't fire reliably (exactly the class of issue this
  // session has repeatedly found), nothing else ever re-checks it. This is
  // very likely what a queue stuck for 26+ minutes on live connectivity
  // actually is, given neither the retry nor the bounce touches this path
  // at all. Re-checking fbAuth.currentUser on the same timer closes it.
  useEffect(()=>{
    if(!user)return;
    const id=setInterval(()=>{
      if(user._offline){
        const cur=fbAuth.currentUser;
        if(cur)confirmUser(cur);
      }
      if(queueSize>0){
        if(isOnlineRef.current)flushOfflineQueue();
        else{try{fbDb.goOffline();fbDb.goOnline();}catch(e){}}
      }
    },20000);
    return()=>clearInterval(id);
  },[user,queueSize,flushOfflineQueue,confirmUser]);

  // The browser's network-change events (online, and app resuming to
  // foreground) fire independently of Firebase's own socket state and often
  // catch a network handoff before .info/connected does. This still
  // force-bounces the Firebase connection when needed — a stale socket from
  // before a handoff won't self-heal just because the browser says we're
  // online again — but no longer ALSO calls flushOfflineQueue directly; the
  // poll above picks that up within 20s once the bounce (if any) resolves
  // isOnlineRef, which is simpler than duplicating the flush call here too.
  useEffect(()=>{
    const nudge=()=>{
      if(!navigator.onLine)return;
      if(!isOnlineRef.current){try{fbDb.goOffline();fbDb.goOnline();}catch(e){}}
    };
    const onVisible=()=>{if(document.visibilityState==="visible")nudge();};
    window.addEventListener("online",nudge);
    document.addEventListener("visibilitychange",onVisible);
    return()=>{window.removeEventListener("online",nudge);document.removeEventListener("visibilitychange",onVisible);};
  },[]);

  const persistKey=useCallback(async(key,val)=>{
    if(!user)return;
    try{await dbSet(user.uid,key,val);}catch(e){console.error("Persist:",key,e);}
  },[user]);

  // Write only the new/changed entries using .update() — more reliable for large imports
  const persistImport=useCallback(async(newEntries)=>{
    if(!user||!newEntries.length)return;
    try{
      const updates={};
      // Sanitize IDs — Firebase keys cannot contain . # $ [ ] /
      newEntries.forEach(e=>{
        const safeId=e.id.replace(/[.#$\[\]/]/g,"_");
        updates[safeId]={...e,id:safeId};
      });
      // .update() writes only these entries, never wipes others. .set() on the
      // full /entries collection caused the original data-loss incident this
      // whole per-entry-write discipline exists to prevent — the write
      // promise got killed mid-flight (a Chrome extension intercepting the
      // service worker message channel) and took every other entry with it.
      await fbDb.ref(`users/${user.uid}/entries`).update(updates);
    }catch(e){console.error("persistImport error:",e);throw e;}
  },[user]);
  const saveSettings =useCallback(n=>{setSettings(n);persistKey("settings",n);},[persistKey]);
  const saveTheme    =useCallback(m=>{setTheme(m);   persistKey("theme",m);},[persistKey]);
  const saveDayRollover=useCallback(min=>{setDayRolloverMinR(min);setDayRolloverCache(min);persistKey("dayRolloverMin",min);},[persistKey]);

  const addEntry=useCallback(entry=>{
    const newEntry={...entry,id:genId(),timestamp:timestampForLogicalDate(today(),entryTime).toISOString(),date:today()};
    const next=[...entries,newEntry];
    setEntries(next);
    if(user){
      const uid=user.uid;
      // 1. Write durable local copies FIRST — survive regardless of network
      mirrorPut(uid,[newEntry]);
      saveTodayCache(uid,next);
      saveDailyBackupLocal(uid,next);
      // 2. Push to offline queue — the authoritative pending-write store
      const q=queueUpsert(uid,newEntry);setQueueSize(q.length);
      // 3. If online, flush queue via .update() (safe, additive, not .set())
      //    flushOfflineQueue is a no-op if offline — queue persists for later
      if(isOnlineRef.current)flushOfflineQueue();
    }
  },[entries,flushOfflineQueue,entryTime,user]);

  const addEntryDirect=useCallback(entry=>{
    const next=[...entries,entry];
    setEntries(next);
    if(user){
      const uid=user.uid;
      mirrorPut(uid,[entry]);saveTodayCache(uid,next);saveDailyBackupLocal(uid,next);
      const q=queueUpsert(uid,entry);setQueueSize(q.length);
      if(isOnlineRef.current)flushOfflineQueue();
    }
  },[entries,flushOfflineQueue,user]);

  const updateEntry=useCallback((id,data)=>{
    const next=entries.map(e=>e.id===id?{...e,...data}:e);
    const changed=next.find(e=>e.id===id);
    setEntries(next);
    if(user){
      const uid=user.uid;
      mirrorPut(uid,changed?[changed]:[]);saveTodayCache(uid,next);saveDailyBackupLocal(uid,next);
      if(user._offline){
        // Offline session: queue the edited entry so it flushes on reconnect.
        const q=queueUpsert(uid,changed);setQueueSize(q.length);
      }else if(isOnlineRef.current){
        const k=id.replace(/[\s.#$\[\]/]/g,"_");
        fbDb.ref(`users/${uid}/entries/${k}`).update({...changed,id:k}).catch(e=>console.warn("updateEntry remote:",e));
      }else{
        const q=queueUpsert(uid,changed);setQueueSize(q.length);
      }
    }
  },[entries,user]);

  // SOFT DELETE — never hard-deletes. Writes a tombstone {deleted,deletedAt}.
  // The entry stays in /entries (append-only) and in the mirror; it's just
  // hidden from live views and moved to Trash, fully restorable.
  const deleteEntry=useCallback(id=>{
    const target=entries.find(e=>e.id===id);
    const next=entries.filter(e=>e.id!==id);
    setEntries(next);
    // E6: show the undo toast regardless of whether the Firebase write below
    // succeeds — the tombstone is already applied locally and in the mirror,
    // so Undo (restoreEntry) works the same way irrespective of connectivity.
    if(undoTimerRef.current)clearTimeout(undoTimerRef.current);
    setUndoToast({id,label:entryShortLabel(target)});
    undoTimerRef.current=setTimeout(()=>{setUndoToast(cur=>cur&&cur.id===id?null:cur);undoTimerRef.current=null;},5000);
    if(!user)return;
    const uid=user.uid;
    const tomb={...(target||{id}),deleted:true,deletedAt:new Date().toISOString()};
    setDeletedEntries(prev=>[...prev.filter(e=>e.id!==id),tomb]);
    // Mirror keeps EVERYTHING (live + tombstones) so nothing is ever lost locally.
    mirrorPut(uid,[tomb]);
    saveTodayCache(uid,next);saveDailyBackupLocal(uid,next);
    const k=id.replace(/[\s.#$\[\]/]/g,"_");
    if(!user._offline){
      // Single-key .update() setting the tombstone — never .remove(), never collection-level.
      fbDb.ref(`users/${uid}/entries/${k}`).update({deleted:true,deletedAt:tomb.deletedAt}).catch(e=>console.warn("deleteEntry tombstone:",e));
    }else{
      // Offline: queue the tombstone write so it syncs on reconnect.
      const q=queueUpsert(uid,tomb);setQueueSize(q.length);
    }
  },[entries,user]);

  // Restore a tombstoned entry from Trash.
  const restoreEntry=useCallback(id=>{
    const target=deletedEntries.find(e=>e.id===id);
    if(!target||!user)return;
    const uid=user.uid;
    const revived={...target,deleted:false,restoredAt:new Date().toISOString()};
    delete revived.deletedAt;
    setDeletedEntries(prev=>prev.filter(e=>e.id!==id));
    setEntries(prev=>[...prev.filter(e=>e.id!==id),revived]);
    mirrorPut(uid,[revived]);
    const k=id.replace(/[\s.#$\[\]/]/g,"_");
    if(!user._offline){
      fbDb.ref(`users/${uid}/entries/${k}`).update({deleted:false,deletedAt:null,restoredAt:revived.restoredAt}).catch(e=>console.warn("restoreEntry:",e));
    }else{
      const q=queueUpsert(uid,revived);setQueueSize(q.length);
    }
  },[deletedEntries,user]);

  // Move ALL live entries to Trash via per-entry tombstone .update() (batched
  // multi-path update — additive only, never a node remove). Fully reversible.
  const tombstoneAll=useCallback(()=>{
    if(!user)return;
    const uid=user.uid;
    const now=new Date().toISOString();
    const live=entries.slice();
    if(!live.length)return;
    const tombs=live.map(e=>({...e,deleted:true,deletedAt:now}));
    setEntries([]);
    setDeletedEntries(prev=>{const ex=new Set(tombs.map(t=>t.id));return[...prev.filter(e=>!ex.has(e.id)),...tombs];});
    // Mirror keeps everything (now all tombstoned + any previously-deleted).
    mirrorPut(uid,tombs);
    saveTodayCache(uid,[]);saveDailyBackupLocal(uid,[]);
    if(!user._offline){
      const updates={};
      tombs.forEach(t=>{const k=t.id.replace(/[\s.#$\[\]/]/g,"_");updates[k]={deleted:true,deletedAt:now};});
      fbDb.ref(`users/${uid}/entries`).update(updates).catch(e=>console.warn("tombstoneAll:",e));
    }else{
      let q=getOfflineQ(uid);tombs.forEach(t=>{q=queueUpsert(uid,t);});setQueueSize(q.length);
    }
  },[entries,user]);

  const onClearAll=useCallback(async()=>{
    downloadCSV(buildAllCSV([...entries,...deletedEntries]),`jivanlog-backup-full-${today()}.csv`);
    // Entries → Trash (reversible). Config is reset (factory-restorable).
    tombstoneAll();
    if(user){try{
      const emptyCfg={foodCategories:[],liquidTypes:[],liquidNotes:{},liquidSubTypes:{},exerciseTypes:[],medicalPresets:[],medications:[]};
      await Promise.all([dbSet(user.uid,"settings",encodeSettingsForFirebase(emptyCfg)),dbSet(user.uid,CONFIG_MODEL_KEY,CONFIG_MODEL_V2),dbSet(user.uid,"theme","system")]);
      const empty={foodCategories:[],liquidTypes:[],liquidNotes:{},liquidSubTypes:{},exerciseTypes:[],medicalPresets:[],medications:[]};
      setSettings({...empty});setTheme("system");setDayRolloverMinR(90);setDayRolloverCache(90);
    }catch(e){console.error(e);}}
  },[entries,deletedEntries,user,tombstoneAll]);

  const onClearEntries=useCallback(async()=>{
    // Move all live entries to Trash (reversible) — never a node remove.
    tombstoneAll();
  },[entries,user,tombstoneAll]);

  const onClearConfig=useCallback(async section=>{
    const emptyMap={
      food:{foodCategories:[]},
      drinks:{liquidTypes:[],liquidNotes:{},liquidSubTypes:{}},
      exercise:{exerciseTypes:[]},
      medical:{medicalPresets:[]},
      meds:{medications:[]},
    };
    const patch=emptyMap[section]||{};
    const newSet={...settings,...patch};
    setSettings(newSet); // real empty values in memory — correct immediate UI
    if(user){try{
      // Encode ONLY for the Firebase write — see encodeSettingsForFirebase.
      // Without this, .set() silently drops any now-empty field entirely,
      // and the next load falls back to factory defaults instead of
      // staying cleared.
      await Promise.all([dbSet(user.uid,"settings",encodeSettingsForFirebase(newSet)),dbSet(user.uid,CONFIG_MODEL_KEY,CONFIG_MODEL_V2)]);
    }catch(e){}}
  },[settings,user]);

  // ── N6: rename a config item and cascade it across all history ────────────
  // Writes are chunked multi-path `.update()` calls scoped to individual entry
  // fields (`{entryId}/{field}`), so no other field of any entry is touched and
  // the entries node is never `.set()`. Tombstoned entries are included too —
  // otherwise restoring one later would resurrect the old name.
  const applyEntryPatches=useCallback(async(patches)=>{
    if(!user||!patches.length)return 0;
    const uid=user.uid;
    const CHUNK=400;
    for(let i=0;i<patches.length;i+=CHUNK){
      const slice=patches.slice(i,i+CHUNK);
      const updates={};
      slice.forEach(p=>{
        const key=String(p.id).replace(/[\s.#$\[\]/]/g,"_");
        updates[`${key}/${p.field}`]=p.to;
      });
      await fbDb.ref(`users/${uid}/entries`).update(updates);
    }
    // Mirror + local state, so the change is visible immediately and survives
    // a reload even before the listener echoes it back.
    const byId=new Map(patches.map(p=>[p.id,p]));
    const applyLocal=list=>list.map(e=>byId.has(e.id)?{...e,[byId.get(e.id).field]:byId.get(e.id).to}:e);
    const nextLive=applyLocal(entries), nextDead=applyLocal(deletedEntries);
    setEntries(nextLive);setDeletedEntries(nextDead);
    mirrorPut(uid,[...nextLive,...nextDead].filter(e=>byId.has(e.id)));
    // Anything still queued offline must be patched too, or the flush would
    // write the stale name back over the rename.
    const q=getOfflineQ(uid);
    if(q.length){
      const nq=q.map(e=>byId.has(e.id)?{...e,[byId.get(e.id).field]:byId.get(e.id).to}:e);
      saveOfflineQ(uid,nq);
    }
    return patches.length;
  },[user,entries,deletedEntries]);

  const renameConfigItem=useCallback(async(kind,parent,oldName,newName)=>{
    const nn=(newName||"").trim();
    if(!nn||nn===oldName)return;
    if(!isOnline){
      showToast("Renaming needs a connection.\n\nIt rewrites past entries, which must not go through the offline queue. Try again once you're back online.","error");
      return;
    }
    const all=[...entries,...deletedEntries];
    const hits=all.filter(e=>renameMatches(e,kind,parent,oldName));
    const ok=confirm(
      `Rename "${oldName}" to "${nn}"?\n\n`+
      (hits.length
        ? `This also updates ${hits.length} past ${hits.length===1?"entry":"entries"} so your history, reports and trends stay consistent.\n\n`
        : `No past entries use this name.\n\n`)+
      `A backup will be downloaded first.`);
    if(!ok)return;
    try{
      exportFullBackup();                                    // safety net before any bulk write
      const patches=hits.map(e=>({id:e.id,field:RENAME_SPECS[kind].field,to:nn}));
      await applyEntryPatches(patches);
      saveSettings(renameInConfig(settings,kind,parent,oldName,nn));
      showToast(`Renamed to "${nn}".${hits.length?`\n${hits.length} past ${hits.length===1?"entry":"entries"} updated.`:""}`,"success");
    }catch(err){
      console.error("Rename failed:",err);
      showToast("Rename failed: "+(err&&err.message||err)+"\n\nNothing was left half-done in your config — re-check the list and try again.","error");
    }
  },[isOnline,entries,deletedEntries,settings,saveSettings,applyEntryPatches,exportFullBackup]);

  const repairEmojiNames=useCallback(async()=>{
    if(!isOnline){showToast("Repair needs a connection — it rewrites past entries.","error");return;}
    const plan=findEmojiRepairs([...entries,...deletedEntries],settings);
    if(!plan.length){showToast("Nothing to repair — no entries have an emoji stuck in a stored name.","info");return;}
    const sample=[...new Set(plan.map(p=>`${p.from}  →  ${p.to}`))].slice(0,8);
    if(!confirm(
      `Repair ${plan.length} ${plan.length===1?"entry":"entries"}?\n\n`+
      `These were saved with the icon accidentally stored as part of the name, so they don't match your config and are missing from Reports and Trends.\n\n`+
      sample.join("\n")+(new Set(plan.map(p=>p.from)).size>8?"\n…":"")+
      `\n\nA backup will be downloaded first.`))return;
    try{
      exportFullBackup();
      await applyEntryPatches(plan);
      showToast(`Repaired ${plan.length} ${plan.length===1?"entry":"entries"}.\nThey'll now appear in Reports and Trends.`,"success");
    }catch(err){
      console.error("Repair failed:",err);
      showToast("Repair failed: "+(err&&err.message||err),"error");
    }
  },[isOnline,entries,deletedEntries,settings,applyEntryPatches,exportFullBackup]);

  const onImportConfig=useCallback(async cfg=>{
    const newSet={...settings,...cfg};
    setSettings(newSet);
    if(user){try{
      await Promise.all([dbSet(user.uid,"settings",encodeSettingsForFirebase(newSet)),dbSet(user.uid,CONFIG_MODEL_KEY,CONFIG_MODEL_V2)]);
    }catch(e){}}
    showToast("✓ Config imported successfully.","success");
  },[settings,user]);

  const handleImport=useCallback(async csvText=>{
    try{
      const imported=parseAndMergeCSV(csvText,entries);
      if(!imported.length){showToast("No new entries found — all IDs already exist.","info");return;}
      if(!confirm(`Import ${imported.length} new entries?\nDuplicates are skipped.\nPress OK to merge.`))return;
      // Merge imported into existing, new wins over old with same ID
      const existMap=Object.fromEntries(entries.map(e=>[e.id,e]));
      imported.forEach(e=>{existMap[e.id]=e;});
      const merged=Object.values(existMap);
      // Update React state immediately so UI reflects new data
      setEntries(merged);
      if(user){mirrorPut(user.uid,imported);saveTodayCache(user.uid,merged);}
      // Write ONLY the new entries to Firebase using .update() (faster, more reliable)
      await persistImport(imported);
      showToast(`✓ Imported ${imported.length} entries.\nTotal in database: ${merged.length}\nOpen 📋 Manage — use ◀▶ buttons to browse past dates.`,"success");
    }catch(err){showToast("Import failed: "+err.message+"\n\nPlease try again.","error");console.error("Import error:",err);}
  },[entries,user,persistImport]);

  const signOut=async()=>{
    if(!confirm("Sign out of JivanLog?\nYour data is saved to Firebase."))return;
    clearCachedAuthUser();
    setOfflineAuth(false);
    await fbAuth.signOut();setEntries([]);setDataLoaded(false);setLocked(false);
  };

  // S7: the thorough alternative — see wipeLocalDeviceData for exactly what
  // gets removed and why rolloverMin is deliberately left alone. The queue
  // check matters: entries waiting in the offline queue haven't reached
  // Firebase yet, so wiping the device before they sync would lose them
  // permanently, not just locally.
  const signOutAndWipe=async()=>{
    const uid=user&&user.uid;
    if(!uid)return;
    if(queueSize>0){
      if(!confirm(`⚠️ ${queueSize} ${queueSize===1?"entry hasn't":"entries haven't"} synced to Firebase yet.\n\nWiping this device now will lose ${queueSize===1?"it":"them"} PERMANENTLY — they only exist locally until they sync.\n\nWipe anyway?`))return;
    }else{
      if(!confirm("Sign out and wipe this device?\n\nThis removes all locally cached data — the offline mirror, queue, and caches. Your data stays safe in Firebase; signing in again on this device will re-download everything from scratch.\n\nUse this when handing off or selling the device."))return;
    }
    clearCachedAuthUser();
    setOfflineAuth(false);
    wipeLocalDeviceData(uid);
    await fbAuth.signOut();setEntries([]);setDataLoaded(false);setLocked(false);
  };

  if(authState==="checking")return<LoadingScreen message="Checking sign-in…" T={T}/>;
  if(authState==="out")return<LoginScreen error={authError} T={T}/>;
  if(!user._offline&&!isSuperAdmin(user.uid)){
    if(accessState==="checking")return<LoadingScreen message="Checking access…" T={T}/>;
    if(accessState==="pending")return<WaitingScreen user={user} onSignOut={signOut} onSendMessage={sendPendingMessage} T={T}/>;
    if(accessState==="denied")return<WaitingScreen denied user={user} onSignOut={signOut} onRequestAgain={requestAccessAgain} T={T}/>;
  }

  // S6: was `{locked&&<LockScreen/>}` further down, layered on TOP of the
  // main content with a z-index — the content was still fully present in the
  // DOM underneath, inspectable via devtools, and "unlock" was a single tap
  // with no real barrier. This early return means locked content is
  // genuinely never rendered at all, and unlocking now requires the actual
  // PIN (see LockScreen).
  if(locked){
    let hasPin=false;
    try{hasPin=!!localStorage.getItem(pinHashKey(user.uid));}catch(e){}
    return<LockScreen T={T} uid={user.uid} hasPin={hasPin}
      onUnlock={()=>{setLocked(false);try{localStorage.removeItem(lockedFlagKey(user.uid));}catch(e){}}}
      onSignOut={signOut}/>;
  }

  // Derive sync display state.
  // E2: previously `!isOnline` alone meant "offline" — but isOnline only ever
  // reflects Firebase's own socket, so a device with a perfectly good network
  // waiting on that socket to (re)confirm looked identical to a device with no
  // network at all. Now: browserOnline false = genuinely offline; browserOnline
  // true but isOnline false = reconnecting (network exists, Firebase hasn't
  // confirmed yet — the watchdog is actively working on this).
  const displaySync=!browserOnline?"offline":!isOnline?"reconnecting":queueSize>0?"pending":syncStatus;
  const syncIcon=displaySync==="offline"?"📵":displaySync==="reconnecting"?"🔄":displaySync==="pending"?"⏳":displaySync==="saving"?"💾":displaySync==="synced"?"✓":"☁";
  const syncColor=displaySync==="offline"?T.danger:displaySync==="reconnecting"?T.waterBtnText:displaySync==="pending"?T.waterBtnText:displaySync==="saving"?T.textMuted:displaySync==="synced"?"#4ade80":T.border;

  const dayStr=new Date().toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"});
  const pendingCount=isAdminUser?Object.keys(pendingRequests||{}).length:0;

  return(
    <div style={{maxWidth:480,margin:"0 auto",height:"100dvh",display:"flex",flexDirection:"column",background:T.bg,color:T.text,fontFamily:"'DM Sans',system-ui,sans-serif",overflow:"hidden",position:"relative"}}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap');
        *{box-sizing:border-box;margin:0;padding:0}
        ::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:${T.border};border-radius:2px}
        input,select,textarea{background:${T.inputBg};color:${T.text};border:1px solid ${T.border};border-radius:8px;padding:7px 9px;font-family:inherit;font-size:0.83rem;outline:none;width:100%}
        input:focus,select:focus{border-color:${T.accent}}
        select option{background:${T.inputBg}}
        button{cursor:pointer;font-family:inherit}
        .card{background:${T.cardBg};border:1px solid ${T.border};border-radius:12px;padding:11px;margin-bottom:8px}
        .slabel{font-size:0.67rem;text-transform:uppercase;letter-spacing:0.09em;color:${T.textMuted};margin-bottom:5px;font-weight:600}
        .tle{display:flex;align-items:baseline;gap:8px;padding:5px 0;border-bottom:1px solid ${T.border}22}
        .tle:last-child{border-bottom:none}
        .tbtn{padding:5px 10px;font-size:0.79rem;border-radius:8px;background:${T.cardBg};color:${T.textMuted};border:1px solid ${T.border};white-space:nowrap;cursor:pointer;font-family:inherit;font-weight:500}
        .tbtn.on{background:${T.accentBg};color:${T.accent};border-color:${T.accentBtn};font-weight:600}
        .wbtn{background:${T.waterBtn};color:${T.waterBtnText};border:1px solid ${T.border};padding:7px 12px;border-radius:8px;font-size:0.85rem;font-weight:600;cursor:pointer}
        .wbtn:hover{background:${T.accentBtn};color:#fff}
        .ibtn{background:none;border:none;padding:8px 9px;border-radius:8px;color:${T.textMuted};font-size:0.82rem;cursor:pointer;min-width:36px;min-height:36px;display:inline-flex;align-items:center;justify-content:center}
        .ibtn:hover{background:${T.border};color:${T.text}}
        .ctbl{width:100%;border-collapse:collapse;font-size:0.73rem}
        .ctbl th{background:${T.navBg};color:${T.textMuted};padding:5px 6px;text-align:left;border:1px solid ${T.border};font-weight:600;white-space:nowrap}
        .ctbl td{padding:5px 6px;border:1px solid ${T.border};vertical-align:top;word-break:break-word}
        .ctbl tr:nth-child(even) td{background:${T.even}}
        input[type=number]::-webkit-inner-spin-button{opacity:0.4}
        input[type=time]{color-scheme:${theme==="light"?"light":"dark"}}
        input[type=date]{color-scheme:${theme==="light"?"light":"dark"};background:${T.inputBg}!important;color:${T.text}!important;}
        .tpl-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid ${T.border}22;font-size:0.82rem}
        .tpl-row:last-child{border-bottom:none}
        .tpl-chk{width:18px;height:18px;accent-color:${T.accentBtn};flex-shrink:0;cursor:pointer}
      `}</style>

      {undoToast&&<div style={{position:"fixed",left:12,right:12,bottom:64,zIndex:40,display:"flex",alignItems:"center",gap:10,padding:"10px 13px",borderRadius:10,background:T.cardBg,border:`1px solid ${T.border}`,boxShadow:"0 4px 18px rgba(0,0,0,0.28)"}}>
        <span style={{flex:1,fontSize:"0.82rem",color:T.text}}>🗑️ {undoToast.label} deleted</span>
        <button onClick={()=>{
          if(undoTimerRef.current){clearTimeout(undoTimerRef.current);undoTimerRef.current=null;}
          restoreEntry(undoToast.id);setUndoToast(null);
        }} style={{flexShrink:0,padding:"5px 12px",borderRadius:7,border:"none",background:T.accentBtn,color:"#fff",cursor:"pointer",fontFamily:"inherit",fontWeight:700,fontSize:"0.8rem"}}>Undo</button>
      </div>}

      {toast&&<div role="status" style={{position:"fixed",left:12,right:12,bottom:undoToast?116:64,zIndex:41,display:"flex",alignItems:"flex-start",gap:9,padding:"10px 13px",borderRadius:10,
        background:T.cardBg,
        border:`1px solid ${toast.kind==="error"?T.danger:toast.kind==="success"?"#4ade80":T.border}`,
        boxShadow:"0 4px 18px rgba(0,0,0,0.28)"}}>
        <span style={{flexShrink:0,fontSize:"0.95rem",lineHeight:1.3}}>{toast.kind==="error"?"⚠️":toast.kind==="success"?"✅":"ℹ️"}</span>
        <span style={{flex:1,fontSize:"0.82rem",color:T.text,whiteSpace:"pre-line",lineHeight:1.4}}>{toast.msg}</span>
        <button onClick={()=>{if(toastTimerRef.current)clearTimeout(toastTimerRef.current);setToast(null);}} aria-label="Dismiss"
          style={{flexShrink:0,background:"none",border:"none",color:T.textMuted,cursor:"pointer",fontSize:"0.95rem",padding:"0 2px",lineHeight:1}}>✕</button>
      </div>}

      <div style={{display:"flex",alignItems:"center",gap:10,padding:"9px 13px 7px",background:T.navBg,borderBottom:`1px solid ${T.border}`,flexShrink:0}}>
        <img src={LOGO_SVG} style={{width:32,height:32,borderRadius:8}} alt="logo"/>
        <div style={{flex:1}}>
          <div style={{fontWeight:700,fontSize:"0.95rem",color:T.accent,lineHeight:1.1}}>JivanLog</div>
          <div style={{fontSize:"0.72rem",color:T.textMuted,fontFamily:"'DM Mono',monospace"}}>{dayStr}<span style={{opacity:0.45,marginLeft:5}}>{APP_VERSION}</span></div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:6}}>
          <span title={displaySync==="offline"?"Offline — entries saved locally":displaySync==="reconnecting"?"Reconnecting… entries saved locally, will sync automatically":displaySync==="pending"?`${queueSize} pending — tap to sync`:displaySync==="saving"?"Syncing…":displaySync==="synced"?"Synced ✓":"Synced"} style={{fontSize:"1rem",color:syncColor,transition:"color 0.3s",cursor:queueSize>0?"pointer":"default"}} onClick={queueSize>0?async()=>{
            const reason=await flushOfflineQueue();
            if(reason==="not-confirmed")showToast("Still confirming your sign-in — this should resolve on its own shortly. If it doesn't, try signing out and back in.","error");
            else if(reason==="not-connected")showToast("Not connected to the server yet — will retry automatically once connected.","error");
            else if(reason&&reason.startsWith("error:"))showToast("Sync failed: "+reason.slice(6),"error");
          }:undefined}>{syncIcon}</span>
          {queueSize>0&&<button onClick={async()=>{
            const reason=await flushOfflineQueue();
            if(reason==="not-confirmed")showToast("Still confirming your sign-in — this should resolve on its own shortly. If it doesn't, try signing out and back in.","error");
            else if(reason==="not-connected")showToast("Not connected to the server yet — will retry automatically once connected.","error");
            else if(reason&&reason.startsWith("error:"))showToast("Sync failed: "+reason.slice(6),"error");
          }} title="Sync pending entries now" style={{fontSize:"0.72rem",padding:"2px 5px",borderRadius:5,border:`1px solid ${T.border}`,background:T.cardBg,color:T.waterBtnText,cursor:"pointer",fontFamily:"inherit",fontWeight:600,flexShrink:0}}>Sync {queueSize}</button>}
          <Clock T={T}/>
        </div>
      </div>
      <QueueAgeBadge queueOldestAt={queueOldestAt} onSyncNow={flushOfflineQueue} T={T}/>

      {storageWarn&&<div style={{display:"flex",alignItems:"flex-start",gap:7,padding:"7px 13px",background:T.dangerBg||T.accentBg,borderBottom:`1px solid ${T.danger}`,fontSize:"0.72rem",color:T.danger,flexShrink:0}}>
        <span style={{flex:1,lineHeight:1.5}}>
          {storageWarn.quota
            ? <>⚠️ <b>This device is out of storage space.</b> {storageWarn.what==="offline-queue"
                ? "An entry may not be saved locally — check your connection and make sure it syncs."
                : "The local backup copy could not be updated. Your entries are still saved to the cloud when online."}</>

function HomePage({entries,settings,onAdd,onUpdate,onDelete,entryTime,setEntryTime,T}){
  const[active,setActive]=useState("meal");

  // type, exercise type, medical reading, medication) now refreshes it too —

  // person has manually backdated the time (typed into TimeInput), that
  // deliberate edit must not get silently overwritten by a later selection in

  // N4: long-press (mobile) or double-click (desktop) an entry in Today's Log
  // to edit it inline, reusing the same EditEntry component Manage uses.

          ))}
        </div>

      </div>

      {active==="liquid"    &&<LiquidEntry settings={settings} entries={entries} onAdd={onAdd} entryTime={entryTime} setEntryTime={onTimeEdit} refreshTime={refreshTime} T={T}/>}
      {active==="exercise"  &&<ExerciseEntry settings={settings} entries={entries} onAdd={onAdd} entryTime={entryTime} setEntryTime={onTimeEdit} refreshTime={refreshTime} T={T}/>}
      {active==="medical"   &&<MedicalEntry settings={settings} entries={entries} onAdd={onAdd} entryTime={entryTime} setEntryTime={onTimeEdit} refreshTime={refreshTime} T={T}/>}
      {active==="medication"&&<MedEntry settings={settings} entries={entries} onAdd={onAdd} entryTime={entryTime} setEntryTime={onTimeEdit} refreshTime={refreshTime} T={T}/>}
      <div style={{marginTop:14}}>
        <div className="slabel" style={{position:"sticky",top:0,zIndex:2,background:T.bg,padding:"4px 0"}}>Today's Log</div>
        {todayE.length===0?<div style={{color:T.textMuted,fontSize:"0.8rem",textAlign:"center",padding:"18px 0"}}>No entries yet today</div>:<div className="card" style={{padding:"8px 11px"}}>
          {todayE.map(e=>editingId===e.id
            ?<EditEntry key={e.id} entry={e} settings={settings} T={T} label="✏️ Editing" onSave={d=>{onUpdate&&onUpdate(e.id,d);setEditingId(null);}} onCancel={()=>setEditingId(null)} onDelete={()=>{onDelete&&onDelete(e.id);setEditingId(null);}}/>
            :<TLE key={e.id} e={e} settings={settings} onEdit={()=>setEditingId(e.id)} T={T}/>
