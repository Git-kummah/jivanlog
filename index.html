  <!-- S9: GitHub Pages can't set response headers, so this is the meta-tag
       form. Two honest caveats, matching the audit finding: script-src needs
       'unsafe-inline' (the whole app is one inline Babel-type script block,
       not an external file) and 'unsafe-eval' (Babel compiles JSX to
       JS and executes it at runtime — see S2/pre-compile in the roadmap for
       what would actually remove this need). Even with those, this still
       blocks loading a script from any THIRD origin, restricts where the app
       can send network requests (connect-src), and closes off several other
       attack classes (object-src, base-uri) — meaningful defense in depth,
       just not a complete XSS barrier on its own.

       apis.google.com / accounts.google.com: the FIRST deployed version of
       this policy omitted these and broke Google sign-in entirely
       (auth/internal-error) — signInWithPopup loads a helper script from
       apis.google.com and opens its popup at accounts.google.com.

       www.google.com (script-src/connect-src/frame-src): the SECOND deployed
       version still broke — App Check's ReCaptchaV3Provider loads
       https://www.google.com/recaptcha/api.js, which was never allowed, so
       App Check could never get a token and RTDB (App Check-enforced)
       rejected everything, including plain data loads — this is what looked
       like "the app isn't updating." Sourced from Google's own official
       reCAPTCHA FAQ (developers.google.com/recaptcha/docs/faq), which lists
       script-src/frame-src/connect-src all needing www.google.com — cross-
       checked against several independent integration guides that all state
       the same three directives, not just one source. reCAPTCHA v3 has no
       visible challenge UI, but still uses an invisible iframe internally,
       hence frame-src needs it too, not just script-src.

       frame-ancestors removed: Chrome logs (correctly) that it's ignored
       entirely when delivered via <meta> — it only works as a real HTTP
       header, which GitHub Pages can't send. Keeping it was dead weight
       that implied protection this policy was never actually providing.

       None of this — either break — was something a sandboxed test could
       have caught. There's no way to drive an actual Google OAuth popup or
       a real reCAPTCHA token exchange outside a real browser against the
       real Firebase project. -->

const FD={

  liquidTypes:["Warm Water","Plain Water","Morning Drink","Milk Coffee","Fennel Water","Milk Tea","Herbal Tea","Lemon Water","Black Coffee","Others","Coconut Water","Buttermilk"],
  liquidNotes:{"Morning Drink":"Warm water +  Honey + Lemon + Turmeric + Pepper + Cinnamon","Milk Coffee":"60ml Milk + 3/8 Tsp Stevia","Milk Tea":"20ml Milk + 3/8 Tsp Stevia","Lemon Water":"Water with 1/2 squeezed lemon"},

  medicalPresets:[{name:"Sugar",unit:"mg/dL"},{name:"Weight",unit:"kg"},{name:"BP",unit:"Sys/Dia"},{name:"Heart Rate",unit:"bpm"}],
  medications:["Glycomet SR 500","Cilnep/Nexovas 10","Vitamin B12 1500mcg","Vit D3 60K IU","Others"],
};
const deepClone=o=>JSON.parse(JSON.stringify(o));

const FOOD_UNITS=["g","ml","Tsp","Tbsp","count"];
const MED_TIMES=["Before breakfast","After breakfast","Before lunch","After lunch","Before dinner","After dinner","Bedtime"];
const MEAL_TYPES=["Breakfast","Lunch","Dinner","Snack"];

// ── HELPERS ───────────────────────────────────────────────────────────────────
const genId   =()=>Date.now().toString(36)+Math.random().toString(36).slice(2);
// Day-rollover offset, in minutes after local midnight — configurable in Settings.
// Default 90 = 1:30am, so a late night logging past midnight still counts as the
// day that's ending rather than rolling over to a new day too early. Cached to
// localStorage so it's correct immediately on a cold/offline boot, before any
// Firebase setting has loaded.
let DAY_ROLLOVER_MIN=(()=>{try{const v=localStorage.getItem("jivanlog-rolloverMin");return v!==null?parseInt(v,10):90;}catch{return 90;}})();
const setDayRolloverCache=min=>{DAY_ROLLOVER_MIN=min;try{localStorage.setItem("jivanlog-rolloverMin",String(min));}catch(e){}};
const today   =()=>{const d=new Date();d.setMinutes(d.getMinutes()-DAY_ROLLOVER_MIN);return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}; // local date, NOT toISOString (UTC) — UTC midnight = 05:30 IST, was misdating early-morning entries to the previous day
// E4: the day immediately before today()'s own logical date — computed from
// today()'s result, not a naive "now minus 24 hours", so it stays correct
// right at the rollover boundary the same way today() already is.
const yesterday=()=>{
  const[y,mo,d]=today().split("-").map(Number);
  const dt=new Date(y,mo-1,d);
  dt.setDate(dt.getDate()-1);
  return`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`;
};
const normDate=s=>{if(!s)return s;const a=s.match(/^(\d{2})-(\d{2})-(\d{2})$/);if(a)return`20${a[3]}-${a[2]}-${a[1]}`;const b=s.match(/^(\d{2})-(\d{2})-(\d{4})$/);if(b)return`${b[3]}-${b[2]}-${b[1]}`;return s;};
const fmt24   =dt=>new Date(dt).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",hour12:false});
const nowTime =()=>new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
const nowHHMM =()=>new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",hour12:false});
const fmtDate =s=>{if(!s)return"";const[y,m,d]=s.split("-");return`${d} ${["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+m-1]} ${y}`;};
const fmtShort=s=>{if(!s)return"";const[,m,d]=s.split("-");return`${d}/${["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+m-1]}`;};
const sysDark =()=>window.matchMedia?.("(prefers-color-scheme:dark)").matches;
// ── Food item helpers — handles both old string format and new {name,note} ────
const foodName=f=>typeof f==="string"?f:(f?.name||"");
const foodNote=f=>typeof f==="string"?"":( f?.note||"");
const foodItems=arr=>(arr||[]).map(f=>typeof f==="string"?{name:f,note:"",subTypes:[]}:{subTypes:[],...f});

// ── N1a: sub-types gain optional notes ────────────────────────────────────────
// A sub-type used to be a bare string. It can now also be {name, note}, using
// the same string-or-object back-compat pattern foodItems() already uses, so
// existing config (and any CSV exported before v4.78) keeps working untouched.
// Every read goes through these accessors; nothing assumes the object form.
const subName=s=>typeof s==="string"?s:((s&&s.name)||"");
const subNote=s=>typeof s==="string"?"":((s&&s.note)||"");
const subItems=arr=>(arr||[]).map(s=>typeof s==="string"?{name:s,note:""}:{name:"",note:"",...s});
const subNames=arr=>(arr||[]).map(subName);
const findSub=(arr,name)=>(arr||[]).find(s=>subName(s)===name);

// Combines an item's default note with the selected sub-type's note.
// Both present  -> joined with " + " (the requested "combine them smartly")
// One present   -> that one
// Either already contains the other -> the longer one, so re-selecting a
//                  sub-type can't produce "note + note" duplication.
const combineNotes=(itemNote,subTypeNote)=>{
  const a=(itemNote||"").trim(), b=(subTypeNote||"").trim();
  if(!a)return b;
  if(!b)return a;
  if(a.includes(b))return a;
  if(b.includes(a))return b;
  return a+" + "+b;
};

// ── N6: config rename with historical cascade ────────────────────────────────
// Entries store config names as plain STRINGS (food:"Nuts"), not ids, so
// renaming a config item would otherwise orphan every past entry: reports and
// usage ranking would silently fragment across the old and new names. These
// pure helpers describe what a rename touches; the App callback applies them.
//
// Every write goes through per-entry `.update()` paths — never `.set()` on the
// entries node, which is the pattern behind the original data-loss incident.
const RENAME_SPECS={
  food:        {types:["meal"],            field:"food"},
  foodSub:     {types:["meal"],            field:"foodSubType",   parentField:"food"},
  drink:       {types:["liquid","water"],  field:"liquidType"},
  drinkSub:    {types:["liquid","water"],  field:"liquidSubType", parentField:"liquidType"},
  exercise:    {types:["exercise"],        field:"exType"},
  exerciseSub: {types:["exercise"],        field:"subType",       parentField:"exType"},
  medical:     {types:["medical"],         field:"readingType"},
  med:         {types:["medication"],      field:"med"},
};
const renameMatches=(e,kind,parent,oldName)=>{
  const sp=RENAME_SPECS[kind];
  if(!sp||!e)return false;
  if(!sp.types.includes(e.type))return false;
  if(sp.parentField&&e[sp.parentField]!==parent)return false;
  return (e[sp.field]||"")===oldName;
};
const countRenameHits=(all,kind,parent,oldName)=>(all||[]).filter(e=>renameMatches(e,kind,parent,oldName)).length;

// Rewrites the config object itself. Pure: returns a new settings object.
function renameInConfig(settings,kind,parent,oldName,newName){
  const s=deepClone(settings||{});
  const renSub=list=>(list||[]).map(x=>subName(x)===oldName?(subNote(x)?{name:newName,note:subNote(x)}:newName):x);
  const renKey=(obj,ok,nk)=>{
    if(!obj||!Object.prototype.hasOwnProperty.call(obj,ok))return obj;
    const out={};Object.keys(obj).forEach(k=>{out[k===ok?nk:k]=obj[k];});return out;
  };
  if(kind==="food")        s.foodCategories=(s.foodCategories||[]).map(f=>(f.name||f)===oldName?(typeof f==="string"?newName:{...f,name:newName}):f);
  if(kind==="foodSub")     s.foodCategories=(s.foodCategories||[]).map(f=>(f.name||f)===parent?{...f,subTypes:renSub(f.subTypes)}:f);
  if(kind==="drink"){
    s.liquidTypes=(s.liquidTypes||[]).map(t=>t===oldName?newName:t);
    s.liquidNotes=renKey(s.liquidNotes,oldName,newName);
    s.liquidSubTypes=renKey(s.liquidSubTypes,oldName,newName);
    s.liquidIcons=renKey(s.liquidIcons,oldName,newName);
  }
  if(kind==="drinkSub"&&s.liquidSubTypes) s.liquidSubTypes={...s.liquidSubTypes,[parent]:renSub(s.liquidSubTypes[parent])};
  if(kind==="exercise")    s.exerciseTypes=(s.exerciseTypes||[]).map(e=>e.name===oldName?{...e,name:newName}:e);
  if(kind==="exerciseSub") s.exerciseTypes=(s.exerciseTypes||[]).map(e=>e.name===parent?{...e,subTypes:renSub(e.subTypes)}:e);
  if(kind==="medical")     s.medicalPresets=(s.medicalPresets||[]).map(p=>(p.name||p)===oldName?(typeof p==="string"?newName:{...p,name:newName}):p);
  if(kind==="med"){
    s.medications=(s.medications||[]).map(m=>m===oldName?newName:m);
    s.medicationIcons=renKey(s.medicationIcons,oldName,newName);
  }
  return s;
}

// ── Data repair: emoji baked into stored names ───────────────────────────────
// Before v4.36, icon-decorated <option> elements were missing a value=
// attribute, so the browser submitted the DISPLAY text — emoji and all. Those
// entries still carry names like "🩸 Sugar", which no longer match any config
// item, so they are silently excluded from Reports and Trends. Detection is
// deliberately conservative: a value is only offered for repair when stripping
// its leading emoji makes it match a real config name EXACTLY.
const LEADING_EMOJI=/^[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2190}-\u{21FF}\u{FE0F}\u{2B00}-\u{2BFF}]+\s*/u;
const stripLeadingEmoji=v=>String(v==null?"":v).replace(LEADING_EMOJI,"").trim();
function findEmojiRepairs(all,settings){
  const st=settings||{};
  const known={
    food:new Set(foodItems(st.foodCategories||FD.foodCategories).map(f=>f.name)),
    drink:new Set((st.liquidTypes||FD.liquidTypes||[]).filter(t=>t!=="--------")),
    exercise:new Set((st.exerciseTypes||FD.exerciseTypes||[]).map(e=>e.name||e)),
    medical:new Set((st.medicalPresets||FD.medicalPresets||[]).map(p=>p.name||p)),
    med:new Set(st.medications||FD.medications||[]),
  };
  const plan=[];
  const bump=(field,e,pool)=>{
    const cur=e[field];
    if(!cur||!LEADING_EMOJI.test(String(cur)))return;
    const fixed=stripLeadingEmoji(cur);
    if(!fixed||!pool.has(fixed))return;           // only repair provable matches
    plan.push({id:e.id,field,from:cur,to:fixed});
  };
  (all||[]).forEach(e=>{
    if(e.type==="meal")                     bump("food",e,known.food);
    if(e.type==="liquid"||e.type==="water") bump("liquidType",e,known.drink);
    if(e.type==="exercise")                 bump("exType",e,known.exercise);
    if(e.type==="medical")                  bump("readingType",e,known.medical);
    if(e.type==="medication")               bump("med",e,known.med);
  });
  return plan;
}

// ── Access control (admin-gated signup) ────────────────────────────────────
// The superadmin UID is hardcoded here, not only in the database, so admin
// status can never be lost or revoked by any DB write, bad import, or bug.
// To find your UID: Firebase Console → Authentication → Users tab → copy the
// "User UID" value for your row. Paste it below, replacing the placeholder.
const SUPERADMIN_UID="JVrBRWCGlUhlHrWO3U5rjC3E9GH3";
// C1 (v4.77): marks that users/{uid}/settings has become the single source of
// truth for config, replacing the old settings+defaults draft/active pair.
// Absent = pre-v4.77 data that still needs the one-time merge migration.
const CONFIG_MODEL_KEY="configModel";
const CONFIG_MODEL_V2="v2";

// ── Usage-based auto-ordering ──────────────────────────────────────────────
// Home entry-form dropdowns only (Meal type tabs excluded by design — Breakfast/
// Lunch/Dinner/Snack stay fixed). Ranking is derived live from actual logged
// entries each render — no separate counter is stored, so there's nothing new
// to back up, migrate, or lose. Settings' manual ▲▼ / A→Z ordering is untouched;
// this only affects what order items appear in on the Home page.
const usageCounts=(entries,pred,keyFn)=>{
  const m=new Map();
  (entries||[]).forEach(e=>{
    if(e.deleted)return;
    if(!pred(e))return;
    const k=keyFn(e);
    if(k)m.set(k,(m.get(k)||0)+1);
  });
  return m;
};
const byUsage=(items,counts,nameOf)=>items
  .map((item,i)=>({item,i,c:counts.get(nameOf(item))||0}))
  .sort((a,b)=>b.c-a.c||a.i-b.i)
  .map(x=>x.item);

// mealFromTime is the time-driven core; autoMeal() is the zero-arg form used
// as MealEntry's initial state (mirrors autoMedTiming's existing shape so the
// two "derive category from time" functions are consistent with each other).
const mealFromTime=timeStr=>{const[h,m]=(timeStr||nowHHMM()).split(":").map(Number);const mins=h*60+(m||0);return mins<705?"Breakfast":mins<945?"Lunch":mins<1125?"Snack":"Dinner";};
const autoMeal=()=>mealFromTime(nowHHMM());
// B2: makeTS previously threw RangeError on shorthand times ("920", "9", "9.20"),
// which silently killed the Save handler in Manage. It now parses the same shorthand
// the Home TimeInput accepts, and clamps rather than producing an Invalid Date.
const parseTimeParts=timeStr=>{
  const s=String(timeStr==null?"":timeStr).trim();
  let h,mi;
  // An explicit separator is authoritative: "9:2" is 09:02, not 92 minutes.
  const sep=s.match(/^(\d{1,2})\s*[:.]\s*(\d{1,2})$/);
  if(sep){h=+sep[1];mi=+sep[2];}
  else{
    const raw=s.replace(/[^0-9]/g,"");
    if(!raw)return[0,0];
    if(raw.length<=2){h=+raw;mi=0;}
    else if(raw.length===3){h=+raw[0];mi=+raw.slice(1);}
    else{h=+raw.slice(0,2);mi=+raw.slice(2,4);}
  }
  if(!isFinite(h))h=0;
  if(!isFinite(mi))mi=0;
  return[Math.min(23,Math.max(0,h)),Math.min(59,Math.max(0,mi))];
};
const makeTS  =(dateStr,timeStr)=>{const[y,mo,d]=dateStr.split("-").map(Number);const[h,mi]=parseTimeParts(timeStr);const dt=new Date(y,mo-1,d,h,mi,0,0);return isNaN(dt.getTime())?new Date().toISOString():dt.toISOString();};

// B9: makeTS (and addEntry's old separate approach) assumed a logical date
// (entry.date / today()'s rollover-adjusted grouping day) and its clock time
// always fall on the SAME real calendar day. That's true most of the time,
// but false for the post-midnight window before the rollover cutoff — a
// 00:30 entry logged under "yesterday's" bucket actually happened on the
// REAL next calendar day. Editing such an entry (even without changing
// anything) silently shifted its timestamp back a day, and backdating the
// time field into that same window during entry CREATION had the identical
// bug from the other direction. This is the single, correct inverse of
// today()'s own rollover math: a time before the cutoff belongs to the real
// calendar day AFTER the logical date; a time at or after it belongs to the
// same real day as the logical date.
const timestampForLogicalDate=(logicalDateStr,timeStr)=>{
  const[h,mi]=parseTimeParts(timeStr);
  const minsOfDay=h*60+(mi||0);
  const[y,mo,d]=logicalDateStr.split("-").map(Number);
  const dt=new Date(y,mo-1,d,h,mi,0,0);
  if(isNaN(dt.getTime()))return new Date();
  if(minsOfDay<DAY_ROLLOVER_MIN)dt.setDate(dt.getDate()+1);
  return dt;
};

// ── OFFLINE QUEUE & CACHE HELPERS ─────────────────────────────────────────────
const getOfflineQ  =uid=>{try{return JSON.parse(localStorage.getItem(`jivanlog-offlineQ-${uid}`)||"[]");}catch{return[];}};
const saveOfflineQ =(uid,arr)=>{
  // The offline queue is the authoritative store for not-yet-synced entries.
  // A silent failure here is the one remaining genuine data-loss path, so it
  // must reach the UI rather than only the console.
  try{localStorage.setItem(`jivanlog-offlineQ-${uid}`,JSON.stringify(arr));return true;}
  catch(e){onStorageProblem("offline-queue",e);return false;}
};
// Remove ONLY the specified ids from the queue (entries added meanwhile survive).
const removeFromQueue=(uid,ids)=>{const set=new Set(ids);const left=getOfflineQ(uid).filter(e=>!set.has(e.id));saveOfflineQ(uid,left);return left;};
// E3: upsert one item into the offline queue, stamping _queuedAt so the UI can
// warn about long-pending writes. If the same id is already queued (e.g. an
// offline edit of an entry that was itself added offline), the ORIGINAL
// _queuedAt is kept — the oldest still-unsynced moment for that id is the
// honest "how long has this been pending" answer, not the latest edit time.
// _queuedAt is stripped before anything is written to Firebase (see flushOfflineQueue).
const queueUpsert=(uid,item)=>{
  const q=getOfflineQ(uid);
  const idx=q.findIndex(e=>e.id===item.id);
  const queuedAt=idx>=0?(q[idx]._queuedAt||Date.now()):Date.now();
  const stamped={...item,_queuedAt:queuedAt};
  const next=idx>=0?[...q.slice(0,idx),stamped,...q.slice(idx+1)]:[...q,stamped];
  saveOfflineQ(uid,next);
  return next;
};

// ── FULL LOCAL MIRROR ─ durable copy of ALL entries (offline view + recovery) ─
//
// O5/O6 (v4.74): this used to be a single localStorage key holding a JSON array
// of every entry. Two problems, both measured against real data (6,084 entries):
//   • Every single save re-serialised and rewrote the WHOLE array — 1.12 MB per
//     entry saved, growing ~1.86 MB/year. That's the pause you feel on Save.
//   • localStorage's ~5 MB cap was ~1–2 years out, and QuotaExceededError was
//     handled by a lone console.warn: the mirror would silently stop updating
//     and the offline safety net would quietly disappear.
//
// It is now IndexedDB, written UPSERT-ONLY (one put per changed entry, never a
// wholesale rewrite). That choice matters beyond speed: because the app is
// append-only (deletes are tombstones, never removals), nothing legitimately
// needs to disappear from the mirror — so never rewriting the whole store means
// tombstones cannot be dropped by a live-entries-only write, which was a real
// bug at four separate call sites.
//
// localStorage remains the fallback when IndexedDB is unavailable (private mode,
// old browsers). The mirror is a data-loss safety net, so it must degrade, never
// vanish.
const MIRROR_DB_VERSION=1;
const mirrorDbName=uid=>`jivanlog-mirror-${uid}`;
const _idbConn={};
let _idbBroken=false;

function idbOpen(uid){
  if(_idbBroken)return Promise.reject(new Error("idb-unavailable"));
  if(_idbConn[uid])return _idbConn[uid];
  _idbConn[uid]=new Promise((resolve,reject)=>{
    let idb=null;
    try{idb=window.indexedDB;}catch(e){}
    if(!idb){reject(new Error("idb-unavailable"));return;}
    let req;
    try{req=idb.open(mirrorDbName(uid),MIRROR_DB_VERSION);}
    catch(e){reject(e);return;}
    req.onupgradeneeded=()=>{
      const db=req.result;
      if(!db.objectStoreNames.contains("entries"))db.createObjectStore("entries",{keyPath:"id"});
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error||new Error("idb-open-failed"));
    req.onblocked=()=>reject(new Error("idb-blocked"));
  }).catch(err=>{
    // Don't cache a permanently-rejected promise; mark IDB unusable so every
    // caller falls back to localStorage rather than retrying on every save.
    delete _idbConn[uid];
    _idbBroken=true;
    throw err;
  });
  return _idbConn[uid];
}

function idbPutEntries(uid,list){
  if(!list||!list.length)return Promise.resolve(true);
  return idbOpen(uid).then(db=>new Promise((resolve,reject)=>{
    let tx;
    try{tx=db.transaction("entries","readwrite");}catch(e){reject(e);return;}
    const st=tx.objectStore("entries");
    for(const e of list){if(e&&e.id)st.put(e);}
    tx.oncomplete=()=>resolve(true);
    tx.onerror=()=>reject(tx.error||new Error("idb-tx-failed"));
    tx.onabort=()=>reject(tx.error||new Error("idb-tx-aborted"));
  }));
}

function idbGetAllEntries(uid){
  return idbOpen(uid).then(db=>new Promise((resolve,reject)=>{
    let tx;
    try{tx=db.transaction("entries","readonly");}catch(e){reject(e);return;}
    const req=tx.objectStore("entries").getAll();
    req.onsuccess=()=>resolve(req.result||[]);
    req.onerror=()=>reject(req.error||new Error("idb-read-failed"));
  }));
}

// ── localStorage fallback (also the pre-v4.74 format we migrate FROM) ──
const lsMirrorKey=uid=>`jivanlog-mirror-${uid}`;
const getMirrorLS =uid=>{try{return JSON.parse(localStorage.getItem(lsMirrorKey(uid))||"[]");}catch{return[];}};
const saveMirrorLS=(uid,allEntries)=>{
  try{localStorage.setItem(lsMirrorKey(uid),JSON.stringify(allEntries));return true;}
  catch(e){onStorageProblem("mirror",e);return false;}
};
// Upsert semantics for the fallback path (read-modify-write, the old cost —
// only paid when IndexedDB is genuinely unavailable).
const putMirrorLS=(uid,list)=>{
  if(!list||!list.length)return true;
  const byId=new Map(getMirrorLS(uid).map(e=>[e.id,e]));
  for(const e of list){if(e&&e.id)byId.set(e.id,e);}
  return saveMirrorLS(uid,Array.from(byId.values()));
};

// Surfaced to the UI so a failing write is never silent (was: console.warn only).
let _storageProblemCb=null;
const setStorageProblemHandler=fn=>{_storageProblemCb=fn;};
function onStorageProblem(what,err){
  const quota=err&&(err.name==="QuotaExceededError"||err.name==="NS_ERROR_DOM_QUOTA_REACHED"||err.code===22);
  console.warn("Storage problem ["+what+"]:",err);
  if(_storageProblemCb)_storageProblemCb({what,quota,message:(err&&err.message)||String(err)});
}

// ── Unified mirror API used by the app ──
// Upsert one or more entries. Fire-and-forget: never blocks a save.
function mirrorPut(uid,list){
  if(!uid||!list||!list.length)return;
  idbPutEntries(uid,list).catch(err=>{
    // IndexedDB is unavailable — fall back to localStorage. saveMirrorLS reports
    // its own failure with the accurate reason (quota vs other), so don't report
    // the IndexedDB error on top of it: that would mask a genuine "out of space"
    // with a misleading "idb-unavailable" and show the wrong message to the user.
    console.warn("Mirror: IndexedDB write failed, using localStorage fallback",err);
    putMirrorLS(uid,list);
  });
}
// Read the complete mirror (live + tombstones), migrating the old localStorage
// array into IndexedDB the first time. Returns [] rather than throwing.
async function mirrorGetAll(uid){
  if(!uid)return[];
  const ls=getMirrorLS(uid);
  try{
    const rows=await idbGetAllEntries(uid);
    if(rows.length)return rows;
    if(ls.length){
      // ── one-time migration from the pre-v4.74 localStorage array ──
      await idbPutEntries(uid,ls);
      const check=await idbGetAllEntries(uid);
      // Only drop the localStorage copy once IndexedDB verifiably holds it all.
      if(check.length>=ls.length){
        try{localStorage.removeItem(lsMirrorKey(uid));}catch(e){}
        return check;
      }
      return ls;
    }
    return[];
  }catch(err){
    console.warn("Mirror: IndexedDB unavailable, using localStorage fallback",err);
    return ls;
  }
}

// S6: the lock screen used to be "tap anywhere to unlock" — no real barrier
// at all — and the locked flag was pure React state, so a refresh while
// locked booted straight back into the unlocked app. This is the real
// version: a 4-digit PIN, hashed (never stored in plain text) and salted
// with the uid so two accounts sharing a device can't collide or leak each
// other's PIN via a shared hash. SHA-256 via the Web Crypto API — no
// library needed, available in every browser this app runs in.
async function hashPin(pin,uid){
  const enc=new TextEncoder().encode(pin+":"+uid);
  const buf=await crypto.subtle.digest("SHA-256",enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

const lockedFlagKey=uid=>`jivanlog-locked-${uid}`;

// S7: normal sign-out only ever cleared the cached IDENTITY — the offline
// mirror, queue, daily-backup flags, and settings/today caches all stayed on
// the device afterward, readable via devtools by anyone with the unlocked
// phone. This is the thorough alternative: every per-account key, found by
// PREFIX match since todayCache carries a variable date suffix that can't be
// computed as one exact key, plus the IndexedDB mirror (a whole database,
// not a key — needs its own delete call). Deliberately leaves
// jivanlog-rolloverMin alone: it's a device-level UI preference, not
// per-account data, and wiping it would just reset a cosmetic setting for
// whoever signs in next on a shared device.
const wipeLocalDeviceData=uid=>{
  const prefixes=[
    `jivanlog-approved-${uid}`,
    `jivanlog-dailyBackup-${uid}`,
    `jivanlog-offlineQ-${uid}`,
    `jivanlog-settingsCache-${uid}`,
    `jivanlog-todayCache-${uid}-`,
    `jivanlog-mirror-${uid}`, // localStorage fallback path when IndexedDB is unavailable
    `jivanlog-lastBackup-${uid}`,
    `jivanlog-lastRemoteBackup-${uid}`,
  ];
  try{
    const toRemove=[];
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k&&prefixes.some(p=>k===p||k.startsWith(p)))toRemove.push(k);
    }
    toRemove.forEach(k=>{try{localStorage.removeItem(k);}catch(e){}});
  }catch(e){}
  try{localStorage.removeItem("jivanlog-authUser");}catch(e){}
  try{indexedDB.deleteDatabase(mirrorDbName(uid));}catch(e){}
};

// ── REPORT HELPERS ────────────────────────────────────────────────────────────
function dayReport(dayEntries,medPresets,exerciseTypesConfig){
  const mp=medPresets||FD.medicalPresets||[];
  const WTYP=["Warm Water","Plain Water","Cold Water"];
  const liqs=dayEntries.filter(e=>e.type==="liquid");
  const waters=liqs.filter(e=>WTYP.includes(e.liquidType));
  const nonW=liqs.filter(e=>!WTYP.includes(e.liquidType));
  const totalW=waters.reduce((s,e)=>s+(+e.ml||0),0);
  const waterStr=totalW?`${totalW}ml (${[...new Set(waters.map(e=>e.liquidType))].join("/")})`:`-`;
  const drinksStr=nonW.map(e=>`${e.liquidType}${e.ml?" "+e.ml+"ml":""}${e.notes?" ("+e.notes+")":""}`).join("; ")||"-";
  const ex=dayEntries.filter(e=>e.type==="exercise").map(e=>[e.exType,...exerciseMetricParts(e,exerciseTypesConfig)].join(" ")).join("; ")||"-";
  const meds=dayEntries.filter(e=>e.type==="medication").map(e=>`${e.med}(${e.timing})`).join("; ")||"-";
  const meals={};["Breakfast","Lunch","Dinner","Snack"].forEach(mt=>{meals[mt]=dayEntries.filter(e=>e.type==="meal"&&e.mealType===mt).map(e=>e.unit==="count"?`${e.food} ${e.qty}`:`${e.food} ${e.qty}${e.unit}`).join(", ")||"-";});
  const medR={};mp.forEach(p=>{const nm=p.name||p;medR[nm]=dayEntries.filter(e=>e.type==="medical"&&e.readingType===nm).map(e=>`${e.value}${e.unit?" "+e.unit:""}`).join(", ")||"-";});
  return{water:waterStr,drinks:drinksStr,medication:meds,exercise:ex,...meals,...medR};
}

function buildAllCSV(entries){
  const hdr=["ID","Date","Time","Type","SubType","Detail1","Detail2","Detail3","Unit","Notes","Deleted","DeletedAt"];
  const rows=[...entries].sort((a,b)=>new Date(a.timestamp)-new Date(b.timestamp)).map(e=>{
    let t="",st="",d1="",d2="",d3="",u="",n=e.notes||"";
    if(e.type==="meal")      {t="Meal";st=e.mealType;d1=e.food+(e.foodSubType?" · "+e.foodSubType:"");d2=e.qty;u=e.unit;}
    if(e.type==="liquid")    {t="Drinks";st=(e.liquidType||"")+(e.liquidSubType?" · "+e.liquidSubType:"");d1=e.ml||"";u="ml";}
    if(e.type==="exercise")  {t="Exercise";st=e.exType;d1=e.subType||"";d2=e.dist||"";d3=formatTimeDisplay(e.time)||(e.count?`${e.count} Floors`:"")||(e.hr?`HR ${e.hr}`:"")||(e.steps?`${e.steps} Steps`:"")||(e.speed?`${e.speed}km/h`:"");u=e.dist?"km":"";}
    if(e.type==="medical")   {t="Medical";st=e.readingType;d1=e.value;u=e.unit||"";}
    if(e.type==="medication"){t="Medication";st=e.med;d1=e.timing;}
    // S8: was unconditional-quote-wrap only, which does NOT stop formula
    // injection — Excel evaluates the PARSED cell value, and CSV quotes are
    // structural syntax stripped before that evaluation, not an escape a
    // spreadsheet respects. csvCell() applies the real guard (a leading ' on
    // any =+-@ value) uniformly with the config CSV exporter.
    return[e.id,normDate(e.date),fmt24(e.timestamp),t,st,d1,d2,d3,u,n,e.deleted?"YES":"",e.deletedAt||""].map(csvCell).join(",");
  });
  return[hdr.join(","),...rows].join("\n");
}

}
function buildViewCSV(entries,dates,medPresets,exerciseTypesConfig){
  const medNames=(medPresets||FD.medicalPresets).map(p=>typeof p==="string"?p:p.name);
  const rows=[
    {key:"water",label:"Water"},{key:"drinks",label:"Drinks"},{key:"medication",label:"Medications"},{key:"exercise",label:"Exercise"},
    {key:"Breakfast",label:"Breakfast"},{key:"Lunch",label:"Lunch"},{key:"Snack",label:"Snack"},{key:"Dinner",label:"Dinner"},
    ...medNames.map(n=>({key:n,label:n})),

  const hdr=["Category",...dates.map(fmtDate)].join(",");
  const dataRows=rows.map(({label,key})=>{const vals=dates.map(d=>{const r=dayReport(entries.filter(e=>e.date===d),medPresets,exerciseTypesConfig);return csvCell(r[key]||"-");});return[csvCell(label),...vals].join(",");});
  return[hdr,...dataRows].join("\n");
}

// ── CSV IMPORT ────────────────────────────────────────────────────────────────
function parseAndMergeCSV(csvText,existingEntries){
  const lines=csvText.split("\n").map(l=>l.trim()).filter(Boolean);
  if(lines.length<2)throw new Error("Empty file");
  const hdrs=lines[0].split(",").map(h=>h.replace(/^"|"$/g,"").trim());
  ["Date","Time","Type"].forEach(r=>{if(!hdrs.includes(r))throw new Error(`Missing column: ${r}`);});
  const col=k=>hdrs.indexOf(k);
  const cell=(row,k)=>{
    const v=row[col(k)]||"";
    let s=v.replace(/^"|"$/g,"").replace(/""/g,'"').trim();
    // S8: symmetric with csvCell()'s export-time guard — a leading ' was only
    // ever added by us, specifically when the raw value started with =+-@.
    // Undo it on import so round-tripping your own export doesn't leave a
    // stray apostrophe stuck on every affected food/note/etc permanently.
    if(/^'[=+\-@]/.test(s))s=s.slice(1);
    return s;
  };
  const existingIds=new Set(existingEntries.map(e=>e.id));
  const imported=[];
  for(let i=1;i<lines.length;i++){
    const row=[];let cur="",inQ=false;
    for(const ch of lines[i]+","){if(ch==='"'){inQ=!inQ;}else if(ch===","&&!inQ){row.push(cur);cur="";}else cur+=ch;}
    const rawId=cell(row,"ID");const id=rawId||[cell(row,"Date"),cell(row,"Time"),cell(row,"Type"),cell(row,"SubType"),cell(row,"Detail1"),String(i)].join("|").replace(/[\s.#$\[\]/]/g,"_");if(!cell(row,"Date")||!cell(row,"Type"))continue;
    if(rawId&&existingIds.has(id))continue;
    // C4 (still open): ID-less rows have no dedup mechanism on re-import — a
    // natural key was computed here but never actually used for anything,
    // going all the way back to the original audit. Re-importing the same
    // ID-less CSV (e.g. the sugar diary format) will duplicate every row.
    // Removing the dead computation rather than building the fix into this
    // cleanup pass — implementing dedup properly deserves its own attention,
    // not to be rushed in here.
    const dateStr=cell(row,"Date");const timeStr=cell(row,"Time")||"00:00";
    const type=cell(row,"Type").toLowerCase();
    const subType=cell(row,"SubType");const d1=cell(row,"Detail1")||cell(row,"T");const d2=cell(row,"Detail2");const d3=cell(row,"Detail3");const unit=cell(row,"Unit");const notes=cell(row,"Notes");
    const parsedDate=(()=>{
      // Handle "DD Mon YYYY" e.g. "1 Mar 2026" (diary format)
      const monMatch=dateStr.match(/^(\d{1,2})\s+(\w+)\s+(\d{4})$/);
      if(monMatch){const mi=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"].indexOf(monMatch[2].slice(0,3));if(mi>=0)return`${monMatch[3]}-${String(mi+1).padStart(2,"0")}-${monMatch[1].padStart(2,"0")}`;}
      return normDate(dateStr); // handles DD-MM-YY, DD-MM-YYYY, YYYY-MM-DD
    })();
    const ts=makeTS(parsedDate,timeStr);
    let entry={id,date:parsedDate,timestamp:ts,notes};
    if(type==="meal")       entry={...entry,type:"meal",mealType:subType,food:d1,qty:d2,unit};
    else if(type==="drinks")entry={...entry,type:"liquid",liquidType:subType,liquidSubType:"",ml:+d1||0,notes};
    else if(type==="exercise")entry={...entry,type:"exercise",exType:subType,subType:d1,dist:d2,time:d3,count:d3,unit};
    else if(type==="water"||type==="liquid") entry={...entry,type:"liquid",liquidType:subType||"Warm Water",ml:+d1||0,notes};
    else if(type==="medical")entry={...entry,type:"medical",readingType:subType,value:d1,unit};
    else if(type==="medication")entry={...entry,type:"medication",med:subType,timing:d1};
    else continue;
    imported.push(entry);
  }
  return imported;
}

function downloadCSV(csv,filename){
  try{const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.setAttribute("download",filename);document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1000);}catch(e){
    // E15: the one deliberate exception. downloadCSV is a standalone utility
    // called from dozens of places throughout the app, not a component —
    // there's no showToast in scope here, and threading it through every
    // call site for a failure mode this rare (Blob/URL.createObjectURL not
    // existing) isn't worth the plumbing. Left as alert().
    alert("Download failed: "+e.message);
  }
}

function LockScreen({T,uid,hasPin,onUnlock,onPinSet,onSignOut}){
  // Three modes: "setup" (no PIN exists yet — first time locking) walks
  // through choosing a PIN then confirming it; "unlock" (the normal case)
  // just asks for the existing PIN.
  const[mode,setMode]=useState(hasPin?"unlock":"setup");
  const[pin,setPin]=useState("");
  const[firstPin,setFirstPin]=useState("");
  const[error,setError]=useState(false);
  const[busy,setBusy]=useState(false);

  const shake=()=>{setError(true);setPin("");setTimeout(()=>setError(false),500);};

  const onDigit=d=>{
    if(busy||pin.length>=4)return;
    const next=pin+d;
    setPin(next);
    if(next.length===4)submit(next);
  };
  const onBackspace=()=>{if(!busy)setPin(p=>p.slice(0,-1));};

  const submit=async four=>{
    setBusy(true);
    if(mode==="setup"){
      setFirstPin(four);setPin("");setMode("confirm");setBusy(false);return;
    }
    if(mode==="confirm"){
      if(four!==firstPin){shake();setMode("setup");setFirstPin("");setBusy(false);return;}
      const hash=await hashPin(four,uid);
      try{localStorage.setItem(pinHashKey(uid),hash);}catch(e){}
      onPinSet&&onPinSet();
      setBusy(false);
      onUnlock(); // setting the PIN doubles as confirming the lock — no need to immediately re-enter it
      return;
    }
    // mode === "unlock"
    const hash=await hashPin(four,uid);
    let stored=null;
    try{stored=localStorage.getItem(pinHashKey(uid));}catch(e){}
    setBusy(false);
    if(hash===stored)onUnlock();
    else shake();
  };

  const title=mode==="setup"?"Set a 4-digit PIN":mode==="confirm"?"Confirm your PIN":"Enter PIN to unlock";

// E6: short label for the undo toast — doesn't need TLE's full detail, just
// enough to confirm "yes, that's the one I meant to delete."
const entryShortLabel=e=>{
  if(!e)return"Entry";
  if(e.type==="meal")return e.food||"Meal";
  if(e.type==="liquid"||e.type==="water")return e.liquidType||e.waterTemp||"Drink";
  if(e.type==="exercise")return e.exType||"Exercise";

// N1b: past-note suggestions. Statistical, not AI-generated — deliberate
// choice (see project history): these notes are highly repetitive and exact
// ("60ml Milk + 3/8 Tsp Stevia"), so what's wanted is exact recall of a
// previously-typed string, not a paraphrase that varies each time. Ranked by
// frequency first, most-recent second — a plain frequency table, no model call,
// no network, works offline.
function pastNoteSuggestions(entries,matchFn,limit=4){
  const stats=new Map(); // note text -> {count, lastTs}
  (entries||[]).forEach(e=>{
    if(e.deleted||!matchFn(e))return;
    const note=(e.notes||"").trim();
    if(!note)return;
    const cur=stats.get(note)||{count:0,lastTs:0};
    cur.count++;
    const ts=new Date(e.timestamp).getTime();
    if(!isNaN(ts)&&ts>cur.lastTs)cur.lastTs=ts;
    stats.set(note,cur);
  });
  return[...stats.entries()]
    .sort((a,b)=>b[1].count-a[1].count||b[1].lastTs-a[1].lastTs)
    .slice(0,limit)
    .map(([note])=>note);
}

// E4: a short, human-readable label for one entry, used by the "repeat
// yesterday" chips below. Deliberately separate from the fuller TLE/
// ManageRow formatting (subType, notes, etc. all included there) — this is
// meant to fit on a small chip, just enough to recognize which entry it is.
function repeatChipLabel(e,settings){
  switch(e.type){
    case"meal":return[e.food,e.foodSubType].filter(Boolean).join(" · ")+(e.qty?` · ${e.qty}${e.unit||""}`:"");
    case"liquid":case"water":return[e.liquidType,e.liquidSubType].filter(Boolean).join(" · ")+(e.ml?` · ${e.ml}ml`:"");
    case"exercise":{
      const parts=exerciseMetricParts(e,settings?.exerciseTypes||FD.exerciseTypes);
      return[e.exType,e.subType,...parts].filter(Boolean).join(" · ");
    }
    case"medical":return[e.readingType,e.value?`${e.value}${e.unit?" "+e.unit:""}`:null].filter(Boolean).join(" · ");
    case"medication":return[e.med,e.timing].filter(Boolean).join(" · ");
    default:return"";

// E4: up to 4 of yesterday's entries for this module, closest to the
// CURRENT time first — "what did I log around now, yesterday" is the whole
// point, not strict chronological order. Tapping one re-adds it immediately
// with today's date and the current time (onAdd/addEntry always overwrites
// id/timestamp/date regardless of what's passed in, so the rest of the
// entry can be handed through unchanged).
function RepeatYesterdayChips({entries,type,settings,onAdd,T}){
  const yList=useMemo(()=>{
    const yd=yesterday();
    const nowMin=(()=>{const d=new Date();return d.getHours()*60+d.getMinutes();})();
    const minsOf=ts=>{const d=new Date(ts);return d.getHours()*60+d.getMinutes();};
    // Liquids historically also used the type string "water" for some
    // entries — matched here the same way usageCounts/pastNoteSuggestions
    // already do elsewhere, so a legacy-typed entry from yesterday isn't
    // silently missed from the chips.
    const matches=e=>e.type===type||(type==="liquid"&&e.type==="water");
    return entries
      .filter(e=>e.date===yd&&!e.deleted&&matches(e))
      .sort((a,b)=>Math.abs(minsOf(a.timestamp)-nowMin)-Math.abs(minsOf(b.timestamp)-nowMin))
      .slice(0,4);
  },[entries,type]);
  if(!yList.length)return null;
  return(<div style={{marginBottom:6}}>
    <div style={{fontSize:"0.66rem",color:T.textMuted,marginBottom:3}}>🔁 Repeat from yesterday</div>
    <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
      {yList.map(e=>{
        const label=repeatChipLabel(e,settings);
        if(!label)return null;
        return<button key={e.id} type="button" onClick={()=>onAdd({...e})} title={label}
          style={{padding:"3px 9px",borderRadius:20,border:`1px solid ${T.accentBtn}`,background:T.accentBg,
            color:T.accent,cursor:"pointer",fontSize:"0.71rem",fontFamily:"inherit",fontWeight:600,maxWidth:200,
            overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{label}</button>;
      })}
    </div>
  </div>);
}

// ── Exercise metrics catalog ──────────────────────────────────────────────
// "count" was renamed "Floors" (global, per user decision — it's the term
// already used historically for Stairs; the stored field key stays `count`
// for backward compatibility, only the label/placeholder changed). HR, Steps
// and Speed are new. `kind` drives which input widget renders: "time" gets
// the mm:ss masked input, "decimal"/"integer" get a plain numeric input with
// the right inputMode, "distance" is decimal with a km suffix.
const EXERCISE_METRIC_DEFS=[
  {key:"distance",field:"dist", label:"Distance",placeholder:"km",  kind:"decimal", width:58},
  {key:"time",    field:"time", label:"Time",    placeholder:"mm:ss",kind:"time",   width:64},
  {key:"count",   field:"count",label:"Floors",  placeholder:"Floors",kind:"integer",width:64},
  {key:"hr",      field:"hr",   label:"HR",      placeholder:"HR",   kind:"integer",width:52},
  {key:"steps",   field:"steps",label:"Steps",   placeholder:"Steps",kind:"integer",width:64},
  {key:"speed",   field:"speed",label:"Speed",   placeholder:"km/h", kind:"decimal", width:58},
];
const metricDef=key=>EXERCISE_METRIC_DEFS.find(m=>m.key===key)||{key,field:key,label:key,placeholder:key,kind:"decimal",width:56};

// N: Firebase Realtime Database does not persist empty arrays or objects —
// writing metrics:[] gets silently DROPPED from what's actually stored, so
// on the next load the key is simply ABSENT. That's indistinguishable from
// "never configured", which incorrectly falls back to the factory default —
// this is exactly why LogJam kept reverting to ["time"] even after being
// explicitly emptied: the empty array never actually survived the save.
//
// A sentinel fixes it: an intentionally-empty metrics list is stored as
// [METRICS_EMPTY_SENTINEL] — a real, NON-empty array, which Firebase keeps
// normally — rather than []. normalizeMetrics decodes it back to [] for
// every reader; encodeMetrics re-applies the sentinel only when a write
// would otherwise produce a genuinely empty array.
const METRICS_EMPTY_SENTINEL="__none__";
// Returns: null if metrics is genuinely unset (caller should fall back to
// factory defaults), or the real effective array otherwise (possibly []).
const normalizeMetrics=raw=>{
  if(!Array.isArray(raw))return null;
  if(raw.length===1&&raw[0]===METRICS_EMPTY_SENTINEL)return[];
  return raw;
};
const encodeMetrics=arr=>(arr&&arr.length?arr:[METRICS_EMPTY_SENTINEL]);

// N: same root cause, different fields — "Clear [section]" writes a literal
// empty foodCategories:[]/liquidNotes:{}/etc via the same whole-settings
// .set() call, so it hits the identical Firebase quirk: an intentionally
// cleared list silently reverts to the factory defaults on next load,
// instead of staying empty. Deliberately a SEPARATE, more general pair from
// the metrics-specific one above — metrics already shipped and is confirmed
// working; this covers every other clearable config list/map without
// touching that code path. Decoding happens once, at settings LOAD time
// (see norm() below) — everything downstream just sees a real [] or {},
// so none of the many scattered `settings.xxx||FD.xxx` reads need to change.
const EMPTY_SENTINEL_KEY="__empty__";
const encodeEmptyList=arr=>(arr&&arr.length?arr:[EMPTY_SENTINEL_KEY]);
const decodeEmptyList=arr=>(Array.isArray(arr)&&arr.length===1&&arr[0]===EMPTY_SENTINEL_KEY)?[]:arr;
const encodeEmptyMap=obj=>(obj&&Object.keys(obj).length?obj:{[EMPTY_SENTINEL_KEY]:true});
const decodeEmptyMap=obj=>(obj&&typeof obj==="object"&&!Array.isArray(obj)&&Object.keys(obj).length===1&&obj[EMPTY_SENTINEL_KEY]===true)?{}:obj;
// Applies the encode step to every field capable of being cleared to empty —
// one place to update if a new clearable config field is ever added, rather
// than three separate call sites drifting out of sync.
const encodeSettingsForFirebase=obj=>{
  const out={...obj};
  ["foodCategories","liquidTypes","exerciseTypes","medicalPresets","medications"].forEach(k=>{
    if(out[k]!==undefined)out[k]=encodeEmptyList(out[k]);
  });
  ["liquidNotes","liquidSubTypes"].forEach(k=>{
    if(out[k]!==undefined)out[k]=encodeEmptyMap(out[k]);
  });
